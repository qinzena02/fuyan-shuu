<section class="hero"><small>長明府 · 公開文獻查詢</small><h1>咸陵典籍庫</h1><p>山河有跡，眾生有名。凡可公開之事，皆存卷中。</p></section>

    body:`恆天樓為長明府所屬機構，統籌地脈能源與符機網絡，亦被稱為「符機中樞」。`,
    sections:[{title:'相關人員',items:[['紀不允','任職於恆天樓，協助地脈能源與符機網絡相關符術工作。詳細資料見人物檔案。']]}]},

    body:`赤霄弟子多性情冷冽，少有迂迴試探。他們敢愛敢恨，敢勝敢敗，行事重視本心與抉擇。`,

    body:`任職於鏢局，所屬門派為赤霄山莊。對機關符術有著異常的親和力。`,

  {
    id:'shilu',
    category:'制度',
    title:'示籙',
    summary:'咸陵居民的身分登記',
    body:`示籙為長明府於承光三百十二年正式接管並推行的官方身份憑證制度，前身為淮苑府時期所使用的戶籍符牒。長明府統一各地戶籍、身份與通行制度後，將傳統符牒改製為可與天眼、脈軌及各地官署符機連接的「示籙」，作為咸陵境內居民確認身份與使用公共制度的重要憑證。依長明府律令，嬰兒出生後三個月內，須由父母或法定監護人至所在地官署完成登錄。完成登錄後，示籙將記載其姓名、出生年月、籍貫、家屬關係與戶籍等基本資料，並由官署符機建立對應的身份檔案。`},
  {
    id:'jinbu',
    category:'制度',
    title:'禁步',
    summary:'隨身佩戴的制度器物',
    body:`佩禁步，知進退，明得失。禁步——咸陵人一生相隨之物。古時為佩玉，取「行有所止、進退有度」之意。長明府建立新制後，沿用其名，以符機與地脈技術重製，使其兼具身份識別、德數記錄之用。禁步中央嵌著一枚薄如蟬翼的明晶，平日只是溫潤的玉色。當持有者靠近天眼、查驗台或主城的公共設施時，禁步便會自行與其連接，玉面上的細密符紋會隨之亮起，以光紋的長短、明暗與完整程度呈現當前德數。`},
  {
    id:'rende',
    category:'制度',
    title:'仁德值',
    summary:'規範言行的評量制度',
    body:`長明府用於衡量個人社會貢獻與德行的數值，記錄於每個人所佩戴的禁步之中。其也細分成禮、仁、愛，它們並非單純代表財富或地位，而是由一個人在日常生活中的行為、工作、義務與對他人的付出共同累積。德數越高，可享有的公共資源與社會權限通常也越多。`},
  {
    id:'dimai',
    category:'典籍',
    title:'地脈',
    summary:'咸陵文明的根基',
    body:`祂存在於山川、河流與大地深處，由地下長年累積並流動的特殊能量構成。其分布並不固定，而是會隨地形、水系、季節與地質變化產生流動，因此自古便有「山有脈、水有源」之說。世界革新後，長明府逐步完成對地脈的探測與開發，將其轉化為可供城市使用的能源。如今，咸陵的脈軌、能源井、符機、城市照明與各類公共設施，皆建立於地脈系統之上。為確保地脈穩定運行，長明府在各地設置脈站與能源井，監測地脈流向與能量變化，再透過符術與機械進行轉換與輸送。地脈能源經由城市脈網分配，最終進入千家萬戶。`},
  {

如今流傳於世的內容分為五部，分藏於五大門派，各自記錄對地脈的不同理解。`}
];
const categories=['全部','機構','門派','人物','制度','典籍'];
let activeCategory='全部';let selectedId='changming';
const filters=document.getElementById('filters');const list=document.getElementById('list');const detail=document.getElementById('detail');const search=document.getElementById('search');
function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
function showDetail(item){detail.replaceChildren();if(!item){detail.appendChild(el('p','請選擇一筆典籍條目。','note'));return;}detail.appendChild(el('div','長明府 · '+item.category+'檔案','eyebrow'));detail.appendChild(el('h2',item.title));detail.appendChild(el('span',item.category,'tag'));detail.appendChild(el('p',item.body));(item.sections||[]).forEach(section=>{detail.appendChild(el('h3',section.title,'section-title'));section.items.forEach(pair=>{const box=el('div',undefined,'subentry');box.appendChild(el('strong',pair[0]));box.appendChild(el('p',pair[1]));detail.appendChild(box);});});}
function render(){filters.replaceChildren();categories.forEach(cat=>{const button=el('button',cat,'filter'+(cat===activeCategory?' active':''));button.type='button';button.addEventListener('click',()=>{activeCategory=cat;render();});filters.appendChild(button);});const query=search.value.trim().toLocaleLowerCase();const found=records.filter(item=>(activeCategory==='全部'||item.category===activeCategory)&&[item.title,item.summary,item.body,...(item.sections||[]).flatMap(s=>[s.title,...s.items.flat()])].join(' ').toLocaleLowerCase().includes(query));list.replaceChildren();if(!found.length){list.appendChild(el('p','查無符合的公開條目。','empty'));showDetail(null);return;}if(!found.some(item=>item.id===selectedId))selectedId=found[0].id;found.forEach(item=>{const button=el('button',undefined,'entry'+(item.id===selectedId?' selected':''));button.type='button';button.appendChild(el('span',item.title));button.appendChild(el('small',item.category+' · '+item.summary));button.addEventListener('click',()=>{selectedId=item.id;render();if(window.innerWidth<=700)detail.scrollIntoView({behavior:'smooth',block:'start'});});list.appendChild(button);});showDetail(found.find(item=>item.id===selectedId));}
search.addEventListener('input',render);
let player = null;
try { player = JSON.parse(localStorage.getItem('fuyanshu_player') || 'null'); } catch (error) { console.warn('示籙資料格式錯誤', error); }
if (!player || !player.name) window.location.replace('index.html');
render();
