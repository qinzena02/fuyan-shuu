<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>負驗書｜萬象傳書管理臺</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#091315;color:#d9d5c6;font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;line-height:1.8}a{color:#b5d6cd}header{border-bottom:1px solid #3a5d55;background:#0d1c1e;padding:18px max(20px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{color:#dfc694;letter-spacing:4px;font-size:22px}.muted{color:#92ada4;font-size:13px}main{max-width:1060px;margin:0 auto;padding:35px 20px 80px}h1,h2{font-weight:400;color:#e5cb99}h1{font-size:29px;letter-spacing:3px;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;margin-top:28px}.panel{border:1px solid #3b6056;background:#102123;padding:24px;border-radius:8px}.field{display:block;margin:14px 0 6px;color:#c5d3c8;font-size:14px}select,textarea,input{width:100%;background:#091719;border:1px solid #54746a;color:#f1e6ce;border-radius:5px;padding:11px 13px;font:inherit;font-size:14px}textarea{resize:vertical;min-height:160px}button{background:#1b3a37;border:1px solid #9d895e;color:#eed9aa;padding:9px 15px;border-radius:5px;font:inherit;cursor:pointer}button:hover:not(:disabled){background:#28524b}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#987f50;color:#101b19;border-color:#c5ab77;font-weight:bold}.primary:hover:not(:disabled){background:#c2a56b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.hint{color:#91b1a7;font-size:12px}.status{margin:20px 0;padding:13px 16px;border:1px solid #45685c;background:#142c2b;border-radius:5px}.status.error{border-color:#a45c5c;color:#f5b6b6}.status.success{border-color:#609b7d;color:#c0edce}.item{border-top:1px solid #2e4d45;padding:17px 0}.item:first-of-type{border-top:0}.item-title{color:#e8d2a6}.item-meta{font-size:12px;color:#9ab6aa}.item-body{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.item-actions{display:flex;gap:8px;flex-wrap:wrap}.item-actions button{font-size:12px;padding:5px 10px}.danger{border-color:#985b5b;color:#f1b0b0}.hidden{display:none!important}.counter{text-align:right;font-size:12px;color:#8eb4aa}.pill{border:1px solid #54756c;padding:2px 8px;border-radius:99px;font-size:11px;color:#9dc8b9}#gate{max-width:640px;margin:36px auto}.empty{color:#8da69c;font-size:14px}footer{text-align:center;font-size:12px;color:#658b80;padding:30px}@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{padding:18px}}
</style>
</head>
<body>
<header><div class="brand">負驗書 <span class="muted">／ 萬象傳書管理臺</span></div><a href="city.html">返回咸陵主城 ↗</a></header>
<main>
<h1>官方傳書 · 管理臺</h1><p class="muted">以官方角色身分撰寫與發布書札。管理權限由 Supabase 驗證。</p>
<div id="status" class="status" role="status" aria-live="polite">正在核驗管理員身分……</div>
<section id="gate" class="panel hidden"><h2>無法進入管理臺</h2><p id="gateText">請先以管理員帳號登入《負驗書》。</p><a href="index.html">前往示籙登入 →</a></section>
<div id="workspace" class="layout hidden">
<section class="panel"><h2 id="editorTitle">撰寫官方書札</h2><label class="field" for="character">發文角色</label><select id="character"></select>
<label class="field" for="body">書札內容</label><textarea id="body" maxlength="3000" placeholder="請以角色的語氣撰寫……"></textarea><div id="counter" class="counter">0 / 3000</div>
<label class="field" for="visibility">可見範圍</label><select id="visibility"><option value="public">全服公開</option><option value="story">劇情解鎖（目前僅能儲存草稿）</option></select>
<label class="field" for="unlockStory">劇情條件代碼（預留）</label><input id="unlockStory" maxlength="100" placeholder="例如 main_ch1；尚未啟用解鎖驗證" disabled>
<p class="hint">劇情解鎖功能尚未接入雲端存檔驗證，因此劇情貼文目前只能儲存草稿。公開貼文發布後，將可由玩家端讀取。</p>
<div class="actions"><button id="saveDraft">儲存草稿</button><button id="publish" class="primary">正式發布</button><button id="reset">清空／取消編輯</button></div>
</section>
<section class="panel"><h2>官方書札紀錄</h2><div class="actions"><button id="refresh">重新整理</button><span class="pill" id="total">0 篇</span></div><div id="posts" class="empty">正在載入貼文……</div></section>
</div>
</main><footer>長明府 · 官方傳訊權限核驗</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(()=>{'use strict';
const db=window.fuyanshuDB;const $=id=>document.getElementById(id);let currentUser=null;let characters=[];let posts=[];let editing=null;let busy=false;
function notify(message,type=''){const el=$('status');el.textContent=message;el.className='status '+type;}
function gate(message){$('workspace').classList.add('hidden');$('gate').classList.remove('hidden');$('gateText').textContent=message;}
function setBusy(value){busy=value;['saveDraft','publish','reset','refresh'].forEach(id=>$(id).disabled=value);}
function errorText(error){return error?.message||String(error||'未知錯誤');}
function resetForm(){editing=null;$('editorTitle').textContent='撰寫官方書札';$('body').value='';$('visibility').value='public';$('unlockStory').value='';$('character').disabled=false;updateForm();}
function updateForm(){const len=$('body').value.trim().length;$('counter').textContent=$('body').value.length+' / 3000';$('unlockStory').disabled=$('visibility').value!=='story';$('publish').disabled=busy||len===0||$('visibility').value==='story';$('saveDraft').disabled=busy||len===0;}
async function loadCharacters(){const {data,error}=await db.from('character_social_profiles').select('character_id,handle,is_active,characters(name,is_public)').eq('is_active',true);if(error)throw error;characters=(data||[]).filter(x=>x.characters?.is_public);const select=$('character');select.replaceChildren();for(const c of characters){const o=document.createElement('option');o.value=c.character_id;o.textContent=c.characters.name+' · @'+c.handle;select.appendChild(o);}if(!characters.length){notify('目前沒有已啟用且公開的角色帳號，請先檢查角色資料。','error');}}
async function loadPosts(){const {data,error}=await db.from('social_posts').select('id,author_character_id,author_user_id,body,status,visibility,unlock_story_id,created_at,published_at').not('author_character_id','is',null).order('created_at',{ascending:false}).limit(100);if(error)throw error;posts=data||[];renderPosts();}
function renderPosts(){const root=$('posts');root.replaceChildren();$('total').textContent=posts.length+' 篇（最多顯示 100 篇）';if(!posts.length){root.textContent='尚無官方貼文。可以從左側建立第一篇。';return;}for(const p of posts){const item=document.createElement('article');item.className='item';const title=document.createElement('div');title.className='item-title';const c=characters.find(x=>x.character_id===p.author_character_id);title.textContent=(c?.characters?.name||'未啟用角色')+' · '+(p.status==='published'?'已發布':'草稿');const meta=document.createElement('div');meta.className='item-meta';meta.textContent=(p.visibility==='story'?'劇情限定':'全服公開')+' · '+new Date(p.created_at).toLocaleString('zh-TW');const content=document.createElement('div');content.className='item-body';content.textContent=p.body;const actions=document.createElement('div');actions.className='item-actions';const edit=document.createElement('button');edit.type='button';edit.textContent='編輯';edit.addEventListener('click',()=>editPost(p));const del=document.createElement('button');del.type='button';del.textContent='刪除';del.className='danger';del.addEventListener('click',()=>deletePost(p));actions.append(edit,del);item.append(title,meta,content,actions);root.appendChild(item);}}
function editPost(p){editing=p.id;$('editorTitle').textContent='編輯官方書札';$('character').value=p.author_character_id;$('character').disabled=true;$('body').value=p.body;$('visibility').value=p.visibility;$('unlockStory').value=p.unlock_story_id||'';updateForm();window.scrollTo({top:0,behavior:'smooth'});notify('正在編輯：'+(p.status==='published'?'已發布貼文':'草稿')+'。按「正式發布」將公開更新後的內容。');}
async function save(status){if(busy)return;const body=$('body').value.trim();const characterId=$('character').value;const visibility=$('visibility').value;if(!body||body.length>3000||!characterId){notify('請選擇角色並輸入 1 至 3000 字的內容。','error');return;}if(status==='published'&&visibility==='story'){notify('劇情貼文尚未建立解鎖驗證，請先儲存草稿。','error');return;}if(!characters.some(c=>c.character_id===characterId)){notify('角色帳號未啟用。','error');return;}setBusy(true);try{const payload={body,visibility,status,unlock_story_id:visibility==='story'?($('unlockStory').value.trim()||null):null,published_at:status==='published'?new Date().toISOString():null,updated_at:new Date().toISOString()};let result;if(editing){result=await db.from('social_posts').update(payload).eq('id',editing).not('author_character_id','is',null).select('id');}else{result=await db.from('social_posts').insert({...payload,author_character_id:characterId,author_user_id:null}).select('id');}if(result.error)throw result.error;if(!result.data?.length)throw new Error('資料未更新，請檢查管理員權限。');resetForm();await loadPosts();notify(status==='published'?'官方書札已發布。':'草稿已儲存。','success');}catch(e){notify('儲存失敗：'+errorText(e),'error');}finally{setBusy(false);updateForm();}}
async function deletePost(p){if(busy)return;if(!window.confirm('確定永久刪除這篇官方書札？此操作無法復原。'))return;setBusy(true);try{const {data,error}=await db.from('social_posts').delete().eq('id',p.id).not('author_character_id','is',null).select('id');if(error)throw error;if(!data?.length)throw new Error('刪除未成功，請檢查權限。');if(editing===p.id)resetForm();await loadPosts();notify('貼文已刪除。','success');}catch(e){notify('刪除失敗：'+errorText(e),'error');}finally{setBusy(false);updateForm();}}
$('body').addEventListener('input',updateForm);$('visibility').addEventListener('change',updateForm);$('saveDraft').addEventListener('click',()=>save('draft'));$('publish').addEventListener('click',()=>save('published'));$('reset').addEventListener('click',()=>{resetForm();notify('已清空編輯內容。');});$('refresh').addEventListener('click',async()=>{try{setBusy(true);await loadPosts();notify('貼文列表已更新。','success');}catch(e){notify('讀取失敗：'+errorText(e),'error');}finally{setBusy(false);updateForm();}});
(async()=>{try{if(!db)throw new Error('Supabase 客戶端未載入');const {data,error}=await db.auth.getUser();if(error)throw error;currentUser=data?.user;if(!currentUser){gate('目前沒有有效的 Supabase 登入工作階段，請先登入《負驗書》。');notify('尚未登入。','error');return;}const admin=await db.from('social_admins').select('user_id').eq('user_id',currentUser.id).maybeSingle();if(admin.error)throw admin.error;if(!admin.data){gate('目前登入的帳號不在管理員名單中。');notify('無管理員權限。','error');return;}await loadCharacters();await loadPosts();$('workspace').classList.remove('hidden');$('gate').classList.add('hidden');resetForm();notify('管理員身分核驗成功。可以開始撰寫官方書札。','success');}catch(e){gate('無法完成權限核驗：'+errorText(e));notify('後台載入失敗：'+errorText(e),'error');}})();
})();
</script>
</body></html>
