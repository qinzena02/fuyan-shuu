<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>負驗書｜咸陵行旅</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#091113;color:#e2d2af;font-family:"Microsoft JhengHei",serif}
#page{display:block;width:100%;height:100%;height:100dvh;border:0;background:#091113}
#controls{position:fixed;bottom:16px;right:16px;z-index:999;display:flex;align-items:center;gap:8px;background:rgba(9,23,25,.94);border:1px solid #806f50;padding:9px 12px;box-shadow:0 5px 22px #0008;border-radius:4px}
#toggle{background:transparent;color:#dfc899;border:0;cursor:pointer;font:inherit;font-size:13px;padding:4px}
#hint{color:#8fbeb0;font-size:11px;max-width:150px}
@media(max-width:500px){#controls{bottom:10px;right:10px;padding:6px 9px}#hint{display:none}}
/* 通知改由城中通行的萬象傳書螢光藍點呈現，保留後台同步 */
#fys-notice-bell,#fys-notice-panel,#fys-notice-toast{display:none!important}
/* 全域傳書通知：位於 iframe 外層 */
#fys-notice-bell{position:fixed;top:14px;right:17px;z-index:1100;background:#102b2a;border:1px solid #987f54;color:#e7ce99;border-radius:999px;padding:9px 13px;font:inherit;font-size:17px;cursor:pointer;box-shadow:0 5px 20px #0009}
#fys-notice-count{display:inline-block;background:#b89b67;color:#091113;font-size:11px;border-radius:999px;min-width:19px;line-height:19px;margin-left:5px;text-align:center;font-family:Arial,sans-serif}
#fys-notice-count[hidden],#fys-notice-bell[hidden],#fys-notice-panel[hidden],#fys-notice-toast[hidden]{display:none!important}
#fys-notice-panel{position:fixed;z-index:1101;top:62px;right:16px;width:min(370px,calc(100vw - 32px));max-height:min(65vh,550px);overflow:auto;background:#102224;border:1px solid #796d51;border-radius:12px;box-shadow:0 14px 42px #000b;padding:15px}
.fys-notice-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;color:#e7ce99}
#fys-notice-readall{border:0;background:transparent;color:#a6c8ba;font:inherit;font-size:12px;cursor:pointer}
.fys-notice-item{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;border:0;border-top:1px solid #29453f;background:transparent;color:#c2d4c9;padding:11px 5px;font:inherit;cursor:pointer}
.fys-notice-item.unread{background:#1b373344}.fys-notice-item strong{font-size:13px;font-weight:normal;color:#e6d3ac}.fys-notice-item small{font-size:11px;color:#86a79c}
#fys-notice-toast{position:fixed;z-index:1102;top:69px;right:16px;max-width:min(370px,calc(100vw - 32px));background:#18342f;border:1px solid #bda170;border-radius:10px;box-shadow:0 8px 30px #000b}
#fys-notice-toast button{padding:13px 17px;border:0;background:transparent;color:#f0dba9;font:inherit;font-size:13px;cursor:pointer;text-align:left}
@media(max-width:500px){#fys-notice-bell{top:9px;right:9px;padding:7px 10px}#fys-notice-panel{top:53px;right:9px}#fys-notice-toast{top:59px;right:9px}}
</style>
</head>
<body>
<iframe id="page" title="負驗書遊戲內容" src="city.html"></iframe>
<div id="controls"><button id="toggle" type="button" aria-pressed="false">♫ 開啟主城音樂</button><span id="hint">咸陵行旅 · 背景配樂</span></div>
<button id="fys-notice-bell" type="button" aria-label="傳書通知" aria-controls="fys-notice-panel" hidden><span aria-hidden="true">♧</span> <span aria-hidden="true">✉</span><span id="fys-notice-count" hidden>0</span></button>
<div id="fys-notice-panel" role="region" aria-label="傳書通知中心" hidden><div class="fys-notice-heading"><span>萬象傳書 · 通知</span><button id="fys-notice-readall" type="button">全部已讀</button></div><div id="fys-notice-list"></div></div>
<div id="fys-notice-toast" role="status" aria-live="polite" hidden></div>
<audio id="music" src="music/lv_0_20260927142906.mp3" preload="auto" loop></audio>
<script>
'use strict';
const allowed=new Set(['city.html','archive.html','bounty.html','story.html','main-story.html','main-chapters.html','main-chapter-1.html','personal.html','travel.html','social.html','characters.html','character.html']);
const frame=document.getElementById('page'),music=document.getElementById('music'),toggle=document.getElementById('toggle'),controls=document.getElementById('controls'),hint=document.getElementById('hint');
const initial=new URLSearchParams(location.search).get('page');
const deepLink=new URLSearchParams(location.search);
const frameUrl=new URL(allowed.has(initial)?initial:'city.html',location.href);
if(initial==='social.html'){for(const key of ['post','comment']){const value=deepLink.get(key);if(value)frameUrl.searchParams.set(key,value);}}
frame.src=frameUrl.href;
music.volume=.22;
let enabled=localStorage.getItem('fuyanshu_city_music')!=='off';
let isCase=false;
const storyPages=new Set(['story.html','main-story.html','main-chapters.html','main-chapter-1.html']);
function update(){toggle.textContent=enabled?(music.paused?'♫ 播放主城音樂':'♫ 暫停主城音樂'):'♫ 開啟主城音樂';toggle.setAttribute('aria-pressed',String(enabled&&!music.paused));}
async function play(){if(!enabled||isCase)return;try{await music.play();hint.textContent='咸陵行旅 · 背景配樂';}catch(e){hint.textContent='點擊音樂按鈕開始播放';}update();}
function currentPage(){try{return new URL(frame.contentWindow.location.href).pathname.split('/').pop()||'city.html';}catch(e){return 'city.html';}}
frame.addEventListener('load',()=>{
 const page=currentPage();isCase=storyPages.has(page);
 controls.style.display=isCase?'none':'flex';
 if(isCase){music.pause();music.currentTime=0;}else play();
 update();
 // 讓玩家從案件返回鏢局後恢復主城音樂。
 try{if(allowed.has(page)){const params=new URLSearchParams(location.search);params.set('page',page);if(page!=='social.html'){params.delete('post');params.delete('comment');}history.replaceState(null,'','?'+params.toString());}}catch(e){}
 // 將未讀狀態同步至城中通行；萬象傳書內頁保留自己的通知中心。
 if(window.fysSendUnreadToCity)window.fysSendUnreadToCity();
});
toggle.addEventListener('click',()=>{
 if(enabled&&!music.paused){enabled=false;music.pause();}
 else{enabled=true;play();}
 localStorage.setItem('fuyanshu_city_music',enabled?'on':'off');update();
});
// 玩家在頁面內首次互動時，解除瀏覽器的自動播放限制。
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data==='fuyanshu-interaction')play();});
music.addEventListener('error',()=>{hint.textContent='找不到音樂檔案';});
update();play();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="global-notifications.js"></script>
</body></html>
