</style></head><body><header><div class="brand">負驗書 · 主線卷宗</div><a href="city.html">← 返回咸陵主城</a></header><main><div class="eyebrow">MAIN STORY · ARCHIVE</div><h1>天地不問來處</h1><p>承光年間，北城第三更。卷宗既啟，行跡有痕。</p><section class="chapter" aria-label="主線章節目錄">
<p class="archive-intro">承光年間，行跡有痕。此處收錄主線卷宗，循章啟卷，續寫咸陵未盡之事。</p>
<article class="chapter-row"><div class="tag">卷一 · 序幕</div><div><h2>《北城，箭過長街》</h2><div id="progress" class="muted" aria-live="polite">正在檢查閱讀進度……</div></div><div class="actions"><a class="btn" id="continue" href="main-story.html">啟卷閱讀 ↗</a><a class="btn sub" id="review" href="main-story.html?mode=review">回顧序幕 ↗</a></div></article>
<article class="chapter-row"><div class="tag">卷一 · 第一章</div><div><h2>《第三更未盡》</h2><div id="chapterOneProgress" class="muted" aria-live="polite">正在檢查閱讀進度……</div></div><div class="actions"><a class="btn" href="main-chapter-1.html">啟卷閱讀 ↗</a><a class="btn sub" id="chapterOneReview" href="main-chapter-1.html?mode=review">回顧第一章 ↗</a></div></article>
<article class="chapter-row locked"><div class="tag">卷一 · 第二章</div><h2>未公開章節</h2><span class="sealed">封存中</span></article>
<p class="warning">回顧模式不會覆寫正式存檔、線索或人物交集。</p>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
(function(){
 const progress=document.getElementById('progress');
 const review=document.getElementById('review');
 try{const saved=JSON.parse(localStorage.getItem('fuyanshu_main_vol1_v1')||'null');if(saved&&typeof saved.scene==='string'){
 progress.textContent=saved.scene==='ending'?'本機紀錄：序幕已完成':'本機紀錄：序幕進行中';
 }else{progress.textContent='尚未開始序幕';review.style.display='none';}}
 catch(e){progress.textContent='尚未開始序幕';review.style.display='none';}
// 第一章以雲端 main_ch1 為準；離線時使用新版本機紀錄。
const chapterProgress=document.getElementById('chapterOneProgress');
const chapterReview=document.getElementById('chapterOneReview');
const chapterContinue=document.querySelector('a[href="main-chapter-1.html"]');
const scenes=['第一幕 · 北城夜行','第二幕 · 紅線之內','第二幕 · 鏢單與舊脈','第三幕 · 來人','第三幕 · 舊渠','第三幕 · 缺筆'];
function validChapter(data){return data&&Number.isInteger(data.index)&&data.index>=0&&data.index<scenes.length;}
function renderChapter(data,source){
 if(!validChapter(data)){
   chapterProgress.textContent=source==='cloud'?'雲端紀錄：尚未開始第一章':'尚未開始第一章';
   chapterReview.style.display='none';
   return;
 }
 const finished=data.complete===true;
 chapterProgress.textContent=finished?'第一章已完成 · 雲端進度已保存'.replace('雲端',source==='cloud'?'雲端':'本機')
   :`${source==='cloud'?'雲端':'本機'}進度：${scenes[data.index]} · 第 ${data.index+1}／${scenes.length} 段`;
 chapterReview.style.display='';
 if(chapterContinue)chapterContinue.textContent=finished?'重新開啟第一章 ↗':'啟卷 · 繼續閱讀 ↗';
}
let localChapter=null;
try{localChapter=JSON.parse(localStorage.getItem('fuyanshu_main_chapter1_v2')||'null');
 if(!validChapter(localChapter))localChapter=JSON.parse(localStorage.getItem('fuyanshu_main_chapter1_v1')||'null');
}catch(e){}
renderChapter(localChapter,'local');
(async()=>{
 try{
   const db=window.fuyanshuDB;
   if(!db)return;
   const {data:auth,error:authError}=await db.auth.getUser();
   if(authError||!auth?.user)return;
   const {data,error}=await db.rpc('load_main_chapter_progress',{p_story_id:'main_ch1'});
   if(error)throw error;
   renderChapter(data,'cloud');
 }catch(e){
   if(!validChapter(localChapter))chapterProgress.textContent='雲端暫時無法讀取，請稍後重新整理';
   console.warn('主線目錄讀取雲端進度失敗',e);
 }
})();
})();
</script></body></html>
