<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>負驗書｜人物誌編輯後台</title><style>
:root{color-scheme:dark;--bg:#0b1717;--panel:#112726;--line:#3c5e55;--gold:#e4c894;--cyan:#69e0d0;--ink:#d5e1d7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a3630,var(--bg) 60%);color:var(--ink);font:15px/1.7 'Microsoft JhengHei',sans-serif}header{border-bottom:1px solid var(--line);padding:18px max(22px,calc((100% - 1160px)/2));display:flex;justify-content:space-between;gap:14px}a{color:#a5d2c4;text-decoration:none}h1,h2{color:var(--gold);font-weight:400;letter-spacing:.12em}h1{font-size:30px;margin:4px 0}h2{font-size:19px}main{max-width:1160px;margin:35px auto 90px;padding:0 20px}.sub{color:#86aaa0;font-size:12px;letter-spacing:.15em}.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;margin-top:26px}.panel{border:1px solid var(--line);background:#102522d9;padding:23px;border-radius:8px}.sidebar{align-self:start}button,input,textarea,select{font:inherit}button{background:#1b3b36;border:1px solid #a28b61;color:var(--gold);padding:9px 16px;border-radius:5px;cursor:pointer}button:hover{border-color:var(--cyan)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#236254;color:#fff0c7}.ghost{background:transparent;border-color:#47695d}.list{margin-top:15px;display:grid;gap:7px}.item{width:100%;text-align:left;border-color:#36564d;color:#c3d5cb;background:#102824}.item.active{border-color:var(--cyan);color:#fff0cc}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:15px}label{font-size:13px;color:#b6c9bc}input,textarea,select{width:100%;background:#0b1d1d;border:1px solid #426157;color:#e7eadb;border-radius:5px;padding:10px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--cyan)}textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 17px}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.message{padding:10px 13px;border-left:2px solid var(--cyan);background:#17342f;margin:14px 0;white-space:pre-wrap}.message.error{border-color:#ff9e96;color:#ffb4a8}.muted{color:#8ba99d;font-size:13px}.note{border:1px solid #37554d;padding:16px;margin:12px 0}.note .bar{margin-top:8px}.preview{display:flex;gap:12px;align-items:center;margin:12px 0}.preview img{height:74px;width:74px;object-fit:cover;border:1px solid #7eab9c}hr{border:0;border-top:1px solid #35574e;margin:25px 0}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.two{grid-template-columns:1fr}header{padding:15px 18px}}
</style></head><body><header><span style="color:var(--gold)">負驗書 · 人物誌管理</span><a href="characters.html">← 返回人物誌</a></header><main><div class="sub">AUTHOR CONSOLE / CHARACTER ARCHIVE</div><h1>人物誌 · 編修卷宗</h1><p class="muted">此處僅供授權作者使用。人物誌肖像與萬象傳書頭像分開儲存；未公開角色不會出現在玩家的人物誌。</p><div id="message" class="message">正在驗證作者身分……</div><div id="app" class="layout hidden"><aside class="panel sidebar"><button id="new" class="primary" type="button" style="width:100%">＋ 新增角色</button><div id="list" class="list"></div></aside><section class="panel"><h2 id="form-title">新增人物</h2><form id="editor"><div class="two"><div class="field"><label for="key">角色識別碼（建立後不可更改） *</label><input id="key" required pattern="[a-z0-9_]+" placeholder="例如 ji_buyun"></div><div class="field"><label for="name">角色姓名 *</label><input id="name" required></div><div class="field"><label for="faction">所屬門派／勢力</label><input id="faction"></div><div class="field"><label for="title">職位／身分</label><input id="title"></div></div><div class="field"><label><input id="public" type="checkbox" style="width:auto;margin-right:8px">公開人物檔案（未勾選只有管理員能看）</label></div><div class="two"><div class="field"><label for="portrait">人物誌專用肖像網址</label><input id="portrait" type="url" placeholder="https://..."></div><div class="field"><label for="avatar">萬象傳書社交頭像網址</label><input id="avatar" type="url" placeholder="https://..."></div></div><div class="field"><label for="cover">人物專屬封面背景網址（可填 images/xxx.jpg）</label><input id="cover" placeholder="images/tobi-44.jpg"></div><div class="field"><label for="quote">人物引言</label><textarea id="quote" rows="2"></textarea></div><div class="two"><div class="field"><label for="mbti">MBTI</label><input id="mbti"></div><div class="field"><label for="weapon">慣用武器</label><input id="weapon"></div><div class="field"><label for="location">目前所在地</label><input id="location"></div><div class="field"><label for="tags">印象標籤（以逗號分隔）</label><input id="tags" placeholder="寡言, 符術, 舊脈"></div></div><div class="field"><label for="appearance">外貌描述</label><textarea id="appearance"></textarea></div><div class="field"><label for="personality">性格</label><textarea id="personality"></textarea></div><div class="field"><label for="conduct">行事風格</label><textarea id="conduct"></textarea></div><div class="field"><label for="biography">人物生平</label><textarea id="biography"></textarea></div><div class="field"><label for="strengths">擅長之事</label><textarea id="strengths"></textarea></div><div class="field"><label for="dislikes">厭惡之事</label><textarea id="dislikes"></textarea></div><div class="bar"><button id="save" class="primary" type="submit">儲存人物檔案</button><a id="view" class="muted" href="characters.html" target="_blank" rel="noopener">預覽公開人物頁 ↗</a></div></form><hr><h2>軼聞雜談</h2><p class="muted">請先儲存角色，才能新增雜談。「劇情解鎖」暫時不對玩家顯示，等我們完成伺服器端解鎖驗證後再開放。</p><div id="notes"></div><button id="add-note" type="button" class="ghost">＋ 新增雜談</button></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script>
'use strict';const db=window.fuyanshuDB;const $=id=>document.getElementById(id);let chars=[],current=null,notes=[];const fields=['name','faction','title','portrait','avatar','cover','quote','mbti','weapon','location','tags','appearance','personality','conduct','biography','strengths','dislikes'];function msg(s,error=false){$('message').textContent=s;$('message').classList.toggle('error',error)}function v(id){return $(id).value.trim()}function val(id,s){$(id).value=s||''}function renderList(){$('list').replaceChildren();for(const c of chars){const b=document.createElement('button');b.type='button';b.className='item'+(current===c.character_key?' active':'');b.textContent=c.name+(c.is_public?' · 公開':' · 草稿');b.onclick=()=>openChar(c.character_key);$('list').append(b)}}function reset(){current=null;$('editor').reset();$('key').disabled=false;$('form-title').textContent='新增人物';$('view').href='characters.html';notes=[];renderNotes();renderList()}async function loadList(){const {data,error}=await db.from('characters').select('id,character_key,name,faction,title,biography,avatar_url,portrait_url,is_public').order('created_at');if(error)throw error;chars=data||[];renderList()}
async function openChar(key){const c=chars.find(x=>x.character_key===key);if(!c)return;current=key;$('form-title').textContent='編修 · '+c.name;val('key',key);$('key').disabled=true;for(const [id,prop] of [['name','name'],['faction','faction'],['title','title'],['portrait','portrait_url'],['avatar','avatar_url'],['biography','biography']])val(id,c[prop]);$('public').checked=!!c.is_public;for(const id of ['cover','quote','mbti','weapon','location','tags','appearance','personality','conduct','strengths','dislikes'])val(id,'');$('view').href='character.html?id='+encodeURIComponent(key);const {data,error}=await db.from('character_dossiers').select('*').eq('character_id',c.id).maybeSingle();if(error){msg('讀取擴充資料失敗：'+error.message,true);return}if(data){for(const id of ['cover','quote','mbti','weapon','location','appearance','personality','conduct','strengths','dislikes'])val(id,data[id==='cover'?'cover_url':id]);val('tags',(data.impression_tags||[]).join(', '))}await loadNotes(c.id);renderList();msg('正在編輯：'+c.name)}
$('new').onclick=()=>{reset();msg('已開啟新增角色表單。請填寫識別碼與姓名，再按儲存。')};$('editor').onsubmit=async e=>{e.preventDefault();const save=$('save');save.disabled=true;try{const key=v('key');if(!/^[a-z0-9_]+$/.test(key))throw Error('角色識別碼只能使用英文小寫、數字與底線');const core={character_key:key,name:v('name'),faction:v('faction')||null,title:v('title')||null,biography:v('biography')||null,portrait_url:v('portrait')||null,avatar_url:v('avatar')||null,is_public:$('public').checked};let id;if(current){const c=chars.find(x=>x.character_key===current);id=c.id;const {error}=await db.from('characters').update(core).eq('id',id);if(error)throw error}else{const {data,error}=await db.from('characters').insert(core).select('id').single();if(error)throw error;id=data.id;current=key}const dossier={character_id:id,cover_url:v('cover')||null,quote:v('quote')||null,mbti:v('mbti')||null,weapon:v('weapon')||null,location:v('location')||null,appearance:v('appearance')||null,personality:v('personality')||null,conduct:v('conduct')||null,strengths:v('strengths')||null,dislikes:v('dislikes')||null,impression_tags:v('tags').split(/[,，、]/).map(x=>x.trim()).filter(Boolean),updated_at:new Date().toISOString()};const {error}=await db.from('character_dossiers').upsert(dossier,{onConflict:'character_id'});if(error)throw Error('角色基本資料已儲存，但詳細檔案失敗：'+error.message);await loadList();await openChar(key);msg('✓ 人物檔案已儲存：'+core.name)}catch(err){msg('儲存失敗：'+err.message,true)}finally{save.disabled=false}};
async function loadNotes(id){const {data,error}=await db.from('character_notes').select('id,title,body,visibility,sort_order').eq('character_id',id).order('sort_order').order('created_at');if(error){msg('雜談讀取失敗：'+error.message,true);return}notes=data||[];renderNotes()}function renderNotes(){$('notes').replaceChildren();notes.forEach((n,i)=>{const box=document.createElement('div');box.className='note';const label=document.createElement('div');label.className='muted';label.textContent='【雜談'+String(i+1).padStart(2,'0')+'】';const title=document.createElement('input');title.placeholder='雜談標題';title.value=n.title||'';const body=document.createElement('textarea');body.placeholder='雜談內容';body.value=n.body||'';const select=document.createElement('select');for(const [k,t] of [['hidden','隱藏草稿'],['public','公開'],['story','劇情解鎖（尚未啟用）']]){const o=document.createElement('option');o.value=k;o.textContent=t;select.append(o)}select.value=n.visibility||'hidden';const actions=document.createElement('div');actions.className='bar';const save=document.createElement('button');save.type='button';save.textContent='儲存此篇';save.onclick=async()=>{const c=chars.find(x=>x.character_key===current);if(!c){msg('請先儲存角色',true);return}const row={character_id:c.id,title:title.value.trim()||'未命名雜談',body:body.value,visibility:select.value,sort_order:i};if(n.id)row.id=n.id;const {error}=await db.from('character_notes').upsert(row);if(error)msg('雜談儲存失敗：'+error.message,true);else{await loadNotes(c.id);msg('✓ 雜談已儲存')}};const del=document.createElement('button');del.type='button';del.className='ghost';del.textContent='刪除此篇';del.onclick=async()=>{if(!confirm('確定刪除這篇雜談？'))return;if(n.id){const {error}=await db.from('character_notes').delete().eq('id',n.id);if(error){msg('刪除失敗：'+error.message,true);return}}notes.splice(i,1);const c=chars.find(x=>x.character_key===current);if(c)await loadNotes(c.id);else renderNotes();msg('雜談已刪除')};actions.append(save,del);box.append(label,title,body,select,actions);$('notes').append(box)})}$('add-note').onclick=()=>{if(!current){msg('請先儲存角色，再新增雜談。',true);return}notes.push({title:'',body:'',visibility:'hidden'});renderNotes()};
(async()=>{try{if(!db)throw Error('Supabase 連線不存在');const {data:{user},error}=await db.auth.getUser();if(error||!user)throw Error('請先登入線上示籙，再開啟此後台。');const r=await db.from('social_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('此帳號沒有作者管理權限。');$('app').classList.remove('hidden');await loadList();reset();msg('✓ 作者身分驗證成功。可選擇左側角色或新增角色。')}catch(err){msg('無法進入後台：'+err.message,true)}})();
</script></body></html>
