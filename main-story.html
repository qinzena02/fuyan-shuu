let state={scene:'start',clues:[],relations:[]};
function uniqueAdd(key,values){for(const value of values||[])if(!state[key].includes(value))state[key].push(value);}
function persist(){if(REVIEW_MODE){$('status').textContent='回顧模式 · 不會更動正式存檔';return;}try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));$('status').textContent='已儲存 · '+new Date().toLocaleTimeString('zh-TW',{hour12:false});}catch(e){$('status').textContent='無法儲存：請檢查瀏覽器是否允許本機儲存。';}}
function render(){const scene=scenes[state.scene]||scenes.start;uniqueAdd('clues',scene.clues);uniqueAdd('relations',scene.relations);$('chapter').textContent=scene.chapter;$('scene-title').textContent=scene.title;$('story').replaceChildren();for(const p of scene.paragraphs){const node=document.createElement('p');node.textContent=p;$('story').appendChild(node);}$('choices').replaceChildren();for(const [label,next] of scene.options){const b=document.createElement('button');b.type='button';b.className='choice';b.textContent='→ '+label;b.addEventListener('click',()=>{state.scene=next;render();document.querySelector('.scene').scrollIntoView({behavior:'smooth',block:'start'});});$('choices').appendChild(b);}if(!scene.options.length){const a=document.createElement('a');a.href='main-chapters.html';a.className='choice';a.textContent='← 返回主線目錄';$('choices').appendChild(a);}for(const [key,target] of [['clues','clue-list'],['relations','relation-list']]){const ul=$(target);ul.replaceChildren();for(const text of state[key].length?state[key]:['尚無記錄']){const li=document.createElement('li');li.textContent=text;ul.appendChild(li);}}persist();}
$('restart').addEventListener('click',()=>{if(confirm('確定重新開始卷一序幕？本卷的線索與人物交集將重設，其他支線存檔不受影響。')){state={scene:'start',clues:[],relations:[]};render();}});
$('save').addEventListener('click',persist);
if(REVIEW_MODE){$('restart').textContent='重讀序幕';$('save').hidden=true;document.querySelector('.intro p').textContent+='　／　回顧模式（不存檔）';}
if(!player||!player.name){$('game').classList.add('hidden');$('error').classList.remove('hidden');$('error').textContent='尚未建立示籙。請先返回登記頁建立玩家身分，再進入主線。';const a=document.createElement('a');a.href='index.html';a.textContent=' → 前往示籙登記';$('error').appendChild(a);}else{
 $('player-name').textContent='姓名 · '+escapeText(player.name);$('player-sect').textContent='門派 · '+escapeText(player.sect||'未登錄');$('player-origin').textContent='籍貫 · '+escapeText(player.origin||'未登錄');
 try{const saved=REVIEW_MODE?null:JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(saved&&scenes[saved.scene]&&Array.isArray(saved.clues)&&Array.isArray(saved.relations))state={scene:saved.scene,clues:saved.clues.filter(x=>typeof x==='string'),relations:saved.relations.filter(x=>typeof x==='string')};}catch(e){}
 render();}

<script>
/* 啟卷翻頁音：按下按鈕時以 Web Audio 即時產生，無須外部音檔。 */
(function(){
 let audioContext;
 window.FYSPlayPageTurn=function(){
  try{
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;
   audioContext=audioContext||new AC();
   if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
   const now=audioContext.currentTime;
   const duration=.58;
   const buffer=audioContext.createBuffer(1,Math.ceil(audioContext.sampleRate*duration),audioContext.sampleRate);
   const data=buffer.getChannelData(0);
   let smooth=0;
   for(let i=0;i<data.length;i++){
    const t=i/audioContext.sampleRate;
    const flutter=.55+.45*Math.sin(2*Math.PI*(8*t+11*t*t));
    smooth=smooth*.72+(Math.random()*2-1)*.28;
    const envelope=Math.pow(Math.sin(Math.PI*t/duration),1.3);
    data[i]=smooth*envelope*flutter;
   }
   const source=audioContext.createBufferSource();source.buffer=buffer;
   const highpass=audioContext.createBiquadFilter();highpass.type='highpass';highpass.frequency.value=420;
   const lowpass=audioContext.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.setValueAtTime(2500,now);lowpass.frequency.exponentialRampToValueAtTime(850,now+duration);
   const gain=audioContext.createGain();gain.gain.value=.17;
   source.connect(highpass);highpass.connect(lowpass);lowpass.connect(gain);gain.connect(audioContext.destination);
   source.start(now);source.stop(now+duration);
   source.onended=()=>{source.disconnect();highpass.disconnect();lowpass.disconnect();gain.disconnect()};
  }catch(err){/* 音訊被瀏覽器封鎖時，仍正常啟卷。 */}
 };
})();
</script>
<script>
(function(){
 const cover=document.getElementById('chapterCover');
 const open=document.getElementById('openChapter');
 open.addEventListener('click',function(){
   if(cover.classList.contains('cover-exiting'))return;
   window.FYSPlayPageTurn?.();
   window.FYSMainMusicStart?.();
   cover.classList.add('cover-exiting');
   document.body.classList.remove('cover-locked');
   document.body.classList.add('chapter-revealed');
   window.scrollTo({top:0,behavior:'instant'});
   window.setTimeout(()=>{cover.hidden=true;},window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:680);
   const first=document.querySelector('main .choice, main button');
   if(first && first.focus)first.focus({preventScroll:true});
 });
})();
</script>

<script>
(function(){
 const drawer=document.getElementById('mainStatusSidebar');
 const backdrop=document.getElementById('mainStatusBackdrop');
 const toggle=document.getElementById('openMainStatus');
 const closeBtn=document.getElementById('closeMainStatus');
 function setOpen(value){
  drawer.classList.toggle('open',value);
  drawer.setAttribute('aria-hidden',String(!value));
  toggle.setAttribute('aria-expanded',String(value));
  backdrop.hidden=!value;
  if(value)closeBtn.focus();else toggle.focus();
 }
 toggle.addEventListener('click',()=>setOpen(true));
 closeBtn.addEventListener('click',()=>setOpen(false));
 backdrop.addEventListener('click',()=>setOpen(false));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer.classList.contains('open'))setOpen(false)});
})();
</script>
<script>
(function(){
 const audio=document.getElementById('mainMusic');
 const button=document.getElementById('mainMusicToggle');
 audio.volume=.32;
 function update(){button.textContent=audio.paused?'♫ 播放主線配樂':'♫ 暫停主線配樂';button.setAttribute('aria-label',audio.paused?'播放主線配樂':'暫停主線配樂');}
 window.FYSMainMusicStart=()=>{if(audio.paused)audio.play().catch(()=>{});};
 button.addEventListener('click',()=>{if(audio.paused)audio.play().catch(()=>{});else audio.pause();});
 audio.addEventListener('play',update);audio.addEventListener('pause',update);
 audio.addEventListener('error',()=>{button.textContent='配樂載入失敗';button.title='請確認 GitHub 的 music 資料夾內有指定 MP3';});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)audio.pause();});
 update();
})();
</script>
