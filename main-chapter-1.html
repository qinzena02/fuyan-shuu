<script>const SCENES=[{"id": "a0", "chapter": "第一幕 · 北城夜行", "title": "字跡消逝", "paragraphs": ["城牆上的字只停了一息。", "雨已停了，城北的風仍帶著水氣，從脈站半開的門扇間穿過，拂上紀不允的衣領。石階積著薄薄一層水，映出高處那行古字；他低下眼，水中的筆畫便被一滴簷雨敲散，待要再看，牆上的光也暗了。", "紀不允還未看清最後一筆，裂縫裡的光便滅了。碎裂的天眼垂在簷角，幾縷細煙被風吹散，落進北城逐次熄滅的燈火裡。", "【行旅者】你從北城脈站出來，恰逢軌道停運。腳下的水映著城牆上一閃即逝的字，尚未看清，光便散了。", "【行旅者】一名抱著孩子的婦人正被人潮擠向軌架。你出聲提醒她退開；有人將一盞燈遞到她手中。", "他將手探入袖中，拇指抵住符具的邊緣。", "常年握持的地方已磨得溫潤，末端卻留著一處細小的缺口，每逢心緒不定，他總會無意識地摸到那裡。此刻那缺口抵著指腹，竟比往日更深。他知道自己應該先看四周，看看有多少人抬了頭，有多少人讀懂那幾個字，手卻久久沒有鬆開。", "太微門。", "那個名字平日只在他收筆、熄燈以後，才有容身之處。如今它被高高照在城牆上，任夜風與陌生人的目光掠過，他反而一時想不起該如何將它收回。", "石階下有人喊了一聲。停在脈軌上的車廂歪向一側，車窗裡伸出幾隻手，隔著雨後清冷的夜色，徒勞地招攬著什麼。賣熱食的攤子翻了，湯水沿石縫流下來，白氣裡浮著幾片蔥葉。", "紀不允拾起滾到腳邊的燈，交給一名抱著孩子的婦人。", "「別往軌下走。」", "婦人抓住燈柄，還要問話，他已轉向脈站側門。停運的軌道下，站務的傳訊符接連閃爍，幾名值守者圍著測流盤，誰也不敢先動那枚倒轉的指針。看見紀不允走近，其中一人立即起身，將手裡的勘測簿遞了過來。", "「大人，北城的回訊斷了。」", "紀不允翻過最後一頁。新近留下的測流線在紙面上緩緩褪色，只餘末端一道逆向的金痕。他合上簿冊，指尖按過側門的識槽。門外原本伏著的巡勘飛舟隨之亮起底部符環，薄薄一圈青光掠過積水，將水中破碎的簷影推向兩側。", "「封存這一刻的測流，不要重啟舊機。」他把簿冊交回去，跨進舟艙，「北城有回訊，直接接進來。」", "值守者應聲，退開半步。艙門在身後闔攏，符環的低鳴從足底傳上來。舟身先是微微一沉，隨即升過簷角；雨珠沿著透明的艙壁往下滑，石階上的人聲漸漸遠了。", "北城在高處望去，像有一段被水浸透的長卷，墨色正沿街巷慢慢洇開。脈軌懸在屋脊之間，停住的車廂只剩幾扇窗亮著。飛舟掠過時，紀不允看見窗內一個孩子把臉貼在玻璃上，手心留著白霧。他向操控盤壓了壓手，舟身便沿著仍能辨認的空中引流線繞開，沒有驚動那片歪斜的軌架。", "勘測屏上的符點接連熄滅。靠近封鎖區時，連引流線也開始偏轉，舟身輕輕一斜。他沒有再往前，將飛舟降在長街外側的檢修臺上。底部青光收攏，街口一名巡者抬頭看見舟側的官識，立刻放下傳訊符，快步迎來。", "北城原本不該這樣暗。沿軌的店家常在第三更收攤，簷下總留幾盞照客的燈，酒香混著炭火氣，走得遲了，也能聽見隔牆有人洗碗。紀不允對這條路並不陌生，這時循著記憶往前，卻數次踩進從未有過的裂縫。鞋底碾過碎瓷，一聲輕響，被遠處的呼喊吞了。", "落到街面以後，袖中的符具仍冷得異常。紀不允隔著衣料摸到末端的缺口，抬眼望向軌道深處。金色的微光在猩紅判定光裡時隱時現，每逢亮起，腳下便傳來一陣細震。他循著那點光往前，心底仍留著城牆上的字，走得越近，越不敢輕易將兩者聯繫起來。", "迎來的巡者原先還在說脈軌停運的情形，看見他伸手試過沿街符機的殘光，便將話停了，轉而遞上記錄舊機異動的拓片。", "「大人，這幾座是在同一刻起動的。沒人碰過封槽。」", "紀不允接過拓片，拇指沿著最下方的符痕抹了一遍。紙上留著銅鏽，還未乾的拓墨沾在指腹。他問了封存的年限與最後一次探勘的日子，巡者一一答過，又讓人去取機庫的舊冊。周圍幾道急促的傳訊聲隨之壓低，原本準備截斷供流的人也停了手，等他看完。", "北城的判定聲仍在重複。", "每響一次，街邊尚能運作的符燈便紅上一分。那聲音平直、清楚，沒有因四周的哭喊而停頓，也沒有因頭頂漸漸傾斜的車廂而改變措辭。", "「德數歸零者，禁止前行。」"]}, {"id": "a1", "chapter": "第二幕 · 紅線之內", "title": "禁步歸零", "paragraphs": ["紀不允走到封鎖線前，先看見一截染血的袖口。那點金光便藏在傷者腕間，微弱得幾乎要被街燈淹沒。他停下來，目光從她的禁步移向肩上的箭傷。", "紀玖年站在軌道中央，肩上的布料被劃開，血沿著手臂淌到指尖。她腳下有一圈極淡的光，從枕木間透出來，隨著她的呼吸，一明，一暗。", "玖年原先一直盯著長街東側。直到近處有人低聲喚了大人，她才轉過臉來。眼前的人沒有穿巡者的衣裳，也不帶醫箱，衣襟上的官識卻在紅光裡清晰了一瞬。她看不懂其中細密的符式，只看見那些忙亂的人忽然讓開了路。", "【行旅者】你跟著疏散的人群退到封鎖線外。那名女子的腕間顯示著零；她肩上的血色，在猩紅判定光下幾乎辨不清。", "她將手略略往袖裡收，另一隻手仍垂在刀柄旁。腰間的佩刀隨呼吸碰著衣帶，那一點熟悉的重量，讓她得以站穩些。鏢局教她的是怎樣握刀、怎樣在人群裡認路；此刻腕上的光從何而來，她比任何人都想知道。", "「大人看的是這個？」", "她的聲音有些乾啞，問話時仍盡力站直。紀不允看見她將受傷的肩往後藏了些，像是不願讓一個陌生人先看清自己的狼狽。他沒有追問，只指向她腕間。", "「那道紋。它是什麼時候亮的？」", "玖年沒有回答。隔著紅線，她辨不清他的來意；她方才只因為他望著禁步，便試探著伸出了手，如今聽見這一句，反而又收回些許。她不知道官員此時問話，是為了救她，還是要替這場異變尋一個能被記錄下來的緣由。", "紀不允往紅線前又走了一步。", "一旁的夜循司巡者立即伸手攔他，抬手時卻略略躬身：「大人……裡面不允進。」", "「她肩上有傷。」", "「玄水宮的醫者已在路上。」巡者看了一眼玖年腳下的光，聲音壓低了些，「這道封鎖不是我們設的。方才有人伸手拉她，掌心燙得起了泡。請大人稍退——」", "紀不允把袖口纏在手上，蹲下，將指節貼近紅線。", "一道細小的火星擦過布面。", "他停了片刻，從袖裡抽出符紙，沿地面平平送入。紙角沾著濕泥，尚未越過玖年的鞋尖，便從中間燒穿了一個洞。", "巡者的手還橫在他面前。", "紀不允抬頭：「替我留一盞燈。」", "巡者望了一眼他手中的符紙，將到了嘴邊的勸阻咽回去。頭頂忽然響起尖銳的摩擦聲，半空的車廂往下沉了半尺，人群驚叫著向後退。他急忙轉身去攔往軌下奔跑的人，仍不忘回頭囑咐同伴，將燈留在大人身後。", "紀不允沒有立即跟著退。他將另一張符紙貼在鞋側，指腹沿著紙緣一抹，趁判定光隨車廂震動而微微斷續的瞬間，側身踏了進去。", "紅光掃過他的腳踝，又倏地收了回去。", "玖年望著他，唇色已經有些白。方才縮進袖裡的手腕仍僵著，禁步沉沉貼在皮膚上，紅光映得那個零異常清楚。", "紀不允沒有立即動它。他先取出乾淨的布，等她點頭，才替她壓住肩傷。"]}, {"id": "a2", "chapter": "第二幕 · 鏢單與舊脈", "title": "缺失的末筆", "paragraphs": ["「歸零以前，妳做了什麼？」", "玖年的目光往東側移了一下。", "「擋了一支箭。」", "【行旅者】你離紅線不遠，聽見「擋了一支箭」。原來那道歸零判定，竟發生在她救下一個孩子之後。", "「箭從哪裡來？」", "「對街樓上。看不清是哪一層。」她頓了頓，「那時有車經過，我先看見琉璃反光，回頭才知道它衝著孩子來。」", "紀不允示意她抬起手腕。禁步外殼沒有裂痕，箭擦過的是肩頭，離腕間還有一段距離。他取出勘測片，將薄光貼近金屬邊緣，讀取最後幾筆變動。光裡的字浮了一瞬，又被暗金色的古紋遮住。", "「原本剩多少？」", "「最後一格。」", "「之前有扣過？」", "「有。今天走鏢，過北城的時候被攔了兩次。」玖年看著他的手，「可是最後這一次，我沒有收到扣減的告知。箭擦過來，它就歸零了。」", "紀不允沿著殘存的記錄往回查。前兩次仍留有時刻與判定，末筆卻只剩一段空白；不是逐項扣到盡頭，而是原有的德數被某道訊號直接抹去。那訊號從禁步深處透出，與腳下逆行的脈光一明一暗。", "他沒有急著替她下結論。", "「最後一筆讀不全。得把禁步帶回去驗，才能知道是什麼蓋過了記錄。」", "玖年的手立即往後收。", "「帶回哪裡？」", "他抬眼，沒有去拉她。她腰間的刀柄磨得發亮，衣帶內側壓著一角折好的文書，紙緣沾了血，仍被仔細藏著。他方才只顧著古紋，此刻才留意到那張紙上露出的押記。", "「妳是鏢局的人？」", "玖年停了一會兒，從衣帶裡取出鏢單。", "「今夜有人委託，讓我們接一個孩子。」", "雨水已把紙面浸軟，幾處字跡洇成了淡灰。她展紙時很慢，像怕稍用力，就連僅存的幾行也撕掉。紀不允沒有接，只借街邊的燈看過交接地點：北城脈站，第三更。", "「就是被帶走的那個？」", "她點頭。", "「灰衣裳，袖裡有半邊符文。委託的人說，認衣上的記號就好，不必問他從哪裡來。」", "「妳見到符文了？」", "「還沒有。他剛走近，箭就到了。」", "她記得那孩子停在軌邊，先看她腰上的鏢牌，再抬頭看她的臉。像已經等了很久，又不敢確定自己終於等對了人。她伸手讓他過來，箭便從兩人之間穿了進去。", "「帶走他的人來得太快。」玖年把鏢單收回去，「判定光還沒亮，他就抓住孩子的手。我沒看清臉，只看見他往東邊去。」", "紀不允重新望向禁步。", "孩子、符箭、空白的末筆。幾件事緊緊挨在一起，卻還缺著能將它們連起來的那一道痕。他用勘測片留下此刻的讀值，收手時，地底忽然傳來一陣低鳴。", "玖年腳下的枕木開始偏移。", "紀不允將她往穩固處扶了半步，另一隻手按向軌道接縫。符紙沿濕鐵展開，白光從指下滲入，牽住逆流的金色脈光。遠處正在轉動的舊機頓了一下，車廂底部尖銳的摩擦聲也隨之低了。", "猩紅判定光卻仍圍著玖年，沒有退。", "他認得古紋的一筆，能借那一筆收束亂流，卻讀不出藏在禁步裡的完整符式。掌下的軌道看似平穩，深處仍有微震，一次比一次急，像水被截在狹窄的口子後面，正在尋找別的出口。", "他將第二張符紙覆上去，指腹被熱意燙得發麻。", "「別重啟供流。」他對線外的巡者說，「這裡只是暫時壓住了。」", "巡者應聲，急忙把話傳下去。", "玖年看見他額角滲出的汗。夜風很冷，那點汗卻沿著鬢邊慢慢滑下來。他不能一直這樣站著，她也不能一直留在這裡，等著腳下的東西再醒一回。"]}, {"id": "a3", "chapter": "第三幕 · 來人", "title": "魏應舟", "paragraphs": ["劍鞘碰上石面的聲音，就在此時傳來。", "「紀玖年。」", "她回頭，看見魏應舟跨過傾倒的攤架。雨水沿他的衣襬滴下，肩後的赤霄紋扣沾了泥，手中卻仍拿著那枚用來交接的鏢牌。", "【行旅者】你看見佩著赤霄紋扣的人越過攤架。周圍的人並未認出他，受傷的女子卻在聽見自己的名字時抬起了頭。", "「委託的孩子呢？」他問。", "「被人帶走了。」", "魏應舟看向她腕間，嘴邊原本要說的話停住。半晌，他才把鏢牌收回衣裡。", "「先處理妳這個。」", "一名巡者上前，說歸零者須留在封鎖區，等候核驗。魏應舟沒有與他爭，只取出鏢局的憑記，遞到燈下。", "「她在走鏢。鏢局不受長明府管轄，人由我們領回去。該留的記錄，我留下。」", "巡者看過憑記，又望向紀不允。", "紀不允掌下的符紙已燒去一角。他看了一眼魏應舟手中的文書。", "「末筆異常的讀值已留存。若要動禁步，先保全裡面的記錄。」", "魏應舟略略頷首：「明白，大人。」", "他蹲到玖年身側，接過她交出的隨身鏢牌。兩枚鏢牌扣合時響了一聲，禁步外側的紅光隨之閃了閃，浮出一層可以展開的薄罩。", "「刀收好，手別晃。」", "玖年將刀鞘往腰後推了一點，把手腕交給他。她看不懂那些符字，便盯著魏應舟的指尖；他每停一下，她都以為事情又有了變故，直到他從薄罩內取出一枚封存片，才稍稍吐出一口氣。", "魏應舟把封存片交到紀不允能伸手取到的地方，隨後沿禁步外緣套上一圈薄薄的隔片。罩光合攏，腳下的猩紅判定光逐段熄去。那個零仍留在腕上，卻不再牽住她的腳步。", "「能走了。」魏應舟扶她起身，「先隔開禁行的訊號。回鏢局再驗，德數不動。」", "玖年試著踏出一步。鞋底離開枕木時，她才知道自己方才一直繃著膝骨，疼得連站直都已忘了。", "紀不允收下封存片。裡面的暗金色細線仍在跳動，他望了一眼，將它放進勘測匣。", "軌道深處又震了一下。", "「從側面離開。」他說。", "魏應舟卻轉向街邊。那裡有輛翻倒的載貨車，車架下壓著一位鬢髮花白的老人。地脈初震時，他曾試著扶住車，腳踝卻被卡進輪架，如今仍攥著斷韁，不肯把手鬆開。", "玖年看了魏應舟一眼。他已拔劍，俯身把劍背送進車架下的空隙。", "「順手搭把力。」", "她跪進泥水，抱住老人的肩。老人還在看那輛車，她便放慢聲音，說車在這裡，等天亮再回來找。等他的手終於鬆開，魏應舟抬起車架，她割斷卡住的鞋帶，將人拖了出來。", "紀不允撤回掌下的符紙。失去壓制的金光立刻漫上軌面，卻被他最後留在接縫裡的一道符痕截住，短暫停在眾人身後。", "他知道那一筆撐不了多久。", "魏應舟背起老人，示意兩人跟上。街面通路已被歪斜的車廂堵住，他便揭開車後的維修渠蓋，先將老人送下去。玖年跨入渠口以前，回頭看了一眼：紀不允正在收起勘測匣，目光仍停在逐寸發亮的舊軌上。", "「大人，這邊。」", "他聞聲回身。石蓋合攏前，玖年看見他袖口的符紙已焦黑，風一吹，便散成了細灰。", "舊渠裡有鐵鏽、積水與久不見日光的土味。火摺亮起時，那點熱只照見幾步遠的石壁，連腳下的水也顯得深。玖年重新壓住肩傷，終於有餘裕看一眼腕間。", "零仍停在那裡。", "魏應舟回頭確認她跟上，又看向紀不允。", "「大人，那道壓脈符能撐到什麼時候？」", "「撐不到天亮。」", "紀不允說得平靜，指尖卻還留著軌道的熱。外面的舊機會再次起動，逆流也會找到別的去處；若不能查清禁步裡的訊號，他今夜所做的，也只是把下一次異動稍稍往後推。", "玖年聽見這句話，將衣襟內一角灰布按得更緊。那是孩子被拉走時留在她手裡的東西，她還未來得及仔細看。", "「前面右轉。」魏應舟說，「走過石階，就有——」"]}, {"id": "a4", "chapter": "第三幕 · 舊渠", "title": "第三級石階", "paragraphs": ["「第三級別踩。」老人忽然開口。", "魏應舟停住。火光尚未照到轉角。", "「您來過？」", "【行旅者】你沿著舊渠跟上眾人，火光只照得到幾步遠。老人忽然叫住前面的人，聲音比腳下的流水還低。", "老人伏在他肩上，咳了幾聲，才說：「以前替人送過料。」", "紀不允將火摺往前移。", "轉角後果然有一段石階。第三級表面平整，邊緣卻滲著一線黑水。他用勘測片輕輕一觸，石面便陷了下去，露出底下鏽蝕的尖齒。", "玖年望向老人。", "他已將眼睛閉上，手卻緊緊抓著魏應舟的衣肩。", "沒有人再問。", "那段石階修得窄，兩側牆縫裡生著白色的細根，順著水痕垂下。玖年跨過第三級時，刻意把步子放輕，仍聽見底下傳來細微的齒輪聲。她忍不住回頭，老人卻將臉偏進魏應舟的肩後，只留下半截花白的鬢髮。", "她見過許多人這樣躲開問話。有些為了遮掩過錯，有些只是因為一提起，便要再疼一次。眼前是哪一種，她還分不清。", "四人繞過石階，在一處稍高的平台歇下。上頭的街聲已聽不清了，唯有細水從壁縫滲出，落在石槽裡，一滴，一滴。"]}, {"id": "a5", "chapter": "第三幕 · 缺筆", "title": "南岸舊渡口", "paragraphs": ["玖年摸了摸衣襟，取出一小片灰布。", "「孩子留下的。」", "紀不允接過來。", "【行旅者】灰布上的符紋在火光中浮出一線暗金。你站在一旁，忽然意識到，自己今夜所見的異變，也許並不止於北城這條街。", "布邊撕得很亂，像是有人猛地將衣袖從另一個人的手裡扯出去。", "「我抓過他的袖子。」玖年說，「帶走他的人一拉，我手裡就只剩這個。」", "灰布內側繡著半枚符記，線色接近布色，得迎著火光才能辨認。", "紀不允將它翻了一面，目光停在繡線的轉折處。", "「借妳的禁步看一眼。」", "玖年遲疑片刻，自己將手腕伸向火光。他托住禁步外緣，把灰布靠近，刻意避開她擦破的皮膚。", "隔片下的禁步不再發光，紀不允便取出勘測匣裡的封存片。暗金色的古紋在薄片深處緩慢跳動。", "他把封存片移到灰布旁。兩道紋路並不相同，轉折處卻都空了一小截。", "同樣的位置，同樣乾淨的斷口。", "玖年看懂了他的神色。", "「不是壞了？」", "紀不允沒有立即回答。", "他用指腹輕輕摸過灰布上的線，停在那處空白。繡線的末端被仔細收進布裡，沒有磨損，也沒有被扯斷的毛邊。", "有人從落針之初，就把這一筆留了下來。", "對面的老人忽然抬起頭。", "火光映進他眼裡，他望著那片灰布，嘴唇動了一下。", "「這衣裳……」", "玖年立刻看向他。", "「您見過？」", "老人伸出手，還未碰到布，指尖便縮了回去。", "他把手藏進袖中，慢慢低下頭。", "那隻手方才抓著斷韁的時候，還能使出一股近乎固執的力，此刻卻微微發抖。紀不允看見他指甲裡積著黑泥，關節粗大，虎口結著厚繭；這樣一雙手，若曾替地下的工程搬過石料，倒並不難想像。只是灰布很輕，放在膝上幾乎沒有重量，老人卻像不敢去接。", "石槽裡又落下一滴水。", "紀不允沒有催。他將灰布放在老人能看見的地方，火摺移開些許，免得那點熱燎著布角。", "過了很久，老人才啞聲問：", "「那孩子……還活著嗎？」", "玖年原本到了嘴邊的話停住了。", "她想起孩子被拖走時回過一次頭。街上那麼多人，他誰也沒看，只盯著她擋箭的那隻手。", "當時她以為，他是嚇壞了。", "現在隔著地下微弱的火光再想，那孩子沒有哭。他的嘴唇動過，玖年卻只顧著肩上的箭傷，沒能聽見。這一點錯失忽然比傷口更鮮明，她甚至想不起他的眼睛是什麼顏色，只記得那目光久久停在自己腕上。", "「活著。」她說，「被人帶走的時候，還活著。」", "老人閉了閉眼。肩背隨那口鬆下的氣往下沉了些，玖年卻沒有因此覺得安心。他問的只是一句還活著嗎，聽見回答，竟像得到了本不敢奢望的東西。", "紀不允望著他攥緊的袖口，問得很輕。", "「帶走他的人，會往哪裡去？」", "老人久久沒有回答。", "腳下忽然傳來一絲極細的震動。", "平台邊的積水泛起圓紋，往牆根一圈圈散去。封存片裡的古紋亮了一下，那片灰布上的繡線也浮出暗金色的微光。", "老人看著石槽裡的水，神情像是聽見了某個多年不敢再聽的名字。", "「南邊。」他終於說。", "「天環江南邊，有座收了很久的舊渡口。」", "魏應舟抬眼：「那裡早就不走船了。」", "「我知道。」", "老人的聲音輕得幾乎聽不見。", "「所以才會往那裡去。」", "紀玖年抬起手，握住腕上 if(state.index===1||state.index===2){let k=Object.keys(SECT_NOTES).find(k=>sect.includes(k));if(k)opts.push(['【'+k+'】'+(state.index===1?'運用門派所學觀察現場':'從門派角度重新核對線索'),SECT_NOTES[k][state.index===1?0:1]]);}
for(let [label,clue] of opts){let b=document.createElement('button');b.className='choice';b.textContent='→ '+label;b.disabled=processing;b.onclick=async()=>{if(processing)return;processing=true;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);let old=structuredClone(state);addClue(clue);state.choices.push({scene:s.id,label});if(state.index===SCENES.length-1)state.complete=true;else state.index++;if(!await persistCloud(state)){state=old;processing=false;render();return}persistLocal();processing=false;render();window.scrollTo({top:0,behavior:'smooth'})};$('choices').append(b)}
}
$('clues').replaceChildren();for(let t of state.clues.length?state.clues:['尚無記錄']){let li=document.createElement('li');li.textContent=t;$('clues').append(li)}$('step').textContent=state.complete?'第一章已完成':'第一章 · 第 '+(state.index+1)+'／'+SCENES.length+' 段';$('saveStatus').textContent=note();}
$('identity').textContent=player?.name?'姓名 · '+player.name+'　／　門派 · '+sect:'未讀取到示籙';if(REVIEW)$('mode').textContent='回顧模式 · 不更動正式存檔';
async function initCloud(){if(REVIEW)return;try{db=window.fuyanshuDB;if(!db)return;let {data:{user},error}=await db.auth.getUser();if(error||!user)return;uid=user.id;let {data,error:e}=await db.rpc('load_main_chapter_progress',{p_story_id:STORY});if(e)throw e;cloudReady=true;if(data&&Number.isInteger(data.index)&&data.index>=0&&data.index<SCENES.length){state={index:0,clues:[],choices:[],complete:false,...data};persistLocal()}else{await persistCloud(state)}render()}catch(e){$('saveStatus').textContent='雲端尚未連結：'+e.message}}
render();initCloud();
function turnSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let c=new AC(),n=Math.floor(c.sampleRate*.38),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){let t=i/n;d[i]=(Math.random()*2-1)*Math.sin(Math.PI*t)*.12}let s=c.createBufferSource(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;s.buffer=b;s.connect(f);f.connect(c.destination);s.start();s.onended=()=>c.close()}catch(e){}}
const audio=$('music');audio.volume=.3;function musicUI(){$('musicButton').textContent=audio.paused?'♫ 播放主線配樂':'♫ 暫停主線配樂'};$('musicButton').onclick=()=>{audio.paused?audio.play().catch(()=>{}):audio.pause()};audio.addEventListener('play',musicUI);audio.addEventListener('pause',musicUI);document.addEventListener('visibilitychange',()=>{if(document.hidden)audio.pause()});
$('open').onclick=()=>{turnSound();audio.play().catch(()=>{});$('cover').classList.add('hide');setTimeout(()=>{$('cover').hidden=true},700)};
function drawer(v){$('drawer').classList.toggle('open',v);$('drawer').setAttribute('aria-hidden',String(!v));$('drawerOpen').setAttribute('aria-expanded',String(v))};$('drawerOpen').onclick=()=>drawer(true);$('drawerClose').onclick=()=>drawer(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')drawer(false)});
</script></body></html>
