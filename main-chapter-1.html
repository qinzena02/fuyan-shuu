<script>const SCENES=[{"id": "s0", "chapter": "北城 · 封鎖長街", "title": "字跡消逝", "paragraphs": ["城牆上的字只停了一息。", "紀不允還未看清最後一筆，裂縫裡的光便滅了。碎裂的天眼垂在簷角，幾縷細煙被風吹散，落進北城逐次熄滅的燈火裡。", "他將手探入袖中，拇指抵住符具的邊緣，又慢慢鬆開。", "石階下有人喊了一聲。停在脈軌上的車廂歪向一側，車窗裡伸出幾隻手，隔著雨後清冷的夜色，徒勞地向外求援。賣熱食的攤子翻了，湯水沿石縫流下來，白氣裡浮著幾片蔥葉。", "紀不允拾起滾到腳邊的燈，交給一名抱著孩子的婦人。", "「別往軌下走。」", "婦人抓住燈柄，還要問話，他已穿過人群。", "北城的判定聲仍在重複。", "每響一次，街邊尚能運作的符燈便紅上一分。那聲音平直、清楚，沒有因四周的哭喊而停頓，也沒有因頭頂漸漸傾斜的車廂而改變措辭。", "「德數歸零者，禁止前行。」"], "options": [["先看清封鎖線的判定", "看見封鎖線的紅光並非巡者所設。"], ["先尋找紀玖年的身影", "你注意到染血的袖口與軌道上的異常光圈。"]]}, {"id": "s1", "chapter": "北城 · 初見", "title": "紅線之內", "paragraphs": ["紀不允走到封鎖線前，先看見一截染血的袖口。", "紀玖年站在軌道中央，肩上的布料被劃開，血沿著手臂淌到指尖。她腳下有一圈極淡的光，自枕木間透出，隨著呼吸一明一暗。","紀不允跨過地上的紅線。", "一旁的夜循司巡者立即伸手攔他：「裡面不能進。」", "「她肩上有傷。」", "「醫者已在路上。」巡者看了一眼玖年腳下的光，聲音壓低了些，「這道封鎖不是我們設的。方才有人伸手拉她，掌心燙得起了泡。你先退——」", "紀不允把袖口纏在手上，蹲下，將指節貼近紅線。", "一道細小的火星擦過布面。", "他停了片刻，從袖裡抽出符紙，沿地面平平送入。紙角沾著濕泥，尚未越過玖年的鞋尖，便從中間燒穿了一個洞。", "巡者的手還橫在他面前。", "紀不允抬頭：「替我留一盞燈。」", "那人皺起眉，正要再說，頭頂忽然響起尖銳的摩擦聲。半空的車廂往下沉了半尺，人群驚叫著向後退，巡者轉身去攔往軌下奔跑的人。", "紀不允趁那一瞬側身入內。", "紅光掃過他的腳踝，又倏地收了回去。", "玖年望著他，唇色已經有些白。", "「那個孩子呢？」", "他按住她的肩傷，掌心很快濕了。", "「哪個孩子？」", "「灰衣裳，這麼高。」她用沒受傷的手比了一下，「箭是衝他來的。有人把他帶走了，往東邊去。」", "紀不允將乾淨的布折成幾層，壓在傷口上。", "她吸了一口氣，仍看著長街盡頭。", "「那人來得太快。判定光還沒亮，他就已經抓住孩子的手。」", "「先出去。」", "「出去以後，人也找不著了。」", "他替她繫緊布條，沒有回答。", "玖年伸手抓住他的袖子。她的指尖冰冷，力氣卻不小。", "「你看看那支箭。射過來的時候沒有聲音，連脈軌的護符都沒攔住。我若沒有回頭——」", "「妳若沒有回頭，現在站在這裡的就不會是妳。」", "話落下，兩人都靜了一瞬。", "紀不允垂眼，看見她指節上擦破的皮，才將語氣放輕。", "「還能走？」"], "options": [["觀察禁步的異常", "禁步的古紋有一筆被刻意留空。"], ["留意到玖年的描述", "孩子被帶走的時間早於判定光亮起。"]]}, {"id": "s2", "chapter": "北城 · 舊式符機", "title": "第三聲低鳴", "paragraphs": ["玖年試著抬腳。", "腳下的光驟然收緊，像一根看不見的線纏住膝骨。她身子一晃，被紀不允托住手肘。腕上的禁步輕輕敲了一聲，金屬深處浮出幾縷暗金色的紋路。", "那紋路並不完整。", "其中一筆走到末端，忽然空了一小截，斷處卻光滑得沒有半點裂痕。", "紀不允的手停在半空。", "玖年察覺了他的神色。", "「你認得？」", "遠處傳來符機起動的低鳴。他握住她的手腕，翻向燈光。", "「認得一筆。」", "「其餘呢？」", "「得試。」", "他取出一枚窄薄的符片，抵在禁步邊緣。指尖順著金屬外殼划過，留下極淡的白痕。白痕首尾將合時，玖年腳下的紅光慢慢退了，凝滯的空氣裡也終於有風穿進來。", "她動了動鞋尖。", "紀不允剛要收手，軌道底下忽然傳來一聲重響。", "街角那座早已封存的舊式符機轉過頭來。", "厚重的銅殼覆著綠鏽，兩側細長的機臂垂在地上，拖出刺耳的聲音。它胸口原本黯淡的符槽亮了，光一節節爬上頸部，照出一張沒有五官的鐵面。", "玖年腳邊隨之響起扣合聲。", "枕木兩側的銅扣翻起，卡住她的靴底。", "紀不允立刻截斷白痕，符片在指間裂成兩半。", "已亮起的符槽卻沒有熄滅。", "舊符機抬起機臂，尖端停在玖年面前。那一點光凝得很慢，慢得能看清其中細碎的金屑。", "紀不允將她擋在身後。", "「別動。」", "「不是我在動。」玖年說。", "她低頭盯著禁步，忽然按住他的手。", "「等一下。」", "舊符機胸口傳來第一聲低鳴。", "她腕上的古紋跟著明了一次。", "又一聲。又一次。", "第三聲落下，金屬扣裡的齒輪向外退了半寸。", "玖年盯住那處縫隙：「它每響三次，就會鬆一回。」", "紀不允看向她。", "「剛才你畫符的時候，它一直在響。是你的聲音蓋住了。」她說，「你先別碰它。」", "他收住手，靜靜等著。", "第一聲低鳴，風停在兩人之間。", "第二聲，符機的機臂往前送了些許。", "第三聲響起時，紀不允俯身將符片插進銅扣的齒隙，玖年同時抽腳。靴底被刮出一道長痕，她咬住牙，終於往前踏出半步。", "機臂驟然落下。"], "options": [["數清符機的低鳴", "每三聲低鳴，銅扣便鬆動一次。"], ["觀察禁步與符機的共鳴", "古紋會隨著符機的低鳴閃爍。"]]}, {"id": "s3", "chapter": "北城 · 軌上救援", "title": "一線生機", "paragraphs": ["一道劍光從側面擦進來，斬偏了尖端。火星落在濕軌上，嘶嘶作響。", "「半夜不回鏢局，原來是來替北城拆路。」", "來人將劍往旁邊一帶，借力落在枕木上。他衣襬濕了大半，肩後一枚赤霄紋扣撞著劍鞘，發出清脆的聲音。", "玖年鬆了一口氣。", "「你怎麼還在這裡？」", "「送車。」", "他抬了抬下巴。", "不遠處，一輛載貨的舊車歪在脈軌邊上，前輪陷進翹起的石板。車架下壓著一個鬢髮花白的老人，正攥著斷裂的韁繩，想把腿拖出來。", "「鏢送到了，人還沒送回去。」赤霄弟子看了一眼玖年的肩膀，「妳倒好，先替自己添了一筆。」", "「少說兩句，幫我扶著他。」", "「我是來救妳的。」", "「我還站著。」", "赤霄弟子短促地笑了一聲，隨即轉身，劍鋒刺入車架下的縫隙。", "紀不允望向那輛車。後輪再往下滑一寸，整副車架便會壓實。街口的巡者正在疏散車廂裡的乘客，一時無人能過來。", "「下面有路嗎？」他問。", "「有條舊渠，修軌的人走的。就在車後面。」赤霄弟子握住劍柄，肩背緩緩繃緊，「入口快被這車堵死了。你們要走，先把他弄出來。」", "他沒有再問紀不允是誰。", "紀不允回頭看了一眼追來的符機。每走一步，路面便跟著顫一下，兩側符燈的紅光也在往它胸口聚攏。", "他拾起半張燒破的符紙，按在軌道接縫上。", "「玖年，等它響第三聲，再過去。」", "她點頭，把受傷的手臂貼緊身側。", "第三聲落下，紀不允指尖一壓。", "軌道上的光被牽向旁側，符機轉頭，機臂重重扎進空地。玖年趁隙衝到車邊，跪進滿地泥水，抱住老人的肩膀。", "「伯伯，手鬆開。」", "老人仍握著韁繩，掌心磨出了血。", "「車……」", "「車在這裡。」她說，「不會有人拿。」", "老人顫著嘴唇，終於鬆手。", "赤霄弟子以劍托住車架，左手扣住輪軸向上扳。木料一寸寸抬起，他額角的青筋也隨之浮了出來。", "「快。」", "玖年往後拖人，肩頭傷口被扯開，熱意很快浸透新繫的布。老人被壓住的鞋仍卡在下面，她伸手去解鞋帶，指尖沾了泥，越拉越緊。", "身後傳來符紙燃燒的聲音。", "紀不允抬起另一隻手，符光從他指間越過，薄薄一線，抵住符機第二次落下的機臂。", "「玖年。」", "她拔出腰間短刀，割斷鞋帶，抱著老人向後跌去。", "車架轟然落地。", "赤霄弟子抽劍，劍身擦過輪軸，帶出一串火花。玖年已將老人推到渠口，他接過人，先送下石階，回身再拉玖年。", "「你哥呢？」", "玖年扭頭。", "紀不允仍站在軌上。", "他腳下那張紙已燒去大半，剩下的一角貼著濕泥，像一隻遲遲不肯鬆手的蝶。符機停在他面前，胸口低鳴，鐵面上的光卻落在他的袖口。", "那裡露出了符具的一截。", "機臂緩緩偏轉，尖端避開了他，指向渠口。", "紀不允望著鐵面，指尖微微收緊。", "他可以再留一刻。", "或許只需一刻，就能知道這座舊物究竟認出了什麼。", "「哥！」", "玖年的聲音從背後傳來。", "紀不允回頭，看見她一手扒著渠口，染血的布條垂在水裡。", "他斷開指間的符光。", "機臂擦著他的肩落下，砸裂了半塊枕木。他借勢退後，抓住玖年伸來的手，兩人一同跌進渠口。", "赤霄弟子立即推合頂蓋。", "厚重的石板壓下來，將紅光截在外面。", "黑暗裡，四個人的喘息漸漸分出了遠近。", "上方仍有沉悶的腳步聲，沿著軌道走過去。每一聲都落進胸口，直到很久以後，才慢慢遠了。", "有人擦亮火摺。", "紀不允接過那點火，照見玖年垂在膝邊的手。他重新替她裹傷，這一次打結時，她沒有再往別處看。", "「你剛才為什麼不走？」她問。", "他低著頭，將布邊收進結裡。", "「看錯了一筆。」", "玖年看了他片刻。", "「你說謊的時候，總會把話說得很短。」", "赤霄弟子正蹲在老人身前查驗腿傷，聞言側頭看了一眼，沒有插嘴。", "紀不允替妹妹拉好衣領。", "「出去再說。」", "她沒有追問，伸手將他袖口破開的地方攏住。", "布底下有一道擦傷。", "紀不允看見了她的動作，也沒有說話。"], "options": [["協助觀察車架與舊渠", "車架下方有一條供修軌者通行的舊渠。"], ["注意赤霄弟子的武技", "那名赤霄弟子以劍承力，為救援爭取了時間。"]]}, {"id": "s4", "chapter": "舊渠 · 轉角", "title": "第三級石階", "paragraphs": ["舊渠很窄，積水只到腳背，牆上卻有高過人肩的水痕。赤霄弟子背起老人，持劍敲了敲前方石壁，聽過回聲，才往深處走。", "玖年跟在後頭，已能自行抬腳。", "禁步沒有再扣住她。", "只是腕上的數字，仍是零。", "「前面右轉。」赤霄弟子說，「走過石階，就有——」", "「第三級別踩。」老人忽然開口。", "劍尖停住。", "火光尚未照到轉角。", "赤霄弟子回頭：「您來過？」", "老人伏在他肩上，咳了幾聲，才說：「以前替人送過料。」", "紀不允將火摺往前移。", "轉角後果然有一段石階。第三級表面平整，邊緣卻滲著一線黑水。他用折斷的符片輕輕一觸，石面便陷了下去，露出底下鏽蝕的尖齒。", "玖年望向老人。", "他已將眼睛閉上，手卻緊緊抓著赤霄弟子的衣肩。", "沒有人再問。"], "options": [["先檢查第三級石階", "老人未見石階，便知道第三級下藏有機關。"], ["先留意老人的反應", "老人熟悉這條已廢棄的修軌舊渠。"]]}, {"id": "s5", "chapter": "舊渠 · 灰布", "title": "共同缺筆", "paragraphs": ["四人繞過石階，在一處稍高的平台歇下。上頭的街聲已聽不清了，唯有細水從壁縫滲出，落在石槽裡，一滴，一滴。", "玖年摸了摸衣襟，取出一小片灰布。", "「孩子留下的。」", "紀不允接過來。", "布邊撕得很亂，像是有人猛地將衣袖從另一個人的手裡扯出去。", "「我抓過他的袖子。」玖年說，「帶走他的人一拉，我手裡就只剩這個。」", "灰布內側繡著半枚符記，線色接近布色，得迎著火光才能辨認。", "紀不允將它翻了一面，又握住玖年的手腕。", "禁步深處的古紋仍在緩慢跳動。", "他把灰布靠近。", "兩道紋路並不相同，轉折處卻都空了一小截。", "同樣的位置，同樣乾淨的斷口。", "玖年看懂了他的神色。", "「不是壞了？」", "紀不允沒有立即回答。", "他用指腹輕輕摸過灰布上的線，停在那處空白。繡線的末端被仔細收進布裡，沒有磨損，也沒有被扯斷的毛邊。", "有人從落針之初，就把這一筆留了下來。", "對面的老人忽然抬起頭。", "火光映進他眼裡，他望著那片灰布，嘴唇動了一下。", "「這衣裳……」", "玖年立刻看向他。", "「您見過？」", "老人伸出手，還未碰到布，指尖便縮了回去。", "他把手藏進袖中，慢慢低下頭。", "石槽裡又落下一滴水。", "紀不允沒有催。他將灰布放在老人能看見的地方，火摺移開些許，免得那點熱燎著布角。", "過了很久，老人才啞聲問：", "「那孩子……還活著嗎？」", "玖年原本到了嘴邊的話停住了。", "她想起孩子被拖走時回過一次頭。街上那麼多人，他誰也沒看，只盯著她擋箭的那隻手。", "當時她以為，他是嚇壞了。", "「活著。」她說，「被人帶走的時候，還活著。」", "老人閉了閉眼。", "紀不允望著他攥緊的袖口，問得很輕。", "「帶走他的人，會往哪裡去？」", "老人久久沒有回答。", "腳下忽然傳來一絲極細的震動。", "平台邊的積水泛起圓紋，往牆根一圈圈散去。玖年的禁步亮了一下，那片灰布上的繡線也浮出暗金色的微光。", "老人看著石槽裡的水，神情像是聽見了某個多年不敢再聽的名字。", "「南邊。」他終於說。", "「天環江南邊，有座收了很久的舊渡口。」", "赤霄弟子抬眼：「那裡早就不走船了。」", "「我知道。」", "老人的聲音輕得幾乎聽不見。", "「所以才會往那裡去。」", "紀玖年抬起手，握住腕上已經冰冷的禁步。", "零仍停在那裡。", "但這一次，她站了起來。", "紀不允把灰布折好，放回她掌心，隨後拾起那點將盡的火，照向舊渠更深處。", "第三更的鐘聲一直沒有再響。", "他們得趁天亮以前，找到那個孩子。"], "options": [["收好灰布，記下舊渡口", "灰布上的共同缺筆與南岸舊渡口，成為下一步追查方向。"]]}];

let state={index:0,clues:[],complete:false};let player=null;try{player=JSON.parse(localStorage.getItem("fuyanshu_player")||"null")}catch(e){};
try{if(!REVIEW){let saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<SCENES.length&&Array.isArray(saved.clues)){state={index:saved.index,clues:saved.clues.filter(x=>typeof x==="string"),complete:!!saved.complete}}}}catch(e){}
function save(){if(REVIEW){$("saveStatus").textContent="回顧模式 · 不會修改正式存檔";return;}try{localStorage.setItem(KEY,JSON.stringify(state));$("saveStatus").textContent="已自動儲存於此裝置 · "+new Date().toLocaleTimeString("zh-TW",{hour12:false})}catch(e){$("saveStatus").textContent="無法儲存，請確認瀏覽器儲存權限"}}
function render(){const s=SCENES[state.index];$("chapter").textContent=s.chapter;$("title").textContent=s.title;$("prose").replaceChildren();for(const p of s.paragraphs){let n=document.createElement("p");n.textContent=p;$("prose").append(n)}$("choices").replaceChildren();if(state.complete){let p=document.createElement("p");p.className="done";p.textContent="第一章 · 終｜第三更的鐘聲一直沒有再響。";$("choices").append(p);let a=document.createElement("a");a.className="choice";a.href="main-chapters.html";a.textContent="← 返回主線卷宗目錄";$("choices").append(a)}else{for(const [label,clue] of s.options){let b=document.createElement("button");b.className="choice";b.textContent="→ "+label;b.onclick=()=>{if(!state.clues.includes(clue))state.clues.push(clue);if(state.index===SCENES.length-1)state.complete=true;else state.index++;render();window.scrollTo({top:0,behavior:"smooth"})};$("choices").append(b)}}$("clues").replaceChildren();for(const clue of state.clues.length?state.clues:["尚無記錄"]){let li=document.createElement("li");li.textContent=clue;$("clues").append(li)}$("step").textContent=state.complete?"第一章已完成":"第一章 · 第 "+(state.index+1)+"／"+SCENES.length+" 段";save()}
$("identity").textContent=player?.name?"姓名 · "+player.name+"　／　門派 · "+(player.sect||"未登錄"):"未讀取到示籙";
if(REVIEW)$("mode").textContent="回顧模式 · 不改動正式存檔";
render();
function turnSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let c=new AC(),n=Math.floor(c.sampleRate*.38),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){let t=i/n;d[i]=(Math.random()*2-1)*Math.sin(Math.PI*t)*.12}let s=c.createBufferSource(),f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=1100;s.buffer=b;s.connect(f);f.connect(c.destination);s.start();s.onended=()=>c.close()}catch(e){}}
const audio=$("music");audio.volume=.3;function musicUI(){$("musicButton").textContent=audio.paused?"♫ 播放主線配樂":"♫ 暫停主線配樂"};$("musicButton").onclick=()=>{audio.paused?audio.play().catch(()=>{}):audio.pause()};audio.addEventListener("play",musicUI);audio.addEventListener("pause",musicUI);document.addEventListener("visibilitychange",()=>{if(document.hidden)audio.pause()});
$("open").onclick=()=>{turnSound();audio.play().catch(()=>{});$("cover").classList.add("hide");setTimeout(()=>{$("cover").hidden=true},700)};
function drawer(v){$("drawer").classList.toggle("open",v);$("drawer").setAttribute("aria-hidden",String(!v));$("drawerOpen").setAttribute("aria-expanded",String(v))};$("drawerOpen").onclick=()=>drawer(true);$("drawerClose").onclick=()=>drawer(false);document.addEventListener("keydown",e=>{if(e.key==="Escape")drawer(false)});
</script></body></html>
