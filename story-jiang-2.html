rescue:{ch:'其二 · 第三篇',title:'救援優先',text:`你協助紀玖年切斷隔離室的鎖定符線，最後兩名商旅終於脫困。魏應舟隨後帶著部分原始紀錄趕來，足以追查偽造通行的關鍵資料也得以保存。

ending:{ch:'其二 · 終卷',title:'江上歸人',text:`日暮時分，六名生還的商旅終於重新會合。三日後，江防巡查在下游找到一具遺體，經隨身物品與家屬確認，正是最後一名失蹤者。七人的去向至此全部查明。

魏應舟將證言、貨運單據與轉錄紀錄提交長明府，涉案設備遭到查封；至於幕後操作者，仍須循著封存紀錄繼續追查。紀玖年則親自將尋人文書歸還委託人。

const sequelClues={start:[],station:['北岸舊驛道線索'],gate:['北岸舊驛道線索','舊站暗門'],seal:['北岸舊驛道線索','異常封條'],watch:['北岸舊驛道線索','疑似監視痕跡'],witness:['北岸舊驛道線索','商旅目擊證言'],warehouse:['北岸舊驛道線索','商旅目擊證言','江北倉儲區'],rescue:['商旅目擊證言','江北倉儲區','救援路線'],evidence:['商旅目擊證言','江北倉儲區','封存證據'],joint:['商旅目擊證言','江北倉儲區','撤離路線'],ending:['江北倉儲區','六人生還、一人罹難','七人去向查明']};
function renderJourney(){
 const items=sequelClues[progress?.node]||[];const ul=$('clues');ul.replaceChildren();
 if(!items.length){const li=document.createElement('li');li.textContent='尚無其二線索';ul.append(li)}
 else items.forEach(v=>{const li=document.createElement('li');li.textContent='◇ '+v;ul.append(li)});

function initJourneyDrawer(){
 const side=$('statusSidebar'),toggle=$('statusToggle');
 const setOpen=(open)=>{side.classList.toggle('open',open);side.setAttribute('aria-hidden',String(!open));toggle.setAttribute('aria-expanded',String(open));};
 toggle.addEventListener('click',()=>setOpen(!side.classList.contains('open')));

async function loadJourneyStats(){
 if(!db)return;
 try{
  const auth=await db.auth.getUser();if(auth.error)throw auth.error;
  if(!auth.data?.user)return;
  const userId=auth.data.user.id;
  const profile=await db.from('player_profiles').select('character_name,virtue_points').eq('user_id',userId).maybeSingle();
  if(!profile.error&&profile.data){$('playerName').textContent=profile.data.character_name||'旅人';$('virtue').textContent=profile.data.virtue_points??'未登錄'}
  const chars=await db.from('characters').select('id,character_key').in('character_key',['ji_jiunian','wei_yingzhou']);
  if(chars.error)throw chars.error;
  for(const [key,el] of [['ji_jiunian','jiu'],['wei_yingzhou','wei']]){
   const ch=(chars.data||[]).find(c=>c.character_key===key);
   if(!ch){$(el).textContent='尚未公開';continue}
   const result=await db.rpc('get_character_bond',{p_character_id:ch.id});
   if(result.error)throw result.error;
   const value=Array.isArray(result.data)?result.data[0]:result.data;
   const label=typeof value==='string'?value:(value&&[value.bond_title,value.relationship_title,value.bond_label,value.title,value.label,value.relationship_name,value.relation_name,value.bond_name].find(v=>typeof v==='string'&&v.trim()));
   $(el).textContent=label||'尚未建立羈絆';
  }
  $('bondNote').textContent='人物羈絆取自人物誌的雲端累積關係，包含前篇及其二已結算的事件。';
 }catch(err){$('bondNote').textContent='羈絆讀取暫時失敗：'+err.message+'。劇情仍可繼續，請確認人物誌讀取權限。';}
}
initJourneyDrawer();

function draw(){renderJourney();const s=scenes[progress?.node]||scenes.start;$('chapter').textContent=s.ch;$('title').textContent=s.title;$('prose').textContent=s.text;$('reply').classList.add('hidden');$('continue').classList.add('hidden');const choices=$('choices');choices.replaceChildren();$('choiceTitle').textContent=s.decisions?'調查選擇 · 影響人物羈絆':s.tone?'選擇你的回答':'卷宗進度';if(s.end){$('choiceTitle').textContent='卷宗結案';$('interaction').querySelector('#choices').textContent='七人去向已查明。可返回委託榜。';return}if(s.tone){s.tone.forEach(([line,reply],i)=>{const b=document.createElement('button');b.className='choice';b.textContent=line;b.onclick=()=>{choices.querySelectorAll('button').forEach(x=>x.disabled=true);$('reply').textContent=reply;$('reply').classList.remove('hidden');$('continue').classList.remove('hidden');$('continue').onclick=()=>advance(s.next)};choices.append(b)})}else if(s.decisions){s.decisions.forEach(([label,target])=>{const b=document.createElement('button');b.className='choice';b.textContent='› '+label;b.onclick=()=>advance(target);choices.append(b)})}else{$('continue').textContent='繼續 ›';$('continue').classList.remove('hidden');$('continue').onclick=()=>advance(s.next)}}
async function advance(to){if(busy)return;busy=true;$('status').textContent='正在核驗選擇並保存雲端進度……';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const {data,error}=await db.rpc('jiang2_advance',{p_to_node:to});if(error)throw error;progress=data;draw();await loadJourneyStats();$('status').textContent='行跡已保存至雲端示籙。';window.scrollTo({top:280,behavior:'smooth'})}catch(e){$('status').textContent='保存失敗：'+e.message;draw()}finally{busy=false}}
/* 延續前篇：以 Web Audio 即時合成典籍翻頁聲，無需額外音檔 */
let pageAudioContext;
function playPageTurn(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  pageAudioContext=pageAudioContext||new AC();
  if(pageAudioContext.state==='suspended')pageAudioContext.resume().catch(()=>{});
  const ctx=pageAudioContext,now=ctx.currentTime,duration=.58;
  const buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*duration),ctx.sampleRate);
  const data=buffer.getChannelData(0);
  let smooth=0;
  for(let i=0;i<data.length;i++){
   const t=i/ctx.sampleRate;
   const flutter=.55+.45*Math.sin(2*Math.PI*(8*t+11*t*t));
   smooth=smooth*.72+(Math.random()*2-1)*.28;
   data[i]=smooth*Math.pow(Math.sin(Math.PI*t/duration),1.3)*flutter;
  }
  const source=ctx.createBufferSource();source.buffer=buffer;
  const high=ctx.createBiquadFilter();high.type='highpass';high.frequency.value=420;
  const low=ctx.createBiquadFilter();low.type='lowpass';low.frequency.setValueAtTime(2500,now);low.frequency.exponentialRampToValueAtTime(850,now+duration);
  const gain=ctx.createGain();gain.gain.value=.17;
  source.connect(high);high.connect(low);low.connect(gain);gain.connect(ctx.destination);
  source.start(now);source.stop(now+duration);
  source.onended=()=>{source.disconnect();high.disconnect();low.disconnect();gain.disconnect()};
 }catch(_){/* 若瀏覽器封鎖音訊，啟卷仍正常進行 */}
}
function setupCover(){
 const cover=$('chapterCover'),btn=$('openChapter');
 btn.addEventListener('click',()=>{
  if(cover.classList.contains('cover-exiting'))return;
  btn.disabled=true;
  playPageTurn();
  window.scrollTo({top:0,behavior:'instant'});
  cover.classList.add('cover-exiting');
  document.body.classList.remove('cover-locked');
  document.body.classList.add('chapter-revealed');
  window.setTimeout(()=>{cover.hidden=true},window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:900);
 });
}
setupCover();
