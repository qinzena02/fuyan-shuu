*{box-sizing:border-box}body{margin:0;background:#0a1515;color:#e3ddcc;font-family:"Noto Serif TC","Microsoft JhengHei",serif;line-height:2}a{color:#a2d8cc;text-decoration:none}header{padding:14px max(18px,calc((100vw - 920px)/2));background:#0a1919;border-bottom:1px solid #34564f;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.hero{background:linear-gradient(#06131266,#091515 96%),url('images/tobi-2021061007.jpg') center/cover;min-height:280px;display:grid;place-content:center;text-align:center;padding:50px 20px}.hero h1{font-size:clamp(27px,5vw,45px);font-weight:400;color:#e6cd91;letter-spacing:.15em}.hero p,.eyebrow{color:#a7c6b7;letter-spacing:.16em;font-size:12px}main{max-width:820px;margin:auto;padding:25px 20px 90px}.chapter{color:#8bcfc4;font-size:12px;letter-spacing:.15em}h2{font-weight:400;color:#e8cf9b;font-size:26px}.prose{white-space:pre-line;line-height:2.15;font-size:16px}.panel{margin:26px 0;padding:22px;border:1px solid #365d54;background:#102322}.choice{display:block;width:100%;text-align:left;padding:13px 16px;margin:10px 0;background:#15302d;color:#eee4ce;border:1px solid #43695e;font:inherit;cursor:pointer}.choice:hover,.choice:focus-visible{border-color:#d5b875;background:#21413a}.choice:disabled{opacity:.5;cursor:wait}.small{font-size:12px;color:#9cbbaf}.tag{font-size:12px;color:#e1c58d;letter-spacing:.1em}.note{color:#b2c7b8;font-size:12px;min-height:24px}.hidden{display:none}.reply{border-left:2px solid #6ecdbb;padding:8px 18px;margin-top:18px;white-space:pre-line}.toolbar{display:flex;gap:18px;flex-wrap:wrap;margin-top:24px}button{font-family:inherit}@media(max-width:600px){.panel{padding:16px}main{padding:20px 15px 65px}.hero{min-height:210px}.prose{font-size:15px}}</style></head><body>

<main><div class="chapter" id="chapter">卷宗核驗中</div><h2 id="title">正在讀取示籙</h2><div class="prose" id="prose"></div><section class="panel" id="interaction"><div class="tag" id="choiceTitle">玩家選擇</div><div id="choices"></div><div id="reply" class="reply hidden"></div><button id="continue" class="choice hidden">繼續 ›</button></section><p id="status" class="note" role="status">正在連接雲端存檔……</p><div class="toolbar"><a href="story.html">返回前篇</a><a href="bounty.html">返回委託榜</a></div></main>

'use strict';const db=window.fuyanshuDB,$=id=>document.getElementById(id);let progress=null,busy=false,toneDone=false;
const scenes={
start:{ch:'其二 · 第一篇',title:'未封之卷',text:`咸陵入夜後，雨下得很細。你原以為天環江的事情已經告一段落，直到示籙忽然亮起一則卷宗異動通知：原始貨運路引經重新辨識，發現第二層符文殘留。

舊渡口旁的茶棚仍亮著燈。紀玖年將一盞涼透的茶推開，魏應舟則把拓印攤在桌上。殘缺的符線指向十多年前停用的北岸第七轉運站。

「這次調查，我希望你也在場。」魏應舟說，「畢竟你走過前一次調查。」`,tone:[['「我想知道，你們需要我做什麼。」','「先一起把路引的事查清楚。」魏應舟答道。'],['「可以。但總得告訴我原因吧？」','「因為你知道這份案卷有哪些疑點。」魏應舟說。'],['「若能幫上忙，我願意同行。」','魏應舟微微頷首：「那就明日北岸見。」']],next:'station'},
station:{ch:'其二 · 第二篇',title:'江岸有痕',text:`晨霧籠罩天環江北岸，舊站的金屬管線垂掛在屋簷下，停用告示卻仍閃著微弱的青光。紀玖年沿貨運軌道查看，發現灰塵裡有新近留下的輪痕；魏應舟則在貨梯前停步，指出封條使用了近年才有的防偽符線。

「有人動過這裡。」魏應舟說。紀玖年敲了敲側牆，傳來一聲空響：「而且不只動過封條。」

兩人看向你，等你決定先從哪裡著手。`,decisions:[['協助紀玖年尋找暗門','gate','紀玖年'],['協助魏應舟核對封條','seal','魏應舟'],['先確認是否有人監視','watch','兩人']]},
gate:{ch:'其二 · 第二篇',title:'牆後暗門',text:`你跟著紀玖年沿輪痕往前，發現痕跡在側牆前戛然而止。紀玖年摸索到一枚隱藏扣件，牆面隨之傳出沉悶的機械聲。

「眼力不錯。」他看向你，「這趟沒白找你來。」

暗門後的通道傳來壓抑的咳嗽聲。`,tone:[['「先問問裡面的人是否需要幫忙。」','紀玖年點頭，隔著門輕聲喊話。'],['「先確認機關，再開門。」','魏應舟檢查符線，紀玖年則守在門邊。'],['「我們分工，一邊排查，一邊準備救人。」','兩人交換眼神，迅速各自就位。']],next:'witness'},
seal:{ch:'其二 · 第二篇',title:'偽造封條',text:`你與魏應舟仔細比對封條，發現新舊兩層符線規格並不相同。那枚貨運識別牌掃過邊緣時，竟浮現近期才會使用的防偽格式。

「有人拿新封條偽裝舊封存。」魏應舟將結果寫入案卷，「這份證據很重要。」

不遠處紀玖年已經找到暗門，牆後傳來一聲壓抑的咳嗽。`,tone:[['「先問問裡面的人是否需要幫忙。」','紀玖年點頭，隔著門輕聲喊話。'],['「先確認機關，再開門。」','魏應舟檢查符線，紀玖年則守在門邊。'],['「我們分工，一邊排查，一邊準備救人。」','兩人交換眼神，迅速各自就位。']],next:'witness'},
watch:{ch:'其二 · 第二篇',title:'監視符線',text:`你在二樓欄杆旁發現幾乎透明的細線，末端連著仍在運作的警示符機。你提醒兩人，紀玖年立即避到柱後，魏應舟則切斷訊號。

「有人監看這個入口。」魏應舟說。紀玖年朝你點頭：「提醒得及時。」

排除警示後，三人在側牆找到暗門，牆後傳來壓抑的咳嗽。`,tone:[['「先問問裡面的人是否需要幫忙。」','紀玖年點頭，隔著門輕聲喊話。'],['「先確認機關，再開門。」','魏應舟檢查符線，紀玖年則守在門邊。'],['「我們分工，一邊排查，一邊準備救人。」','兩人交換眼神，迅速各自就位。']],next:'witness'},
witness:{ch:'其二 · 第二篇',title:'七人之數',text:`暗門後蜷縮著一名衣衫襤褸的男子。他自稱沈文書，是失蹤商隊負責核對貨物的人。七人原本只是受雇運貨，卻被人要求改走北岸舊站；示籙遭到收走，通行紀錄隨後便顯示七人已經入城。

「其他人有的被帶走，有的逃了。」沈文書攥緊破碎的識別牌，「別去找他們……他們會知道。」

魏應舟確認識別牌是身分轉錄裝置的一部分。紀玖年則從沈文書口中問出最後的轉運地點：江北倉儲區。`,tone:[['「你能逃出來已經不容易了，剩下的交給我們。」','沈文書低頭應了一聲，終於願意喝水。'],['「你記得的細節，可能幫我們找回其他人。」','沈文書努力回想，補充了倉儲區的位置。'],['「我們不能保證毫無危險，但會繼續查。」','「希望你們知道自己在做什麼。」沈文書低聲說。']],next:'warehouse'},
warehouse:{ch:'其二 · 第三篇',title:'七人歸處',text:`江北倉儲區的貨箱堆得整整齊齊，中央轉運臺仍留有近期啟動的痕跡。紀玖年在上層隔間找到三名商旅，魏應舟則核對出身分轉錄臺的位置。

三人證實另有兩名同伴被帶往地下；最後一人在逃離水道時墜江，生死未明。救出三人後，你們循貨梯抵達地下，終於找到另外兩名被鎖定示籙的商旅。

警示符線突然亮起。紀玖年準備拆除隔離室的機關，魏應舟則要封存能追查幕後操作者的原始紀錄。你決定——`,decisions:[['協助紀玖年救出商旅','rescue','紀玖年'],['協助魏應舟封存證據','evidence','魏應舟'],['先建立安全退路，協助兩人分工','joint','兩人']]},
rescue:{ch:'其二 · 第三篇',title:'救援優先',text:`你協助紀玖年切斷隔離室的鎖定符線，最後兩名商旅終於脫困。魏應舟隨後帶著部分原始紀錄趕來，足以追查偽造通行的關鍵資料也得以保存。

「人都出來了。」紀玖年確認最後一人離開，才朝你笑了笑，「這回多虧有你。」`,next:'ending'},
evidence:{ch:'其二 · 第三篇',title:'保全證據',text:`你協助魏應舟將原始轉錄資料封存到獨立查驗匣，趕在系統自動清除之前保住完整紀錄。紀玖年也成功打開隔離室，帶著最後兩名商旅從側門撤離。

魏應舟仔細核對封存匣，才道：「這份證據很重要。謝謝。」`,next:'ending'},
joint:{ch:'其二 · 第三篇',title:'分工撤離',text:`你先切斷備用通道的警示脈線，再回頭協助兩人分工。紀玖年救出兩名商旅，魏應舟保住關鍵通行紀錄，雖有部分資料遭到系統清除，仍足以推動後續調查。

「配合得不錯。」紀玖年說。魏應舟收起封存匣：「至少沒留下需要重新收拾的局面。」`,next:'ending'},
ending:{ch:'其二 · 終卷',title:'江上歸人',text:`日暮時分，六名生還的商旅終於重新會合。三日後，江防巡查在下游找到一具遺體，經隨身物品與家屬確認，正是最後一名失蹤者。七人的去向至此全部查明。

魏應舟將證言、貨運單據與轉錄紀錄提交長明府，涉案設備遭到查封；至於幕後操作者，仍須循著封存紀錄繼續追查。紀玖年則親自將尋人文書歸還委託人。

「這回倒是把人找回來了。」紀玖年收起委託單。

魏應舟整理案卷的動作微微一頓。「不是每回都能如此。」

紀玖年沒有接話，兩人像是同時想起了某樁尚未結束的舊事。片刻後，紀玖年抬頭朝你笑道：「往後有機會，再一起走一趟鏢吧。」

天環江的水仍向東流去。這一回，終於有人等到了答案。

——《江上無歸人、其二》完。`,end:true}
};
function draw(){const s=scenes[progress?.node]||scenes.start;$('chapter').textContent=s.ch;$('title').textContent=s.title;$('prose').textContent=s.text;$('reply').classList.add('hidden');$('continue').classList.add('hidden');const choices=$('choices');choices.replaceChildren();$('choiceTitle').textContent=s.decisions?'調查選擇 · 影響人物羈絆':s.tone?'選擇你的回答':'卷宗進度';if(s.end){$('choiceTitle').textContent='卷宗結案';$('interaction').querySelector('#choices').textContent='七人去向已查明。可返回委託榜。';return}if(s.tone){s.tone.forEach(([line,reply],i)=>{const b=document.createElement('button');b.className='choice';b.textContent=line;b.onclick=()=>{choices.querySelectorAll('button').forEach(x=>x.disabled=true);$('reply').textContent=reply;$('reply').classList.remove('hidden');$('continue').classList.remove('hidden');$('continue').onclick=()=>advance(s.next)};choices.append(b)})}else if(s.decisions){s.decisions.forEach(([label,target])=>{const b=document.createElement('button');b.className='choice';b.textContent='› '+label;b.onclick=()=>advance(target);choices.append(b)})}else{$('continue').textContent='繼續 ›';$('continue').classList.remove('hidden');$('continue').onclick=()=>advance(s.next)}}
async function advance(to){if(busy)return;busy=true;$('status').textContent='正在核驗選擇並保存雲端進度……';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const {data,error}=await db.rpc('jiang2_advance',{p_to_node:to});if(error)throw error;progress=data;draw();$('status').textContent='行跡已保存至雲端示籙。';window.scrollTo({top:280,behavior:'smooth'})}catch(e){$('status').textContent='保存失敗：'+e.message;draw()}finally{busy=false}}
async function init(){try{if(!db)throw Error('找不到 supabase-client.js');const {data,error}=await db.auth.getUser();if(error)throw error;if(!data.user)throw Error('請先登入線上示籙');const r=await db.rpc('jiang2_start');if(r.error)throw r.error;progress=r.data;draw();$('status').textContent='雲端存檔已載入。'}catch(e){$('title').textContent='卷宗暫時無法啟封';$('prose').textContent='請確認已登入並執行配套 SQL。';$('interaction').classList.add('hidden');$('status').textContent=e.message}}init();
</script></body></html>
