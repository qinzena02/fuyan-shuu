
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>負驗書｜示籙登記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
      color: #e8dfcb;

      background:
        linear-gradient(
          rgba(5, 13, 18, 0.75),
          rgba(5, 13, 18, 0.93)
        ),
        url("images/xianling-bg.jpg.jpg") center / cover fixed no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 16px;
      border: 1px solid rgba(191, 161, 100, 0.25);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    .top-label {
      text-align: center;
      color: #8fc4b8;
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    .title {
      text-align: center;
      font-size: 46px;
      font-weight: 500;
      letter-spacing: 12px;
      color: #dec38b;
      margin: 0 0 12px;
      text-shadow: 0 0 25px rgba(203, 172, 107, 0.28);
    }

    .subtitle {
      text-align: center;
      color: #a5b8b0;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 34px;
    }

    .panel {
      position: relative;
      padding: 38px 35px;
      background: rgba(9, 25, 29, 0.92);
      border: 1px solid #927a52;
      box-shadow:
        0 0 40px rgba(0, 0, 0, 0.55),
        inset 0 0 35px rgba(40, 99, 88, 0.12);
      backdrop-filter: blur(12px);
    }

    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #d8ba79;
      border-style: solid;
      pointer-events: none;
    }

    .panel::before {
      top: -5px;
      left: -5px;
      border-width: 2px 0 0 2px;
    }

    .panel::after {
      bottom: -5px;
      right: -5px;
      border-width: 0 2px 2px 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #8bc5b7;
      font-size: 11px;
      letter-spacing: 2px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(190, 161, 104, 0.35);
    }

    .seal {
      text-align: center;
      padding: 28px 0 12px;
    }

    .seal-symbol {
      display: inline-flex;
      width: 82px;
      height: 82px;
      border: 1px solid #c4a46b;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #d9c18e;
      animation: sealGlow 4s ease-in-out infinite;
    }

    @keyframes sealGlow {
      0%, 100% {
        box-shadow: 0 0 12px rgba(92, 180, 162, 0.12);
      }
      50% {
        box-shadow: 0 0 30px rgba(92, 180, 162, 0.35);
      }
    }

    .section-title {
      text-align: center;
      font-size: 25px;
      color: #e4ca94;
      letter-spacing: 6px;
      margin: 12px 0;
    }

    .description {
      text-align: center;
      font-size: 13px;
      line-height: 2;
      color: #9cb7ad;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #c4b58e;
      margin-bottom: 11px;
      letter-spacing: 2px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      background: #102328;
      border: 1px solid #456b62;
      color: #f2e8d4;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: 0.3s;
    }

    input:focus,
    select:focus {
      border-color: #bca06b;
      box-shadow: 0 0 15px rgba(105, 193, 175, 0.18);
    }

    input::placeholder {
      color: #78928a;
    }

    .hint {
      font-size: 11px;
      color: #829d94;
      margin-top: 9px;
      line-height: 1.8;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      background: linear-gradient(135deg, #244d47, #397467);
      border: 1px solid #9c936d;
      color: #f3e6c8;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, #397467, #4a9684);
      box-shadow: 0 0 24px rgba(88, 186, 165, 0.25);
      transform: translateY(-2px);
    }

    .secondary-button {
      background: transparent;
      border: 1px solid #607e74;
      color: #a9c7bb;
    }

    .secondary-button:hover {
      background: rgba(77, 123, 111, 0.2);
    }

    .hidden {
      display: none;
    }

    .profile {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid rgba(190, 161, 104, 0.3);
      background: rgba(5, 18, 21, 0.55);
    }

    .profile-row {
      padding: 12px 0;
      border-bottom: 1px solid rgba(125, 157, 145, 0.2);
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .profile-label {
      display: block;
      color: #8caea2;
      font-size: 11px;
      margin-bottom: 7px;
      letter-spacing: 2px;
    }

    .profile-value {
      display: block;
      color: #e4ca94;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .status {
      text-align: center;
      margin-top: 22px;
      color: #8da79e;
      font-size: 12px;
      line-height: 2;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 11px;
      color: #91aca3;
      letter-spacing: 2px;
      line-height: 2;
    }

    @media (max-width: 480px) {
      .title {
        font-size: 34px;
        letter-spacing: 7px;
      }

      .panel {
        padding: 26px 20px;
      }

      .panel-header {
        font-size: 9px;
        letter-spacing: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .seal-symbol {
        animation: none;
      }

      button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="top-label">
      咸陵 · 長明府 · 天監院
    </div>

    <h1 class="title">負驗書</h1>

    <div class="subtitle">
      官方身分核驗終端
    </div>

    <section class="panel">

      <div class="panel-header">
        <span>CHANGMING / 001</span>
        <span>示籙核驗系統</span>
      </div>

      <div class="seal">
        <div class="seal-symbol">籙</div>
      </div>

      <h2 class="section-title">示籙登記</h2>

      <p class="description">
        天下地脈，皆有所循。<br>
        凡入咸陵者，須先立籙。<br>
        姓名、師承、來處，皆錄於此。
      </p>

      <!-- 角色建立與修改表單 -->
      <div id="register" class="hidden">

        <form id="registerForm">

          <div class="field">
            <label for="playerName">壹 · 示籙姓名</label>

            <input
              type="text"
              id="playerName"
              placeholder="請輸入你的姓名"
              maxlength="20"
              autocomplete="off"
              required
            >
          </div>

          <div class="field">
            <label for="playerSect">貳 · 所屬門派</label>

            <select id="playerSect" required>
              <option value="">請選擇所屬門派</option>
              <option value="赤霄山莊">赤霄山莊</option>
              <option value="天衡門">天衡門</option>
              <option value="玄水宮">玄水宮</option>
              <option value="萬象樓">萬象樓</option>
              <option value="無門無派">無門無派</option>
            </select>

            <div class="hint">
              太微門暫不開放一般示籙登記。
            </div>
          </div>

          <div class="field">
            <label for="playerOrigin">參 · 初始出生地</label>

            <select id="playerOrigin" required>
              <option value="">請選擇出生地</option>
              <option value="咸陵主城">咸陵主城</option>
              <option value="天環江沿岸">天環江沿岸</option>
              <option value="萬樞堂">萬樞堂</option>
              <option value="第三演武場">第三演武場</option>
              <option value="渡山河">渡山河</option>
              <option value="牽星大廳">牽星大廳</option>
            </select>
          </div>

          <button type="submit" id="saveButton">
            核准示籙 · 保存身分
          </button>

        </form>

      </div>

      <!-- 已登記玩家 -->
      <div id="welcome" class="hidden">

        <p class="description">
          示籙核驗完成。<br>
          長明府已收錄你的身分。
        </p>

        <div class="profile">

          <div class="profile-row">
            <span class="profile-label">示籙姓名</span>
            <span class="profile-value" id="displayName"></span>
          </div>

          <div class="profile-row">
            <span class="profile-label">所屬門派</span>
            <span class="profile-value" id="displaySect"></span>
          </div>

          <div class="profile-row">
            <span class="profile-label">初始出生地</span>
            <span class="profile-value" id="displayOrigin"></span>
          </div>

        </div>

        <button type="button" id="enterButton">
          進入咸陵
        </button>

        <button type="button" id="editButton" class="secondary-button">
          修改示籙資料
        </button>

      </div>

      <div class="status" id="status">
        天監院示籙終端已啟動。等待身分核驗。
      </div>

    </section>

    <div class="footer">
      長明府 · 天監院<br>
      地脈運行監察中
    </div>

  </main>

  <script>
    const key = "fuyanshu_player";

    const register = document.getElementById("register");
    const welcome = document.getElementById("welcome");

    const playerName = document.getElementById("playerName");
    const playerSect = document.getElementById("playerSect");
    const playerOrigin = document.getElementById("playerOrigin");

    const displayName = document.getElementById("displayName");
    const displaySect = document.getElementById("displaySect");
    const displayOrigin = document.getElementById("displayOrigin");

    const statusText = document.getElementById("status");
    const saveButton = document.getElementById("saveButton");

    const validSects = [
      "赤霄山莊",
      "天衡門",
      "玄水宮",
      "萬象樓",
      "無門無派"
    ];

    const validOrigins = [
      "咸陵主城",
      "天環江沿岸",
      "萬樞堂",
      "第三演武場",
      "渡山河",
      "牽星大廳"
    ];

    let currentPlayer = null;

    // 顯示玩家示籙
    function showPlayer(player) {
      currentPlayer = player;

      displayName.textContent = player.name;
      displaySect.textContent =
        validSects.includes(player.sect)
          ? player.sect
          : "尚未登記";

      displayOrigin.textContent =
        validOrigins.includes(player.origin)
          ? player.origin
          : "尚未登記";

      register.classList.add("hidden");
      welcome.classList.remove("hidden");

      statusText.textContent = "身分核驗通過，准予入城。";
    }

    // 開啟編輯模式
    function editPlayer() {
      if (currentPlayer) {
        playerName.value = currentPlayer.name || "";
        playerSect.value =
          validSects.includes(currentPlayer.sect)
            ? currentPlayer.sect
            : "";

        playerOrigin.value =
          validOrigins.includes(currentPlayer.origin)
            ? currentPlayer.origin
            : "";

        saveButton.textContent = "核准修改 · 保存示籙";
      } else {
        playerName.value = "";
        playerSect.value = "";
        playerOrigin.value = "";
        saveButton.textContent = "核准示籙 · 保存身分";
      }

      welcome.classList.add("hidden");
      register.classList.remove("hidden");

      statusText.textContent = "請核對示籙資料。";
    }

    // 讀取舊玩家資料
    try {
      const saved = JSON.parse(localStorage.getItem(key));

      if (
        saved &&
        typeof saved.name === "string" &&
        saved.name.trim()
      ) {
        showPlayer(saved);
      } else {
        editPlayer();
      }
    } catch (error) {
      editPlayer();
    }

    // 建立或修改示籙
    document.getElementById("registerForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const name = playerName.value.trim();
        const sect = playerSect.value;
        const origin = playerOrigin.value;

        if (!name) {
          alert("請填寫示籙姓名。");
          return;
        }

        if (!validSects.includes(sect)) {
          alert("請選擇所屬門派。");
          return;
        }

        if (!validOrigins.includes(origin)) {
          alert("請選擇初始出生地。");
          return;
        }

        // 保留原有玩家其他資料
        const player = {
          ...(currentPlayer || {}),
          name: name,
          sect: sect,
          origin: origin
        };

        try {
          localStorage.setItem(
            key,
            JSON.stringify(player)
          );

          showPlayer(player);

        } catch (error) {
          alert("無法儲存示籙，請檢查瀏覽器設定。");
        }
      });

    // 修改資料
    document.getElementById("editButton")
      .addEventListener("click", editPlayer);

    // 進入咸陵
    document.getElementById("enterButton")
      .addEventListener("click", function() {
        window.location.href = "intro.html";
      });
  </script>

</body>
</html>
