:9px 0;font-size:13px}.stat span:last-child{color:#c5dbd0}.clues{list-style:none;margin:10px 0 0;padding:0;font-size:13px;color:#c6d5cb}.clues li{padding:7px 0;border-bottom:1px solid #29473f}.muted{color:#8faea3;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.smallbtn{background:transparent;border:1px solid #806f50;color:#d9c08f;padding:8px 13px;font-size:13px}.smallbtn:hover{background:#20302e}.note{font-size:12px;color:#88a69a;margin-top:14px}.end{color:#e1c998;border-top:1px solid #6e6047;margin-top:20px;padding-top:15px}/* 收合式行旅側欄 */

<header><div class="brand">負驗書</div><nav class="topnav"><a href="city.html">咸陵主城</a><a href="bounty.html">鏢局委託榜</a></nav></header>
<div class="shell">
<section class="masthead"><div class="eyebrow">咸陵鏢局 · 委託演繹 · 卷一</div><h1>江上無歸人</h1><p>天環江商旅失蹤案</p></section>
<div class="layout">
<main class="panel" aria-live="polite"><div class="chapter" id="chapter">案卷啟封</div><h2 class="scene-title" id="sceneTitle">渡口初逢</h2><div class="prose" id="prose"></div><div class="choices" id="choices"></div><div class="toolbar"><button class="smallbtn" id="restart">重新調查</button><a class="smallbtn" href="bounty.html">返回委託榜</a></div><div class="note" id="saveNote">正在連線雲端示籙……</div></main>
<aside class="status-sidebar" id="statusSidebar" aria-label="行旅狀態" aria-hidden="true"><div class="sidebar-top"><h3 class="aside-title" style="margin:0">示籙 · 行旅狀態</h3><button class="sidebar-close" id="closeStatus" type="button">收合 ×</button></div><div class="stat"><span>持有人</span><span id="playerName">旅人</span></div><div class="stat"><span>仁德值</span><span id="virtue">50</span></div><div class="stat"><span>紀玖年 · 親近</span><span id="jiu">0</span></div><div class="stat"><span>魏應舟 · 信任</span><span id="wei">0</span></div><h3 class="aside-title" style="margin-top:28px">已獲線索</h3><ul class="clues" id="clues"><li class="muted">尚無線索</li></ul><p class="note">仁德值代表制度評價；人物關係與線索將隨調查推進。</p></aside>
</div></div><button type="button" class="status-toggle" id="statusToggle" aria-expanded="false" aria-controls="statusSidebar">行旅狀態 ◇</button><div class="sidebar-backdrop" id="statusBackdrop"></div><footer>長明府 · 示籙已錄 · 行跡有循</footer>

<script>
'use strict';
const SAVE_KEY='fuyanshu_story_jiang_v1';
const PLAYER_KEY='fuyanshu_player';
let player=null;try{player=JSON.parse(localStorage.getItem(PLAYER_KEY)||'null')}catch(e){}
if(!player||!player.name){location.replace('index.html')}
const $=id=>document.getElementById(id);
const name=player&&player.name?String(player.name):'旅人';
const initialVirtue=()=>{let n=Number(localStorage.getItem('fuyanshu_virtue')??player?.virtue??50);return Number.isFinite(n)?n:50};
const newState=()=>({node:'start',virtue:initialVirtue(),jiu:0,wei:0,clues:[],visited:[],done:false});
let state=newState();
try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(saved&&typeof saved.node==='string'&&Array.isArray(saved.clues)&&Array.isArray(saved.visited))state={...newState(),...saved,virtue:initialVirtue()}}catch(e){}
const scenes={
start:{chapter:'卷一 · 渡口初逢',title:'江水無聲',text:`承光年間，天環江渡口。\n\n暮色將盡，脈軌的光影掠過江面。一支本該在三日前抵達城南的商隊，連人帶貨消失在江上。奇怪的是，天監院的示籙紀錄卻顯示：他們已經入城。\n\n碼頭旁，紀玖年蹲在濕冷的石階上，正端詳一截斷裂的繩索。魏應舟站在燈下，手中捏著鏢局的委託文書。\n\n「你就是接了案子的人？」紀玖年抬頭。`,choices:[['先詢問紀玖年發現了什麼','rope',{jiu:1}],['向魏應舟索取正式案卷','register',{wei:1}],['先觀察渡口周圍','dock',{}]]},
rope:{chapter:'卷一 · 初步查驗',title:'斷索',text:`紀玖年將繩索遞來。斷面並不整齊，卻也不像尋常拉扯所致。\n\n「這是從舊泊位撿到的。」她說，「那晚有人見過商船靠岸，但沒人看見卸貨。」\n\n魏應舟提醒：「傳聞不能當證據。先核對案卷。」`,clue:'異常斷索',choices:[['與魏應舟核對示籙紀錄','register',{}],['前往舊泊位尋找目擊者','witness',{jiu:1}]]},
register:{chapter:'卷一 · 初步查驗',title:'紙上入城',text:`魏應舟攤開案卷。商隊七人的示籙在三日前子夜同時留下入城紀錄，卻沒有任何城門守衛的交接簽記。\n\n「紀錄是真的，未必代表人真的進來了。」他說。\n\n紀玖年忽然指向一行細字：七人的通行核驗，竟由同一座早已停用的舊式符機完成。`,clue:'異常示籙紀錄',choices:[['先去舊泊位查訪','witness',{wei:1}],['向長明府呈報可疑核驗','official',{virtue:3}],['私下追查停用符機','machine',{virtue:-2,jiu:1}]]},
dock:{chapter:'卷一 · 渡口查探',title:'潮痕',text:`你沿著泊位緩緩走過。江風裡混著機油與潮濕木屑的氣味。\n\n一處石階上的水痕高得異常，旁邊留有被拖行的淺痕。碼頭的貨物簿卻沒有那夜的卸貨記錄。\n\n你記下位置，返回二人身旁。`,clue:'舊泊位拖痕',choices:[['請紀玖年檢查斷索','rope',{}],['查閱魏應舟的案卷','register',{}],['尋找渡口證人','witness',{}]]},
witness:{chapter:'卷二 · 江上疑雲',title:'夜半船燈',text:`老船夫隔著茶盞打量你。\n\n「船確實來過。」他低聲說，「可那夜沒有靠岸的鑼聲。船燈滅了以後，我看見有人從舊倉庫方向搬走一只黑箱。」\n\n他不願留下姓名，只反覆叮囑你：別把他說過的話交給巡查的人。`,clue:'船夫證言',choices:[['答應保護船夫身分，追查舊倉庫','machine',{jiu:2,virtue:-2}],['將證言如實寫入正式案卷','official',{wei:2,virtue:2}],['先回頭比對示籙紀錄','register',{}]]},
machine:{chapter:'卷二 · 江上疑雲',title:'停用的符機',text:`舊倉庫深處，一座本應報廢的示籙核驗符機仍亮著微光。機匣被人重新接上地脈支線，內部殘留七次連續通行的刻痕。\n\n紀玖年蹲下，指尖掠過符紋：「有人借它偽造入城，讓失蹤的人在紙面上消失。」\n\n角落的黑箱早已空了。箱底只剩一枚沾水的商隊銅牌。`,clue:'私接地脈的舊符機',choices:[['保留證物，交由長明府依法查驗','official',{wei:1,virtue:2}],['先將銅牌交給紀玖年，循江追人','private',{jiu:2,virtue:-3}]]},
official:{chapter:'卷三 · 案牘歸處',title:'依律移交',text:`你將已取得的線索整理成案卷，交由長明府受理。魏應舟逐項核對證物，沒有放過任何一處矛盾。\n\n「至少，這份紀錄不會再被當作尋常失蹤案草草歸檔。」他說。\n\n紀玖年望向江面。她知道，真正帶走商隊的人或許仍在暗處。`,choices:[['簽署移交文書，正式結案','end_official',{}],['暫緩移交，沿江繼續追查','private',{jiu:1,virtue:-2}]]},
private:{chapter:'卷三 · 案牘歸處',title:'江水向東',text:`你決定暫時不將所有證物交出。紀玖年帶你循著江岸舊路追去，魏應舟則留下來守住已取得的案卷。\n\n一艘無燈小舟泊在蘆葦後方。船上沒有人，只有一張濕透的貨運路引，目的地被人刻意刮去。\n\n線索指向更遠的江段；今晚，已無法追上。`,clue:'被塗改的貨運路引',choices:[['保存線索，繼續追查失蹤者','end_private',{}],['返回鏢局，承認案件尚未查明','end_open',{}]]},
end_official:{chapter:'終卷 · 案件紀錄',title:'結局一 · 依法結案',text:`案卷獲准移交。長明府將此事列為待續查的符機異常案件，鏢局委託在程序上暫告一段落。\n\n你保住了能夠呈堂的證據，也接受了制度所能給出的答案。\n\n至於商隊七人究竟身在何處，江水沒有回答。`,ending:true},
end_private:{chapter:'終卷 · 案件紀錄',title:'結局二 · 江上未歸',text:`你沒有放棄尋找活人的可能。紀玖年將那張路引收進袖中，說改日還要再走一趟江岸。\n\n鏢局的案卷仍未封存，長明府的通行紀錄依舊寫著七人已入城。\n\n你知道那是謊言，也知道下一步會更難。`,ending:true},
end_open:{chapter:'終卷 · 案件紀錄',title:'結局三 · 真相未明',text:`你帶著未能串成完整答案的線索回到鏢局。魏應舟在案卷末尾寫下「尚待查證」，紀玖年則把江岸的位置圈了起來。\n\n沒有足夠的證據，就不該假裝已經看見真相。\n\n夜色深處，天環江仍有船燈緩緩遠去。`,ending:true}
};
// 雲端進度是節點與仁德值的權威來源；舊本機進度先備份，不會覆蓋雲端。
const STORY_ID='jiang';
const OLD_BACKUP_KEY='fuyanshu_story_jiang_before_cloud';
let db=null,cloudReady=false,busy=true;
let localOriginal=null;
try{localOriginal=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}
if(localOriginal && !localStorage.getItem(OLD_BACKUP_KEY))localStorage.setItem(OLD_BACKUP_KEY,JSON.stringify(localOriginal));
const note=$('saveNote');
function status(message){note.textContent=message;}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));}
function showVirtue(n){if(Number.isFinite(Number(n))){state.virtue=Number(n);localStorage.setItem('fuyanshu_virtue',String(state.virtue));}}
function enterNode(){const scene=scenes[state.node]||scenes.start;if(scene.clue&&!state.clues.includes(scene.clue))state.clues.push(scene.clue);state.done=!!scene.ending;persist();render();}
function render(){
 const scene=scenes[state.node]||scenes.start;
 $('playerName').textContent=name;$('virtue').textContent=state.virtue;$('jiu').textContent=state.jiu;$('wei').textContent=state.wei;
 $('chapter').textContent=scene.chapter;$('sceneTitle').textContent=scene.title;$('prose').textContent=scene.text;
 for(const el of [$('chapter'),$('sceneTitle'),$('prose'),$('choices')]){el.classList.remove('fade-in');void el.offsetWidth;el.classList.add('fade-in');}
 const list=$('clues');list.replaceChildren();
 if(!state.clues.length){const li=document.createElement('li');li.textContent='尚無線索';li.className='muted';list.append(li)}
 else state.clues.forEach(c=>{const li=document.createElement('li');li.textContent='◇ '+c;list.append(li)});
 const choices=$('choices');choices.replaceChildren();
 if(scene.ending){const p=document.createElement('p');p.className='end';p.textContent='本次調查已結束。你可以返回鏢局，或重新調查，尋找另一種結局。';choices.append(p)}
 else scene.choices.forEach(([label,target,effect])=>{const b=document.createElement('button');b.type='button';b.className='choice';b.disabled=busy||!cloudReady;b.textContent='› '+label;b.addEventListener('click',()=>choose(target,effect));choices.append(b)});
 $('restart').disabled=busy||!cloudReady;
}
async function fetchVirtue(){
 const {data,error}=await db.from('player_profiles').select('virtue_points').single();
 if(error)throw error;
 if(!data||typeof data.virtue_points!=='number')throw new Error('無法讀取線上示籙仁德值');
 showVirtue(data.virtue_points);
}
async function choose(target,effect){
 if(busy||!cloudReady||!scenes[target])return;
 const current=scenes[state.node];
 if(!current.choices||!current.choices.some(x=>x[1]===target))return;
 busy=true;render();status('長明府正在核驗行跡與仁德值，請稍候……');
 try{
  const from=state.node,key=from+'>'+target;
  const {data,error}=await db.rpc('advance_story',{p_story_id:STORY_ID,p_to_node:target});
  if(error)throw error;
  if(!data||!data.progress||data.progress.current_node!==target)throw new Error('雲端回傳進度異常');
  if(!state.visited.includes(key)){
   state.visited.push(key);state.jiu+=Number(effect.jiu||0);state.wei+=Number(effect.wei||0);
  }
  state.node=target;showVirtue(data.virtue_points);enterNode();
  status('行跡已寫入雲端，仁德值已同步。人物關係與線索另保存在本機。');
 }catch(e){status('雲端保存失敗，未切換劇情：'+(e.message||String(e)));}
 finally{busy=false;render();}
}
async function initializeCloud(){
 status('正在核對線上示籙與雲端劇情存檔……');render();
 try{
  db=window.fuyanshuDB;
  if(!db)throw new Error('找不到 Supabase 連線，請確認 supabase-client.js 已上傳');
  const {data:auth,error:authError}=await db.auth.getUser();
  if(authError)throw authError;
  if(!auth||!auth.user)throw new Error('尚未登入 Supabase 線上帳號，請先返回主城登入');
  const {data:progress,error}=await db.rpc('start_story',{p_story_id:STORY_ID});
  if(error)throw error;
  if(!progress||!scenes[progress.current_node])throw new Error('雲端進度無法辨識');
  await fetchVirtue();
  const previous=state;
  const cloudNode=progress.current_node;
  // 本機與雲端節點一致時，保留本機好感度與線索；不同則以雲端節點為準。
  // 舊本機存檔永久備份在 OLD_BACKUP_KEY，避免被默默覆蓋。
  if(previous.node===cloudNode){state={...previous,node:cloudNode,virtue:state.virtue};}
  else {state={...newState(),node:cloudNode,virtue:state.virtue};}
  if(Array.isArray(progress.visited)&&progress.visited.length>1&&previous.node!==cloudNode){
   status('已載入雲端進度；舊本機進度已備份，人物關係與線索可能需要重新整理。');
  }else if(previous.node!==cloudNode && previous.node!=='start'){
   status('偵測到舊本機存檔，已備份至 '+OLD_BACKUP_KEY+'；雲端目前從 '+cloudNode+' 開始。舊進度不會自動取得獎懲。');
  }else status('已連上雲端示籙，劇情選擇將同步仁德值。');
  cloudReady=true;enterNode();
 }catch(e){cloudReady=false;status('無法啟用雲端劇情：'+(e.message||String(e))+'。為保護資料，暫時禁止選擇與重新調查。');}
 finally{busy=false;render();}
}
// 行旅狀態抽屜：可用按鈕、遮罩或 Escape 關閉
const sidebar=$('statusSidebar'),toggle=$('statusToggle'),backdrop=$('statusBackdrop');
function setSidebar(open){sidebar.classList.toggle('open',open);backdrop.classList.toggle('open',open);sidebar.setAttribute('aria-hidden',String(!open));toggle.setAttribute('aria-expanded',String(open));if(open)$('closeStatus').focus();else toggle.focus();}
toggle.addEventListener('click',()=>setSidebar(true));
$('closeStatus').addEventListener('click',()=>setSidebar(false));
backdrop.addEventListener('click',()=>setSidebar(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sidebar.classList.contains('open'))setSidebar(false)});
$('restart').addEventListener('click',async()=>{
 if(busy||!cloudReady)return;
 if(!confirm('重新調查會將本案雲端節點重設為起點，線索與本案人物關係歸零；已領取的仁德值獎懲不會重複結算。確定嗎？'))return;
 busy=true;render();status('正在重新開啟案卷……');
 try{
  const {data,error}=await db.rpc('restart_story',{p_story_id:STORY_ID});
  if(error)throw error;
  if(!data||data.current_node!=='start')throw new Error('重新調查未完成');
  const currentVirtue=state.virtue;state={...newState(),virtue:currentVirtue};enterNode();
  status('已重新調查；過去的仁德值獎懲不會重複發放。');window.scrollTo({top:0,behavior:'smooth'});
 }catch(e){status('無法重新調查：'+(e.message||String(e))+'。請確認已執行配套 SQL。');}
 finally{busy=false;render();}
});
initializeCloud();
</script>
