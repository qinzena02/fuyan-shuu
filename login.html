<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>負驗書｜示籙身分核驗</title>
<style>
:root{color-scheme:dark;--bg:#091113;--panel:#102123;--line:#38594f;--gold:#dfc899;--cyan:#79e8ee;--muted:#9db6ab;--text:#ded6c5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 14%,#1c3937 0%,#091113 68%);color:var(--text);font-family:"Microsoft JhengHei","Noto Serif TC",serif;line-height:1.8}
a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px max(20px,calc((100vw - 1050px)/2));border-bottom:1px solid #2f4c45;background:#0b181a}.brand{font-size:22px;letter-spacing:5px;color:var(--gold);text-shadow:0 0 18px #d9bc744a}.back{font-size:13px;color:#9bbcb2}
main{max-width:490px;margin:55px auto 70px;padding:0 18px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:3px;text-align:center}.heading{font-size:clamp(28px,5vw,37px);font-weight:normal;color:var(--gold);letter-spacing:5px;text-align:center;text-shadow:0 0 22px #e0bd726b;margin:10px 0}.lead{text-align:center;font-size:13px;color:var(--muted);margin:0 0 27px}.panel{border:1px solid var(--line);background:linear-gradient(155deg,#142b2a,#0c191b);padding:clamp(20px,5vw,32px);box-shadow:0 20px 65px #0006}.tabs{display:flex;border-bottom:1px solid #37574e;margin-bottom:24px}.tab{flex:1;padding:10px;border:0;border-bottom:2px solid transparent;background:transparent;color:#90b0a5;font:inherit;cursor:pointer}.tab[aria-selected=true]{color:var(--gold);border-color:#d4b778}.field{margin-bottom:16px}.field label{display:block;color:#b6cbbd;font-size:13px;margin-bottom:6px}input{width:100%;padding:12px 13px;border:1px solid #4b6a60;background:#09191b;color:#f0e8d5;border-radius:2px;font:inherit;font-size:15px}input:focus{outline:1px solid var(--cyan);border-color:var(--cyan)}input::placeholder{color:#78948b}.help{color:#91a89f;font-size:12px;margin:-6px 0 18px}.action{width:100%;padding:11px 16px;border:1px solid #bfa674;background:#263a35;color:#f1dba9;font:inherit;letter-spacing:2px;cursor:pointer;transition:.2s}.action:hover:not(:disabled){background:#31534a;box-shadow:0 0 16px #c4ac6538}.action:disabled{opacity:.55;cursor:wait}.secondary{background:transparent;border-color:#53786b;color:#a8d4c5;letter-spacing:1px}.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:19px;font-size:12px}.status{margin-top:19px;padding:11px 13px;border-left:3px solid #6fae9f;background:#102b2b;color:#c8e5da;font-size:13px;white-space:pre-line}.status.error{border-color:#ff6b79;background:#30191f;color:#ffc0c8}.status[hidden], [hidden]{display:none!important}.account{font-size:14px;color:#c5d7ca;overflow-wrap:anywhere}.account strong{color:var(--gold)}.divider{height:1px;background:#37574e;margin:20px 0}.profile-card{border:1px solid #456b61;background:#0c1c1e;padding:15px;margin:16px 0;color:#d5e5d9;font-size:13px}.profile-card strong{color:var(--gold)}.profile-card p{margin:5px 0}.action+.action{margin-top:10px}.foot{text-align:center;color:#6f9286;font-size:12px;margin-top:25px}@media(max-width:520px){main{margin-top:35px}.panel{padding:21px}}
</style>
</head>
<body>
<header><div class="brand">負驗書</div><a class="back" href="world.html?page=city.html">← 返回咸陵主城</a></header>
<main>
<div class="eyebrow">CHANGMING AUTHENTICATION · 天監院</div>
<h1 class="heading">示籙身分核驗</h1>
<p class="lead">凡入咸陵者，須留其名。凡行江湖者，須驗其身。</p>
<section class="panel" aria-label="玩家帳號">
<div id="loading">正在核驗線上帳號……</div>
<div id="authView" hidden>
<div class="tabs" role="tablist" aria-label="登入或註冊">
<button class="tab" id="loginTab" type="button" role="tab" aria-selected="true">登入</button>
<button class="tab" id="registerTab" type="button" role="tab" aria-selected="false">註冊</button>
</div>
<form id="authForm">
<div class="field"><label for="email">電子郵件</label><input id="email" type="email" autocomplete="email" placeholder="請輸入電子郵件" required maxlength="254"></div>
<div class="field"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required minlength="6"></div>
<div class="field" id="confirmField" hidden><label for="confirmPassword">確認密碼</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次輸入密碼" minlength="6"></div>
<p class="help" id="formHelp">登入後可使用你的線上玩家帳號。</p>
<button class="action" id="submitButton" type="submit">核驗身分 · 登入</button>
</form>
<div class="links"><button type="button" id="forgotButton" class="tab" style="flex:initial;padding:0;border:0">忘記密碼？</button><a href="index.html">尚未建立示籙？</a></div>
</div>
<div id="resetView" hidden>
<p class="account">請設定新的登入密碼。</p>
<form id="resetForm"><div class="field"><label for="newPassword">新密碼</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label for="newPasswordAgain">再次輸入新密碼</label><input id="newPasswordAgain" type="password" autocomplete="new-password" minlength="6" required></div><button class="action" id="resetButton" type="submit">更新密碼</button></form>
</div>
<div id="accountView" hidden>
<div class="eyebrow" style="text-align:left">ACCOUNT VERIFIED · 已通過核驗</div>
<p class="account">目前登入帳號：<br><strong id="accountEmail"></strong></p>
<div id="profileInfo" class="profile-card" hidden></div>
<p class="help" id="profileHelp">正在確認你的線上示籙……</p>
<button class="action" id="confirmBind" type="button" hidden>確認將此示籙綁定至帳號</button>
<button class="action secondary" id="changeProfile" type="button" hidden>這不是我的示籙 · 重新登記</button>
<button class="action" id="enterButton" type="button" hidden>進入咸陵主城 →</button>
<div class="divider"></div>
<button type="button" class="action secondary" id="logoutButton">登出線上帳號</button>
</div>
<div class="status" id="status" role="status" aria-live="polite" hidden></div>
</section>
<p class="foot">長明府 · 天監院　｜　此頁僅供線上帳號核驗</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const status=$('status');
const CITY_URL='world.html?page=city.html';
const INTRO_URL='intro.html';
const PROFILE_KEY='fuyanshu_player';
const OWNER_KEY='fuyanshu_profile_owner';
const validSects=new Set(['赤霄山莊','天衡門','玄水宮','萬象樓','無門無派']);
const validOrigins=new Set(['咸陵主城','天環江沿岸','萬樞堂','第三演武場','渡山河','牽星大廳']);
function message(text,error=false){status.textContent=text;status.classList.toggle('error',error);status.hidden=!text;}
function show(which){['loading','authView','resetView','accountView'].forEach(id=>$(id).hidden=id!==which);}
function busy(value){['submitButton','resetButton','logoutButton','confirmBind','enterButton'].forEach(id=>$(id).disabled=value);}
function localProfile(){try{const p=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null');if(!p||typeof p!=='object')return null;return {character_name:String(p.name||'').trim(),sect:String(p.sect||'').trim(),origin:String(p.origin||'').trim()};}catch{return null;}}
function validProfile(p){return !!p&&p.character_name.length>=1&&p.character_name.length<=20&&validSects.has(p.sect)&&validOrigins.has(p.origin);}
function profileHtml(p){const box=$('profileInfo');box.replaceChildren();for(const [label,value] of [['示籙姓名',p.character_name],['所屬門派',p.sect],['籍貫',p.origin]]){const line=document.createElement('p'),strong=document.createElement('strong');strong.textContent=label+'：';line.append(strong,document.createTextNode(value));box.append(line);}box.hidden=false;}
function storeProfile(p,userId){const old=localProfile();const copy={...(old&&typeof old==='object'?JSON.parse(localStorage.getItem(PROFILE_KEY)):{}),name:p.character_name,sect:p.sect,origin:p.origin};localStorage.setItem(PROFILE_KEY,JSON.stringify(copy));localStorage.setItem(OWNER_KEY,userId);}
let db;
try{db=window.fuyanshuDB;if(!db||typeof db.auth?.signInWithPassword!=='function')throw Error('連線尚未建立');}
catch(e){show('loading');$('loading').textContent='無法連線至長明府帳號系統。請確認 supabase-client.js 已上傳且 Publishable key 正確。';return;}
let mode='login',recovery=false,currentUser=null,ready=false,pendingProfile=null;
function setMode(next){mode=next;const register=mode==='register';$('loginTab').setAttribute('aria-selected',String(!register));$('registerTab').setAttribute('aria-selected',String(register));$('confirmField').hidden=!register;$('confirmPassword').required=register;$('password').autocomplete=register?'new-password':'current-password';$('submitButton').textContent=register?'建立線上帳號':'核驗身分 · 登入';$('formHelp').textContent=register?'註冊後可能需要先到電子郵件收取驗證信。密碼至少 6 個字元。':'登入後將核對你的線上示籙。';message('');}
$('loginTab').addEventListener('click',()=>setMode('login'));
$('registerTab').addEventListener('click',()=>setMode('register'));
function controls({confirm=false,change=false,enter=false}={}){$('confirmBind').hidden=!confirm;$('changeProfile').hidden=!change;$('enterButton').hidden=!enter;}
async function syncProfile(user,{navigate=false}={}){
 if(!user?.id)return;
 currentUser=user;ready=false;pendingProfile=null;show('accountView');controls();$('accountEmail').textContent=user.email||'已驗證玩家';$('profileInfo').hidden=true;$('profileHelp').textContent='正在查詢長明府線上示籙……';
 try{
  const {data,error}=await db.from('player_profiles').select('user_id,character_name,sect,origin').eq('user_id',user.id).maybeSingle();
  if(error)throw error;
  if(data){storeProfile(data,user.id);profileHtml(data);$('profileHelp').textContent='已載入此帳號的線上示籙。';controls({enter:true});ready=true;if(navigate)location.assign(CITY_URL);return;}
  const local=localProfile();const owner=localStorage.getItem(OWNER_KEY);
  if(owner&&owner!==user.id){$('profileHelp').textContent='此瀏覽器的示籙曾綁定其他帳號。為避免冒用，請重新登記此帳號的角色資料。';controls({change:true});return;}
  if(!validProfile(local)){$('profileHelp').textContent='尚未找到可綁定的有效示籙。請先建立角色資料，再回到此頁。';controls({change:true});return;}
  pendingProfile=local;profileHtml(local);$('profileHelp').textContent='此帳號尚無線上示籙。請確認下列角色資料確實屬於你，再綁定；確認前不會上傳。';controls({confirm:true,change:true});
 }catch(err){$('profileHelp').textContent='無法讀取線上示籙，請稍後重試。';message('示籙查詢失敗：'+(err.message||'未知錯誤'),true);}
}
$('confirmBind').addEventListener('click',async()=>{
 if(!currentUser||!validProfile(pendingProfile))return;
 busy(true);message('');
 try{
  const {error}=await db.from('player_profiles').insert({user_id:currentUser.id,...pendingProfile});
  if(error){if(error.code==='23505'){await syncProfile(currentUser);return;}throw error;}
  await syncProfile(currentUser);message('示籙已成功綁定到此線上帳號，即將進入首次入城前導。');
   location.assign(INTRO_URL);
 }catch(err){message('綁定失敗：'+(err.message||'請稍後再試'),true);}finally{busy(false);}
});
$('changeProfile').addEventListener('click',()=>{localStorage.removeItem(PROFILE_KEY);localStorage.removeItem(OWNER_KEY);location.assign('index.html');});
$('enterButton').addEventListener('click',()=>{if(ready)location.assign(CITY_URL);});
$('authForm').addEventListener('submit',async e=>{
 e.preventDefault();message('');const email=$('email').value.trim(),password=$('password').value;
 if(mode==='register'&&password!==$('confirmPassword').value){message('兩次輸入的密碼不一致。',true);return;}
 busy(true);
 try{
  if(mode==='register'){
   const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:new URL('login.html',location.href).href}});if(error)throw error;
   if(data.session){await syncProfile(data.session.user,{navigate:true});return;}
   message('已送出註冊申請。請前往信箱點擊驗證連結，再回來登入。請檢查垃圾郵件。');
  }else{
   const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;
   if(data.session){await syncProfile(data.session.user,{navigate:true});return;}
   message('尚未取得登入狀態，請稍後重試。',true);
  }
 }catch(err){message('核驗未完成：'+(err.message||'請稍後重試'),true);}finally{busy(false);}
});
$('forgotButton').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){message('請先輸入電子郵件，再點擊「忘記密碼」。',true);$('email').focus();return;}busy(true);try{const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:new URL('login.html',location.href).href});if(error)throw error;message('如果此信箱有註冊帳號，系統會寄送密碼重設郵件。');}catch(err){message('無法寄送重設郵件：'+(err.message||'請稍後重試'),true);}finally{busy(false);}});
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();const pass=$('newPassword').value;if(pass!==$('newPasswordAgain').value){message('兩次輸入的密碼不一致。',true);return;}busy(true);try{const {error}=await db.auth.updateUser({password:pass});if(error)throw error;recovery=false;const {data}=await db.auth.getUser();if(data.user)await syncProfile(data.user);else show('authView');message('密碼已更新。');}catch(err){message('更新失敗：'+(err.message||'請稍後重試'),true);}finally{busy(false);}});
$('logoutButton').addEventListener('click',async()=>{busy(true);try{const {error}=await db.auth.signOut();if(error)throw error;currentUser=null;ready=false;pendingProfile=null;show('authView');setMode('login');message('已安全登出線上帳號。');}catch(err){message('登出失敗：'+(err.message||'請稍後重試'),true);}finally{busy(false);}});
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;show('resetView');message('請設定新的密碼。');}else if(event==='SIGNED_OUT'){recovery=false;currentUser=null;ready=false;show('authView');}});
(async()=>{try{const {data,error}=await db.auth.getSession();if(error)throw error;if(recovery)return;if(data.session?.user)await syncProfile(data.session.user);else show('authView');if(new URLSearchParams(location.search).has('error'))message('電子郵件驗證連結無法使用，請重新申請。',true);}catch(err){show('authView');message('連線異常：'+(err.message||'請重新整理'),true);}})();
})();
</script>
</body>
</html>
