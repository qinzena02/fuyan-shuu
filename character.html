<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>負驗書｜人物卷宗</title><style>
:root{color-scheme:dark;--bg:#081617;--panel:#102625;--line:#3a5b50;--gold:#e0c38d;--muted:#93b0a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1b3833 0%,#081617 48%);color:#d9ddd2;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.85}a{color:inherit;text-decoration:none}button,input{font:inherit}header{border-bottom:1px solid #35564c;background:#0c1c1de8;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}.nav{max-width:1160px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:var(--gold);letter-spacing:3px;font-size:20px}.back{color:#9fc5b7;font-size:13px}.back:hover{color:var(--gold)}main{max-width:1160px;margin:auto;padding:48px 22px 100px}.eyebrow{color:#83b5ab;font-size:11px;letter-spacing:5px;text-transform:uppercase}h1{font-size:clamp(32px,5vw,52px);font-weight:400;letter-spacing:7px;color:var(--gold);margin:12px 0 10px}.lead{color:#abc3b8;max-width:750px;margin-bottom:36px}.divider{height:1px;background:linear-gradient(90deg,#b49b6e,#34544b 70%,transparent);margin:25px 0}.state{border:1px solid var(--line);background:#122928;padding:20px;color:#b7cbbf;border-radius:10px}.state.error{color:#f1b6ad;border-color:#8d514c}.hidden{display:none!important}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 28px}.filter{border:1px solid #41645a;background:#102524;color:#b3cbc0;padding:7px 15px;border-radius:50px;cursor:pointer}.filter.active,.filter:hover{color:#f1d8a4;background:#23403a;border-color:#a98d5d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.person{display:block;border:1px solid #3b5b51;background:linear-gradient(150deg,#17312e,#0d2021);border-radius:15px;overflow:hidden;transition:transform .2s,border-color .2s}.person:hover{transform:translateY(-3px);border-color:#c1a371}.portrait{height:240px;background:radial-gradient(circle at 50% 40%,#36554b,#142a29 60%,#0b1c1d);display:flex;justify-content:center;align-items:center;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover}.monogram{font-size:68px;font-family:serif;color:#d5c39b;opacity:.8}.person-info{padding:18px 21px 22px}.kicker{font-size:11px;color:#8eb5a7;letter-spacing:2px}.person-name{font-size:25px;letter-spacing:3px;color:var(--gold);margin:5px 0}.person-desc{font-size:13px;color:#a8c0b4}.open{display:inline-block;color:#d4bd8f;margin-top:14px;font-size:12px}.hero{display:grid;grid-template-columns:minmax(220px,330px) 1fr;gap:32px;align-items:stretch}.hero .portrait{height:430px;border:1px solid #557065;border-radius:13px}.hero-content{padding:10px 0}.hero h1{margin:10px 0}.title{color:#e0c89c;font-size:17px}.bio{color:#b8cfc4;margin-top:25px;white-space:pre-wrap}.section-title{font-size:21px;color:var(--gold);font-weight:400;letter-spacing:3px;margin:36px 0 16px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.fact,.record{border:1px solid #34564c;background:#102525;padding:15px 18px;border-radius:9px}.fact-label{color:#85a99b;font-size:12px}.fact-value{color:#e4d7b9;margin-top:5px;overflow-wrap:anywhere}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.record h3{font-size:15px;font-weight:400;color:#e3ca98;margin:0 0 8px}.record p{color:#a8bdb4;font-size:13px;margin:0;white-space:pre-wrap}.muted{color:#819d91;font-size:12px}.pill{display:inline-block;border:1px solid #607366;border-radius:40px;color:#c4d4c5;padding:3px 12px;font-size:12px}.link{display:inline-block;border:1px solid #8b7956;border-radius:7px;padding:8px 16px;color:#ebd4a4;background:#1b3933;margin-top:14px}.link:hover{background:#25473f}footer{text-align:center;color:#78998c;padding:20px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero .portrait{height:360px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:30px 15px 70px}.nav{padding:13px 15px}.brand{font-size:16px}.grid{grid-template-columns:1fr 1fr;gap:11px}.portrait{height:180px}.person-info{padding:13px}.person-name{font-size:19px}.person-desc{font-size:11px}.records{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.hero .portrait{height:320px}}
</style></head><body><header><div class="nav"><a class="brand" href="characters.html">負驗書 · 人物卷宗</a><a class="back" href="characters.html">← 返回人物誌</a></div></header><main><div class="eyebrow">CHARACTER RECORD · 咸陵人物誌</div><div id="status" class="state">正在調閱人物卷宗……</div><div id="content" class="hidden"><div class="hero"><div id="portrait"></div><div class="hero-content"><div id="faction" class="eyebrow"></div><h1 id="name"></h1><div id="title" class="title"></div><div class="divider"></div><div class="eyebrow">人物小傳 / BIOGRAPHY</div><div id="biography" class="bio"></div><a class="link" href="social.html">前往萬象傳書 ↗</a></div></div><h2 class="section-title">人物基本資料</h2><div id="facts" class="facts"></div><h2 class="section-title">性情與生平</h2><div id="records" class="records"></div><h2 class="section-title">人物羈絆</h2><div class="record"><h3>關係稱謂</h3><p id="bond">羈絆紀錄尚待開放</p><p class="muted">僅顯示關係稱謂，不顯示好感數字。</p></div><h2 class="section-title">軼聞雜談</h2><div class="record"><h3>江湖拾遺</h3><p>人物雜談尚未開放。未解鎖的內容不會提前顯示。</p></div></div></main><footer>負驗書 · 咸陵人物誌</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script>
const db=window.fuyanshuDB;
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;}
function portrait(char){const box=el('div','portrait');if(char.avatar_url&&/^https:\/\//i.test(char.avatar_url)){const img=document.createElement('img');img.src=char.avatar_url;img.alt=char.name+'立繪';img.loading='lazy';img.onerror=()=>{img.remove();box.append(el('span','monogram',(char.name||'人').slice(0,1)))};box.append(img)}else{box.append(el('span','monogram',(char.name||'人').slice(0,1)))}return box;}
function showError(target,msg){target.textContent=msg;target.classList.add('error');target.classList.remove('hidden');}

const status=document.getElementById('status'),content=document.getElementById('content');
function fact(k,v){const x=el('div','fact');x.append(el('div','fact-label',k),el('div','fact-value',v||'尚未登錄'));document.getElementById('facts').append(x)}
function record(k,v){const x=el('div','record');x.append(el('h3','',k),el('p','',v||'尚未公開 · 待劇情解鎖'));document.getElementById('records').append(x)}
async function load(){const key=new URLSearchParams(location.search).get('id');if(!key||!db){showError(status,'缺少人物識別碼，或無法載入雲端連線。');return}const {data,error}=await db.from('characters').select('character_key,name,faction,title,biography,avatar_url').eq('character_key',key).eq('is_public',true).maybeSingle();if(error||!data){showError(status,error?'讀取人物卷宗失敗：'+error.message:'此人物尚未公開，或卷宗不存在。');return}document.title='負驗書｜'+data.name+' · 人物誌';document.getElementById('portrait').append(portrait(data));document.getElementById('faction').textContent=data.faction||'江湖人物';document.getElementById('name').textContent=data.name;document.getElementById('title').textContent=data.title||'人物身分尚待登錄';document.getElementById('biography').textContent=data.biography||'此人經歷尚待記錄。';fact('姓名',data.name);fact('所屬門派／勢力',data.faction);fact('職位／身分',data.title);fact('MBTI',null);fact('慣用武器',null);fact('目前所在地',null);record('外貌描述',null);record('性格特質',null);record('人物生平',data.biography);record('行事風格',null);record('擅長之事',null);record('厭惡之事',null);record('印象標籤',null);status.classList.add('hidden');content.classList.remove('hidden');}load();
</script></body></html>
