<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>負驗書｜人物誌</title>
<style>
:root{color-scheme:dark;--bg:#101716;--ink:#e7e6dc;--gold:#dec797;--muted:#a5b6ac;--line:#34443f}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PMingLiU","Microsoft JhengHei",serif;line-height:1.95}a{color:inherit;text-decoration:none}button{font:inherit}.top{height:62px;background:#0c1818;display:flex;justify-content:space-between;align-items:center;padding:0 max(22px,calc((100vw - 1080px)/2));gap:20px}.top a:first-child{color:var(--gold);letter-spacing:.18em}.top a:last-child{font-size:13px;color:#b0c7ba}.cover{height:clamp(240px,32vw,410px);position:relative;background:#1b302d center/cover no-repeat;isolation:isolate}.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,15,16,.08) 10%,rgba(8,17,17,.08) 52%,#101716 100%)}.cover.no-cover{background-image:linear-gradient(120deg,#25403c,#101716)}.article{max-width:850px;margin:-83px auto 110px;padding:0 26px;position:relative}.portrait{width:132px;height:156px;border-radius:3px;background:#233632;border:3px solid #101716;box-shadow:0 5px 20px #0006;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:60px}.portrait img{width:100%;height:100%;object-fit:cover}.meta{color:#8da99b;letter-spacing:.22em;font-size:11px;margin-top:22px}.name{font-size:clamp(38px,6vw,58px);line-height:1.4;font-weight:400;color:#f0e8d5;margin:7px 0 12px;letter-spacing:.12em}.subtitle{font-size:15px;color:#b4c0b5;letter-spacing:.08em;font-style:italic}.intro{padding:30px 0 38px;border-bottom:1px solid var(--line)}.intro p{color:#c2c7bc;margin:18px 0 0;white-space:pre-wrap}.quote{margin:75px 0 70px;border-left:2px solid var(--gold);padding:0 0 0 22px;color:#e8d4aa;font-style:italic;font-size:19px;letter-spacing:.04em}.chapter{margin:65px 0}.chapter h2{font-size:23px;font-weight:400;color:var(--gold);letter-spacing:.18em;margin:0 0 22px}.chapter h2 small{font-size:10px;letter-spacing:.2em;color:#8ba79a;display:block;margin-bottom:3px;font-family:sans-serif}.data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}.datum{border-bottom:1px solid #283a35;padding:13px 0;display:flex;gap:16px;justify-content:space-between}.datum dt{color:#879f92;font-size:13px;flex-shrink:0}.datum dd{margin:0;text-align:right;color:#deded2;font-size:14px;overflow-wrap:anywhere}.entry{padding:20px 0;border-bottom:1px solid #293b35}.entry h3{font-size:15px;color:#e0c58d;font-weight:400;letter-spacing:.1em;margin:0 0 8px}.entry p{white-space:pre-wrap;color:#b8c6bb;margin:0;font-size:14px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{font-size:12px;border:1px solid #506358;color:#b7c8b9;padding:2px 12px;border-radius:20px}.bond{font-size:20px;color:#e0c58d}.quiet{font-size:13px;color:#819a8b}.more{display:inline-block;border-bottom:1px solid #8b9e90;color:#b8c9b7;font-size:13px;margin-top:15px}.state{max-width:850px;margin:70px auto;padding:20px 26px;color:#c1cdbf}.hidden{display:none!important}footer{border-top:1px solid #283c35;text-align:center;padding:24px;color:#6e887b;font-size:11px;letter-spacing:.15em}@media(max-width:650px){.top{padding:0 17px}.cover{height:270px}.article{margin-top:-62px;padding:0 21px}.portrait{width:106px;height:128px}.meta{margin-top:18px}.quote{margin:52px 0}.chapter{margin:50px 0}.data{grid-template-columns:1fr}.name{font-size:38px}}
</style></head><body>
<nav class="top"><a href="characters.html">負驗書 · 咸陵人物誌</a><a href="characters.html">← 返回人物總覽</a></nav>
<div class="cover no-cover" id="cover" aria-label="人物背景"></div>
<div id="status" class="state">正在調閱人物卷宗……</div>
<main class="article hidden" id="content">
  <div id="portrait" class="portrait"></div>
  <div class="meta" id="faction">CHARACTER RECORD</div>
  <h1 class="name" id="name"></h1>
  <div class="subtitle" id="title"></div>
  <section class="intro"><p id="biography"></p></section>
  <blockquote class="quote" id="quote">江湖路遠，所見未必即是其人。</blockquote>
  <section class="chapter"><h2><small>01 / PERSONAL RECORD</small>人物小檔</h2><dl class="data" id="facts"></dl></section>
  <section class="chapter"><h2><small>02 / CHARACTER</small>其人其事</h2><div id="records"></div></section>
  <section class="chapter"><h2><small>03 / IMPRESSIONS</small>印象標籤</h2><div class="tags" id="tags"><span class="quiet">尚未登錄</span></div></section>
  <section class="chapter"><h2><small>04 / BONDS</small>人物羈絆</h2><div id="bond" class="bond">羈絆紀錄尚待開放</div><p class="quiet">僅顯示關係稱謂，不顯示好感數值。</p></section>
  <section class="chapter"><h2><small>05 / MARGINALIA</small>軼聞雜談</h2><p class="quiet" id="notes">此人軼聞尚未收錄。隨故事推進，卷宗將逐漸補全。</p></section>
  <a class="more" href="social.html">前往萬象傳書 ↗</a>
</main><footer>負驗書 · 咸陵人物誌</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-client.js"></script>
<script>
'use strict';
const db=window.fuyanshuDB;
const imageBase='https://raw.githubusercontent.com/qinzena02/fuyan-shuu/main/images/';
// 個別人物封面：日後可在此繼續設定其他角色，不影響萬象傳書頭像。
const characterCovers={ji_buyun:imageBase+'tobi-44.jpg'};
function text(id,value){document.getElementById(id).textContent=value||''}
function fact(label,value){const wrap=document.createElement('div');wrap.className='datum';const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=value||'尚未登錄';wrap.append(dt,dd);document.getElementById('facts').append(wrap)}
function entry(label,value){const wrap=document.createElement('div');wrap.className='entry';const h=document.createElement('h3');h.textContent=label;const p=document.createElement('p');p.textContent=value||'尚未公開 · 待劇情解鎖';wrap.append(h,p);document.getElementById('records').append(wrap)}
function showPortrait(char){const box=document.getElementById('portrait');const url=char.portrait_url||char.avatar_url;if(url&&/^https:\/\//.test(url)){const img=document.createElement('img');img.src=url;img.alt=char.name+'肖像';img.onerror=()=>{img.remove();box.textContent=(char.name||'人')[0]};box.append(img)}else{box.textContent=(char.name||'人')[0]}}
async function load(){const key=new URLSearchParams(location.search).get('id');const status=document.getElementById('status');if(!key||!db){status.textContent='無法調閱卷宗：缺少人物識別碼或雲端連線。';return}
try{const {data,error}=await db.from('characters').select('character_key,name,faction,title,biography,avatar_url,portrait_url').eq('character_key',key).eq('is_public',true).maybeSingle();if(error)throw error;if(!data){status.textContent='此人物尚未公開，或卷宗不存在。';return}
const cover=characterCovers[data.character_key];if(cover){const img=new Image();img.onload=()=>{document.getElementById('cover').style.backgroundImage=`url("${cover}")`;document.getElementById('cover').classList.remove('no-cover')};img.src=cover}
document.title='負驗書｜'+data.name+' · 人物誌';showPortrait(data);text('faction',(data.faction||'江湖人物')+' / CHARACTER RECORD');text('name',data.name);text('title',data.title||'人物身分尚待登錄');text('biography',data.biography||'此人經歷尚待記錄。');fact('姓名',data.name);fact('門派／勢力',data.faction);fact('職位／身分',data.title);fact('MBTI',null);fact('慣用武器',null);fact('所在地',null);entry('外貌描述',null);entry('性格與行事風格',null);entry('人物生平',data.biography);entry('擅長之事',null);entry('厭惡之事',null);status.classList.add('hidden');document.getElementById('content').classList.remove('hidden');
}catch(err){status.textContent='讀取人物卷宗失敗：'+(err.message||'請稍後重試')}}load();
</script></body></html>
