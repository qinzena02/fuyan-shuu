<section class="hero"><div class="eyebrow">TRAVEL ATLAS · 咸陵地理誌</div><h1>咸陵行旅</h1><p>山河萬里，各有其道。閱城脈，訪門庭，循跡而行。</p><p>地誌已開放閱覽；門派日常與入城探索將於專屬頁面開放。</p></section>
<main><div class="heading"><h2>山川與門派</h2><span>六處公開地誌</span></div><section class="places" id="places" aria-label="地區入口"></section><section class="detail" id="detail" tabindex="-1" aria-live="polite"></section><p class="notice">※ 「進入城中／門派」將於獨立探索頁面完成後啟用，目前不會跳轉至典籍。</p></main><footer>長明府 · 山川有跡 · 行旅未盡</footer>
<script>
'use strict';
const places=[{"id": "city", "name": "咸陵主城", "region": "咸陵 · 長明府中樞", "tag": "城區", "img": null, "quote": "仁以養民，義以立世，禮以定序，智以明天，信以長明。", "sections": [["城中風貌", "咸陵國的中樞位於咸陵主城北，舊宮城與新建的恆天塔相互毗鄰。昔日的宮牆尚未完全褪色，新的高塔已經越過城闕，直入雲端。人們以地脈為源、符機為術，讓沉睡於大地深處的力量化作城市不熄的燈火。新朝與首都因此得名——「長明」。\n\n夜禁時分，街區會依序收束，商鋪自動降下門扉，脈軌按區段減速，夜循司的青銅傀儡沿著固定路線巡行。"]], "landmarks": [], "ruins": false}, {"id": "tianheng", "name": "天衡門", "region": "北方群山", "tag": "創造", "img": "f3125ba0e1d11390ede55c3f04dfd0cc.jpg", "quote": "「創造」是他們理解天地的方式。天地既生萬物，人亦當有所造。", "sections": [["山門與日常", "天衡門是五大派中最接近革新的一派。\n\n它坐落於北方群山之間，整座門派沿山勢向上建造。遠遠望去，山壁之間並沒有尋常門派高聳的宮牆，反而像是一座從山體內部生長出來的巨大機械城。灰黑色的鋼骨嵌入山壁，粗大的蒸汽管道沿著峭壁盤旋，齒輪與符機在山谷之間日夜運轉。數座懸空鐵橋連接不同山峰，橋下時常有載運材料的機械軌車轟鳴而過。\n\n門派內幾乎沒有真正安靜的地方。鐵匠敲擊金屬的聲音、符機運轉的轟鳴、蒸汽釋放的嘶聲，以及弟子爭論器械結構的聲音終日交錯。\n\n天衡門的人相信，天地既然有脈，人便能借脈造物。因此，他們擅長將符術與機械結合，製造兵器、交通工具、能源設備以及大型符機。天衡門也是長明府最重要的技術合作對象之一。"], ["重要地標 · 萬脈樞", "它是一座巨大到近乎城市建築的機械，由無數環形齒輪、符紋軌道與能源管線組成。各地能源井送來的力量先進入萬脈樞，在其中完成轉換與分流，再送往脈軌、能源井、符機塔等設施。"], ["門規", "「人可造器，器不可代人。」", "rule"], ["門規釋義", "天衡門是最懂得造器的人，所以他們才最清楚器與人的界線在哪裡。器可以替人搬山、計算、戰鬥、診病，甚至模擬人的語言與情感；但「創造」這個行為仍然必須由人開始。天衡門並不排斥科技，反而是咸陵最精於符機與機械造作的門派之一；只是越是懂得如何造器，他們便越清楚，一件器物的價值從來不在於它能否成為「人」，而在於它是由人親手賦予了怎樣的形貌與用途。"], ["如何辨認他們？", "天衡門弟子很少有一雙乾淨纖細的手，指腹常有薄繭，虎口或指節偶爾留著燙痕與細小傷口，指甲縫裡容易沾著機油、金屬粉末或符墨，並且通常會佩戴一枚小型衡環，可戴於腕間、指節或工具帶上。衡環既是門派身份象徵，也是他們日常調校符機時使用的小型工具。\n\n他們往往不愛把事情想得太複雜，性子總是直來直往，甚至有時候根本懶得和你講道理。與其站在原地討論許久，不如直接捲起袖子試上一遍。對他們而言，手上的油污、工具碰撞的聲音、齒輪咬合時細微的震動，乃至一座龐大符機終於啟動時自地下傳來的轟鳴，都是創造本身的一部分。"]], "landmarks": ["萬脈樞"], "ruins": false}, {"id": "chixiao", "name": "赤霄山莊", "region": "南境群山", "tag": "人身", "img": "35e194bb9583460b1a85c142932c3aa7.jpg", "quote": "血脈如江河，經絡如山川，呼吸之間亦有天地的起伏。若要理解地脈，便先要理解自身。「人身」便是他們與天地相望的起點。", "sections": [["山莊風貌", "赤霄山莊仍保留著最接近傳統江湖的模樣，山莊坐落於南境群山深處，高山、密林、瀑布與峽谷構成赤霄山莊天然的屏障。\n\n山門由巨大的石柱支撐，石階一路向上，兩側立著歷代弟子留下的兵器。山莊中央是一座巨大的演武場，風吹過山林時，偶爾能聽見遠處傳來刀劍相擊的聲音。地面並非普通石板，而是以特殊金屬與符石鋪成，弟子交手時地面的符紋會記錄力量、速度、角度與地脈震動，最後將數據投映到演武場周圍的石壁上。\n\n赤霄山莊在咸陵所掌的，並非尋常治安。凡與武者、武學、人體及武力有關之事，皆可由赤霄山莊介入。長明府若遇到涉及特殊武學的案件，夜循司若查獲難以辨認的武技傷勢，或城中門派之間發生武力爭端，往往都會請赤霄弟子協助判定。\n\n他們也接受民間與官府的武契。護送、擒拿、護衛、押解、平息門派爭端，乃至處理城外無法由普通人應對的武患，只要立下武契，赤霄山莊便可出手。"], ["門規", "「可敗其武，不可辱其身。」", "rule"], ["門規釋義", "他們尊重勝負，也尊重性命；可以動刀，卻必須知道為何拔刀。可以取人性命，卻不能因一時喜怒便將殺戮視作兒戲。對赤霄而言，人的身體不是一件可以被任意損毀的器物，一個人的傷、一個人的疼和其生死，都是真實存在於天地之間的痕跡。"], ["如何辨認他們？", "赤霄弟子大多性情冷冽，少有迂迴試探。有人寡言沉默，有人直來直往，也有人縱情飲酒、放浪形骸，說話從不留情，做事更不肯向誰低頭。他們敢愛敢恨，敢勝敢敗，若認定一件事值得去做，便很少在意旁人的目光。\n\n赤霄弟子不一定佩劍，但無論用什麼兵器，他們通常都會將自己的武器照料得極好。他們珍惜的並非兵器本身，而是兵器與身體之間長久磨合出來的默契。所以一個真正的赤霄弟子，即使只是站著，手也往往離兵器很近。"], ["武契", "赤霄山莊弟子可以接受民間、商會、鏢局、門派甚至長明府的委託，但所有涉及武力的委託，都必須立下武契。它像是一個法術，但有其奈米機關作為媒介。武契會限制受託者能做到什麼程度，例如「擒拿」就是擒拿，不得擅自改成「處決」；即使對方只是偷竊，也不能因為看他不順眼就殺掉。"], ["鏢局", "赤霄山莊不常下山。\n\n真正替它走遍咸陵各地的，是散落於城鎮、商路與江湖之間的一間間鏢局。這些鏢局名義上各自經營，實際上皆與赤霄山莊有所往來。有人出身山莊，有人只是受過赤霄傳承，也有人一生未曾踏入山門，卻與其中的鏢師有著師徒、親友或舊交。\n\n它們不屬於長明府，也不是單純的民間商號，而是赤霄山莊在山門之外伸向人間的無數雙手。\n\n鏢局承接的事情很雜：替商旅護送貨物，替百姓送信與送人，護送官府文書，押解危險人物，穿行脈軌尚未抵達的荒遠之地；有時也替門派傳話，替受傷的江湖人尋醫。只要有人願意付出代價，而事情又值得有人走一趟，鏢局便可能接下。\n\n一紙鏢契，便是一份承諾。既然收了這趟鏢，便要將人、物或消息送到應去的地方。途中若遇劫匪、山患、武者爭鬥，鏢師自然可以拔刀；但若無必要，他們也不會輕易取人性命。", "image:eacd9ffa93d458ada7448b7d02973539.jpg"]], "landmarks": ["演武場", "鏢局"], "ruins": false}, {"id": "xuanshui", "name": "玄水宮", "region": "西境水網", "tag": "流動", "img": "391322a170c7faab373d6457329411d2.jpg", "quote": "玄水宮所信奉的是「流動」。他們研究地脈與江河、地下水脈之間的關係，認為天地之力從來沒有固定的形狀。水會改道，山會變遷，地脈也同樣如此。順其流動，才能真正理解它。", "sections": [["水上宮城", "玄水宮沒有真正意義上的「山門」。它建立於咸陵西境廣大的水網之中，由河流、湖泊、濕地與地下水脈以科技網共同構成。\n\n從高處望去，玄水宮像是一座漂浮在水面上的城市。白牆黑瓦沿著河道向遠方延伸，木橋將一座座水上樓閣連接起來。船隻穿梭於建築之間，岸邊種滿垂柳與藥草。水下則埋著一條條細長的藍色符紋，隨著地脈與水流緩慢明滅。\n\n玄水宮以醫術與水系之術聞名。水能帶走疾病，也能帶來疾病；能滋養土地，也能在洪水之中摧毀一座城。因此，玄水宮長年負責咸陵各地的疫病、洪災、飲水與水路治理，也與商船、鏢局及地方官府保持密切往來。"], ["門規", "「醫不問貴賤，病不問善惡。」", "rule"], ["門規釋義", "凡入玄水宮求醫者，皆以病者視之，不因身份、門派、罪名而拒診。水流過高山，也流過泥濘，它不會因為一個人高貴就往他身上流，也不會因為一個人骯髒就繞開。\n\n且還有一條：水無定形，萬物皆流。在玄水宮看來，人的身體亦如水脈。血液循環、經絡運行、氣息吐納，都有自己的流向；疾病之所以成為疾病，往往不是因為身體出了某個單一的「錯」，而是原本應當流動的東西，在某處停滯了。"], ["如何辨認他們？", "玄水宮的人很少有真正一致的性格。旁人總說他們陰晴不定，玄水宮的人卻不以為意。因為水本就如此，它可以盛在杯中，可以流過山谷，可以化作霧，也可以凝成冰。容器不同，形狀便不同；溫度不同，性質也不同。若要求水永遠保持同一副模樣，本身便是一件荒謬的事。\n\n並且他們都會在某方面有過異於常人的執著和強迫症，或許是職業的不可逆性，眾多玄水宮弟子對藥材年份、脈象細節、病歷記錄、煎藥順序有近乎病態的要求。你要說他們難搞吧，但他們卻是能救你一命的人啊。也正因為如此，他們的「仁心」才不是一種溫柔的人設，而是一種非常嚴格、甚至近乎偏執的職業倫理。"], ["重要地標 · 洗心池", "洗心池巨大，水面終年有薄霧，四周種滿藥草；池底埋著玄水宮歷代留下的引流符。有人說那些符紋已有數百年，早已與山脈和地脈融在一起。不同區域的水溫與藥性各不相同，有的溫熱如春，有的寒得近乎刺骨，有的浸入片刻便能使筋骨鬆弛，有的則專治內傷與經脈。\n\n弟子會依照病者的脈象調整水流，開關一旁的引水閥，讓藥性沿著不同水道緩慢交匯。有人在池邊煎藥，有人在水裡睡著，有弟子泡到一半突然想起自己還有病歷沒寫，爬起來披著外袍就跑。", "image:8b0bb1c97da43fb81499dd4fbe27502c.jpg"], ["千燈渡", "玄水宮最著名的景觀，是千燈渡。每逢佳節夜晚，宮中弟子會將寫有祈願與醫者姓名的水燈放入河中。千百盞燈火順著水流向下游漂去，從遠處看，就像星河落入水面。"]], "landmarks": ["洗心池", "千燈渡"], "ruins": false}, {"id": "wanxiang", "name": "萬象樓", "region": "東境高山", "tag": "變化", "img": "dd666ea3715205085c099b9a630d20d7.jpg", "quote": "「變化」，本身便是萬物存在的證明。世間沒有永遠不動的形貌，也沒有一成不變的答案；今日所見，或許只是天地漫長變化中的一瞬。", "sections": [["山中觀象", "萬象樓建在咸陵東境最高的山地。\n\n那裡終年雲霧繚繞，從山頂可以俯瞰大片平原，天環江如一條銀色長帶環繞遠方，而主城的燈火則在夜色中連成一片。\n\n整座門派圍繞一座高聳入雲的黑色塔樓建立，塔身沒有窗戶，只有一道道細小的光點在漆黑的牆面上緩慢移動。那些光點並不只是裝飾，它們代表天候、商路、人口流動、戰事、地脈變化，以及萬象樓收集到的各種情報，從山腳向上看，整座塔就像一片被釘在夜空中的星圖。\n\n萬象樓的人觀察天下。因此他們也保留了古老的卜卦之術。只是如今的卜卦已不完全依靠一枚銅錢或一副卦象，碩大的精密星圖與計算程式並列，他們將卦象與實際收集到的情報放在一起。商隊走哪一條路，哪個地方突然缺糧，哪個門派弟子大量下山，哪座城市人口突然增加，甚至哪一場雨落得比往年早了三日。這些在普通人眼裡毫無關聯的事情，在萬象樓的人手中，會被整理、推演，最後形成對未來的判斷。\n\n卦，是觀天地之變；數，是觀眾生之行。二者交疊，才是萬象樓所謂的「萬象」。"], ["門規", "「必不可妄斷言。」", "rule"], ["門規釋義", "萬象樓認為，世間萬物皆在變化。今日所見是真，明日所見也可能是真；一件事情可以有不同的因果，一個人也可以在不同的境遇裡成為截然不同的模樣。因此，他們最忌諱的並不是犯錯，而是在尚未看清之前，便替事情下了最後的定論。"], ["如何辨認他們？", "因門規時刻規範自身的關係，萬象樓弟子說話常被人說優柔寡斷、嬌柔造作。因為他們認為，除非看見了足夠的證據，否則絕對不會相信和說出任何篤定的誓詞。因此萬象樓的人說話往往和其他門派不同，他們很少說一定、必然、絕不。更多時候是：「目前看來如此。」「若換一個角度，也未必如此。」「我不知道。」「所以，我還要再看。」\n\n他們曖昧的肯定常和那些江湖神棍並稱，不過他們倒是不以為意，只是風雲清淡一句：「或許真是如此呢～？」"], ["重要地標 · 觀象塔", "塔壁狹窄而高聳，少有尋常窗戶，取而代之的是一道道細長的觀測孔，從不同高度與角度向外延伸。白日裡，它收進山風、雲影與遠方城廓；入夜之後，塔身內的符光便沿著那些細縫一盞盞亮起，遠看像有人將滿天星辰藏進了黑色的塔壁。\n\n塔身之外那數重巨大的環由金屬與符機構成，懸在不同高度，彼此並不相接，卻會隨著地脈、星象與風向緩慢轉動。每一重環都有自己的方向與速度，有時彼此錯開，有時又在某個時刻短暫重合。沒有人能從地面看懂它們究竟在測量什麼，便連萬象樓的弟子也很少對外解釋。所以觀象塔裡很少有「第一眼便知道答案」的人。萬象樓的人習慣先記下所見，再尋找所未見。", "image:4a6a024d6fe918fc050ef9c1d9b8719a.jpg"]], "landmarks": ["觀象塔"], "ruins": false}, {"id": "taiwei", "name": "太微門舊址", "region": "舊址方位不明", "tag": "相連", "img": "0bd4910f7cfb354c2b5c0dfc732db33b.jpg", "quote": "而太微門始終相信，人與天地從來不是彼此獨立的存在。所謂萬物，不過是彼此「相連」之後，才有了各自的名字。", "sections": [["覆亡之門", "如今的咸陵已經沒有太微門。\n\n曾經的太微門位於五派之外，遠離城市與主要商路。門派覆滅後山門、樓閣與符機皆被遺棄，只剩下大片荒蕪的遺址，那已經是好幾年前的故事了，或許現在連哪裡是門口，舊址位在哪個地方都模糊不清。沒有人再替那些殘破的石階清除雜草，風沙穿過倒塌的門樓，藤蔓爬滿半截宮牆，過去刻滿符紋的石柱也大多埋進泥土。\n\n太微門最擅長的是符術，但太微門的符，並不只是用來攻擊或防禦。符可以記錄、封存、引導，可以與古老的機械交流。他們所研究的，是人與天地之間那條看不見的線，因此，在五派對地脈各自理解不同的今日，太微門留下的東西反而成了最難以解讀的一部分。\n\n沒有人知道他們究竟在地脈深處看見了什麼，也沒有人知道，太微門究竟為什麼會在那一年覆滅。長明府官方留下的記錄只有一句：「太微門毀於地脈事故。」\n\n除此之外，再無更多解釋。"]], "landmarks": ["太微門遺址"], "ruins": true}];
const list=document.getElementById('places'),panel=document.getElementById('detail');
function elem(tag,content,cls){const e=document.createElement(tag);if(content!==undefined)e.textContent=content;if(cls)e.className=cls;return e;}
function pic(filename,cls){const e=elem('img',undefined,cls);e.src='images/'+filename;e.alt='';e.loading='lazy';return e;}
function showPlace(item){panel.replaceChildren();if(item.img)panel.append(pic(item.img,'detail-banner'));const content=elem('div',undefined,'detail-content'),head=elem('div',undefined,'detail-head'),left=elem('div');left.append(elem('div',item.region+' · '+item.tag,'label'),elem('h2',item.name));const close=elem('button','收起 ×','close');close.type='button';close.addEventListener('click',()=>{panel.classList.remove('open');document.getElementById('places').scrollIntoView({behavior:'smooth',block:'start'});});head.append(left,close);content.append(head,elem('blockquote',item.quote,'quote'));
for(const sec of item.sections){const section=elem('section',undefined,'detail-section');section.append(elem('h3',sec[0]));if(sec[2]&&sec[2].startsWith('image:'))section.append(pic(sec[2].slice(6),'subimage'));section.append(elem('p',sec[1],sec[2]==='rule'?'rule':undefined));content.append(section)}
if(item.landmarks.length){const section=elem('section',undefined,'detail-section');section.append(elem('h3','重要地標'));const tags=elem('div',undefined,'landmarks');item.landmarks.forEach(t=>tags.append(elem('span',t)));section.append(tags);content.append(section)}
const links=elem('div',undefined,'links'),enter=elem('button',item.id==='city'?'進入城中 · 尚未開放':'進入門派 · 尚未開放','enter');enter.type='button';enter.disabled=true;links.append(enter);content.append(links,elem('p','專屬探索頁面與門派日常仍在籌備中。','enter-note'));panel.append(content);panel.classList.add('open');panel.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+item.id);}
places.forEach((item,i)=>{const button=elem('button',undefined,'place'+(item.ruins?' ruins':''));button.type='button';if(item.img)button.append(pic(item.img,'place-image'));else button.append(elem('div',undefined,'place-image empty'));const c=elem('div',undefined,'place-content');c.append(elem('span',String(i+1).padStart(2,'0')+' / '+item.region,'num'),elem('strong',item.name),elem('span',item.tag+' · '+(item.landmarks[0]||'咸陵城脈'),'subtitle'),elem('span','閱覽地誌 →','foot'));button.append(c);button.addEventListener('click',()=>showPlace(item));list.append(button)});
let player=null;try{player=JSON.parse(localStorage.getItem('fuyanshu_player')||'null')}catch(e){}if(!player||!player.name)location.replace('index.html');
const requested=decodeURIComponent(location.hash.slice(1));const selected=places.find(x=>x.id===requested);if(selected)showPlace(selected);
document.addEventListener('pointerdown',()=>{if(window.parent!==window)window.parent.postMessage('fuyanshu-interaction',location.origin);},{once:true});
</script></body></html>
