<style>

m{color:#8ab5a6;font-size:11px;letter-spacing:2px}.place strong{color:#e6cf9f;font-size:25px;font-weight:normal;letter-spacing:2px;margin-top:20px}.place .subtitle{color:#9db9ad;font-size:13px;margin:4px 0 14px}.place .foot{color:#d2b985;font-size:12px;margin-top:auto}.place.ruins{border-color:#665b4b;background:linear-gradient(135deg,#292c2a,#111f20)}.place.ruins .num{color:#b2a08b}.notice{color:#8ca79d;font-size:12px;margin:22px 0 0}.detail{margin-top:28px;background:#102325;border:1px solid #4a675b;border-radius:14px;padding:clamp(20px,4vw,40px);display:none;animation:appear .3s ease}.detail.open{display:block}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.detail h2{color:#e6cf9f;font-size:29px;font-weight:normal;letter-spacing:3px;margin:6px 0 4px}.detail .label{color:#90b5a7;font-size:11px;letter-spacing:3px}.detail .desc{max-width:790px;color:#c1d0c6;font-size:14px;white-space:pre-line;margin:20px 0}.detail h3{font-weight:normal;color:#d8c18e;font-size:16px;margin:20px 0 8px}.landmarks{display:flex;flex-wrap:wrap;gap:8px}.landmarks span{border:1px solid #4b685d;border-radius:999px;padding:4px 12px;font-size:12px;color:#a8c6b9}.close{border:1px solid #526d60;background:#183330;color:#dfc998;border-radius:8px;padding:7px 13px}.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.links a{border:1px solid #947e56;border-radius:7px;padding:8px 15px;color:#e3cd9f;font-size:13px}.links a:hover{background:#223c35}footer{text-align:center;border-top:1px solid #29443b;padding:25px;color:#7b9b90;font-size:12px}@media(max-width:820px){.places{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.places{grid-template-columns:1fr}.place{min-height:175px}.hero{padding:52px 18px}.hero h1{letter-spacing:5px}.heading{align-items:start;flex-direction:column;gap:4px}.detail h2{font-size:24px}}@media(prefers-reduced-motion:r <script>if(window.self===window.top){window.location.replace('world.html?page=travel.html');}</script>
<header><div class="brand">負驗書 · 咸陵行旅</div><a class="back" href="city.html">← 返回咸陵主城</a></header>
<section class="hero"><div class="eyebrow">TRAVEL ATLAS · 咸陵地理誌</div><h1>咸陵行旅</h1><p>山河萬里，各有其道。閱城脈，訪門庭，循跡而行。</p><p>此處記錄公開的地區風貌與門派所在；尚未開放實際移動探索。</p></section>
<main><div class="heading"><h2>山川與門派</h2><span>地區索引 · 六處公開地誌</span></div><section class="places" id="places" aria-label="地區入口"></section><section class="detail" id="detail" tabindex="-1" aria-live="polite"></section><p class="notice">※ 地誌僅收錄目前已確立的世界觀。尚未設定的方位、城鎮與路線，不以臆測補足。</p></main><footer>長明府 · 山川有跡 · 行旅未盡</footer>
<script>
'use strict';
const places=[
{id:'city',name:'咸陵主城',type:'城區地誌',subtitle:'舊宮城與新塔交映，地脈不息',body:'咸陵主城是長明府中樞所在。舊宮城與新建的恆天塔毗鄰，鋼鐵高樓沿古老城脈拔地而起，脈軌穿梭城區，霓虹懸於飛簷與牌樓之間。\n\n天環江流經城市，符機與地脈能源支撐城中運作。此地既是行旅起點，也是長明府制度最為鮮明之處。',landmarks:['舊宮城','恆天塔','天環江','脈軌']},
{id:'chixiao',name:'赤霄山莊',type:'五大門派 · 現存',subtitle:'劍鋒隨心而向，行事不拘俗規',body:'赤霄山莊以劍道與鏢行聞名。弟子大多性情冷冽，少有迂迴試探；有人寡言，有人直來直往，也有人縱情飲酒、放浪形骸。\n\n赤霄之道重視本心與抉擇。真正修行深厚之人未必輕易動武，反而可能對世事有更廣闊、穩定的理解。山莊的具體地理方位與建築布局尚待補錄。',landmarks:['赤霄山莊','鏢行據點']},
{id:'tianheng',name:'天衡門',type:'五大門派 · 現存',subtitle:'以創造為道，器術與機巧並行',body:'天衡門以創造與器術見長，重視人與器物的關係。門中重要地標為天樞塔。\n\n其所在地域的地形、聚落與通行路線尚未公開，後續可在此補入正式地誌。',landmarks:['天樞塔']},
{id:'xuanshui',name:'玄水宮',type:'五大門派 · 現存',subtitle:'仁愛之道，水流無定',body:'玄水宮重視仁愛，門中有洗心池一處。其修行理念與水、流動及人心有關。\n\n關於宮址周邊地貌、民俗與洗心池的詳細記錄，目前尚待補充。',landmarks:['洗心池']},
{id:'wanxiang',name:'萬象樓',type:'五大門派 · 現存',subtitle:'觀象知變，萬物自有流轉',body:'萬象樓以觀象、推演見長，重視對世事變化的理解。觀象塔是其重要地標。\n\n門中之道重在觀察與審慎判斷；具體地域景觀與樓中布局尚待正式記錄。',landmarks:['觀象塔']},
{id:'taiwei',name:'太微門舊址',type:'五大門派 · 已覆亡',subtitle:'符學舊宗，往事埋於灰燼',body:'太微門已然覆亡，昔日符學傳承散佚。其舊事與地脈異變的關聯仍有未明之處。\n\n目前僅公開太微門已覆亡的記錄；舊址確切位置與相關內情，待日後劇情與世界觀補完。',landmarks:['太微門舊址（位置未公開）']}
];
const list=document.getElementById('places'),panel=document.getElementById('detail');
function elem(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function showPlace(item){panel.replaceChildren();const head=elem('div',undefined,'detail-head');const left=elem('div');left.append(elem('div',item.type,'label'),elem('h2',item.name));const close=elem('button','收起 ×','close');close.type='button';close.addEventListener('click',()=>{panel.classList.remove('open');document.getElementById('places').scrollIntoView({behavior:'smooth',block:'start'});});head.append(left,close);panel.append(head,elem('p',item.body,'desc'),elem('h3','重要地標'));const tags=elem('div',undefined,'landmarks');item.landmarks.forEach(t=>tags.append(elem('span',t)));panel.append(tags);const links=elem('div',undefined,'links');const archive=elem('a','查閱相關典籍 →');archive.href='archive.html';links.append(archive);panel.append(links);panel.classList.add('open');panel.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+item.id);}
places.forEach((item,i)=>{const button=elem('button',undefined,'place'+(item.id==='taiwei'?' ruins':''));button.type='button';button.append(elem('span',String(i+1).padStart(2,'0')+' / '+item.type,'num'),elem('strong',item.name),elem('span',item.subtitle,'subtitle'),elem('span','閱覽地誌 →','foot'));button.addEventListener('click',()=>showPlace(item));list.append(button);});
let player=null;try{player=JSON.parse(localStorage.getItem('fuyanshu_player')||'null')}catch(e){}if(!player||!player.name)location.replace('index.html');
const requested=decodeURIComponent(location.hash.slice(1));const selected=places.find(x=>x.id===requested);if(selected)showPlace(selected);
document.addEventListener('pointerdown',()=>{if(window.parent!==window)window.parent.postMessage('fuyanshu-interaction',location.origin);},{once:true});
</script></body></html>
