<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>負驗書｜示籙個人中心</title><style>*{box-sizing:border-box}body{margin:0;background:#091113;color:#ded6c5;font-family:'Microsoft JhengHei',serif;line-height:1.9}a{color:#b8d5c8;text-decoration:none}header{border-bottom:1px solid #37564e;background:#0c191b;padding:20px max(20px,calc((100vw - 900px)/2));display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{color:#dfc899;font-size:21px;letter-spacing:5px}main{max-width:900px;margin:60px auto 90px;padding:0 20px}h1{font-size:30px;color:#e4ce9e;font-weight:normal;letter-spacing:4px}p{color:#9eb9ad}.identity{background:linear-gradient(130deg,#102b29,#0c1e1f);border:1px solid #5c776b;padding:30px;margin-top:25px}.identity-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#d8c39b;font-size:17px}.status{color:#90c7b6;font-size:13px}.identity-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 24px;margin-top:30px}.identity-grid>div{display:flex;flex-direction:column;gap:10px}.identity-grid small{color:#91b2a7;font-size:15px}.identity-grid strong{font-size:25px;font-weight:normal;color:#eee0c9}.note{font-size:13px;color:#8aa99f;margin-top:20px}@media(max-width:550px){.identity-grid{gap:22px}.identity{padding:22px}.identity-grid strong{font-size:20px}}
/* 個人示籙中的萬象傳書主頁 */
.profile-social{margin-top:42px}.profile-social-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.profile-social h2{font-weight:normal;color:#e4ce9e;font-size:23px;letter-spacing:3px}.profile-social .go-write{display:inline-block;padding:7px 13px;border:1px solid #927d53;border-radius:6px;color:#ebd39f;font-size:13px}.profile-social .social-list{display:grid;gap:14px;margin-top:18px}.profile-social .social-card{background:#102223;border:1px solid #3b5d52;border-radius:12px;padding:19px 22px}.profile-social .social-date{font-size:11px;color:#8eada2}.profile-social .social-body{white-space:pre-wrap;overflow-wrap:anywhere;color:#e3ddce;font-size:14px;margin:10px 0}.profile-social .social-images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.profile-social .social-images img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}.profile-social .social-link{font-size:12px;color:#d5bd89}.profile-social .social-empty{padding:22px;background:#102223;border:1px solid #3b5d52;color:#9fb8ac;border-radius:10px;font-size:14px}.profile-social .social-error{color:#edaaa5}.profile-social .social-count{font-size:12px;color:#91b2a7}@media(max-width:550px){.profile-social .social-card{padding:15px}.profile-social .social-images{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">負驗書 · 示籙</div><nav><a href="city.html">← 返回咸陵主城</a></nav></header><main><p>長明府 · 天監院 · 通行核驗</p><h1>個人通行憑證</h1><p>凡入咸陵者，皆留其名。示籙所載，為長明府認可之身分。</p><h2>示籙 · 個人通行憑證</h2>
<div class="identity"><div class="identity-top"><span>長明府 · 示籙登記</span><span class="status">● 核驗通過</span></div><div class="identity-grid"><div><small>姓名</small><strong id="name">—</strong></div><div><small>所屬門派</small><strong id="sect">—</strong></div><div><small>籍貫</small><strong id="origin">—</strong></div><div><small>仁德值</small><strong id="virtueCard">讀取中…</strong></div></div></div>
<p class="note" id="cloudNote">正在核對雲端示籙……</p><section class="profile-social" aria-labelledby="myLettersHeading"><div class="profile-social-head"><div><h2 id="myLettersHeading">我的萬象傳書</h2><p class="social-count" id="myPostCount">正在查閱個人書札……</p></div><a class="go-write" href="social.html">＋ 撰寫新書札 ↗</a></div><div id="mySocialPosts" class="social-list" aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script>
(function(){
 const set=(id,value)=>{document.getElementById(id).textContent=String(value??'—')};
 let player=null;try{player=JSON.parse(localStorage.getItem('fuyanshu_player')||'null')}catch(e){}
 if(player){set('name',player.name||'—');set('sect',player.sect||'—');set('origin',player.origin||'—')}

 async function loadMyPosts(db,user){
  const root=document.getElementById('mySocialPosts'),count=document.getElementById('myPostCount');
  root.replaceChildren();
  try{
   const {data,error}=await db.from('social_posts').select('id,body,image_paths,created_at,published_at,status,visibility').eq('author_user_id',user.id).eq('status','published').eq('visibility','public').order('created_at',{ascending:false}).limit(100);
   if(error)throw error;
   const posts=data||[];count.textContent='已公開 '+posts.length+' 篇書札'+(posts.length===100?'（僅顯示最近 100 篇）':'');
   if(!posts.length){const empty=document.createElement('div');empty.className='social-empty';empty.textContent='你還沒有發布公開書札。可以前往萬象傳書留下第一篇。';root.appendChild(empty);return;}
   for(const p of posts){
    const card=document.createElement('article');card.className='social-card';
    const date=document.createElement('div');date.className='social-date';date.textContent=new Date(p.published_at||p.created_at).toLocaleString('zh-TW');
    const body=document.createElement('div');body.className='social-body';body.textContent=p.body||'';
    card.append(date,body);
    if(Array.isArray(p.image_paths)&&p.image_paths.length){const images=document.createElement('div');images.className='social-images';for(const path of p.image_paths){if(!path.startsWith('players/'+user.id+'/'))continue;const url=db.storage.from('social-images').getPublicUrl(path).data?.publicUrl;if(!url)continue;const img=document.createElement('img');img.src=url;img.alt='書札附圖';img.loading='lazy';images.appendChild(img);}card.appendChild(images);}
    const link=document.createElement('a');link.className='social-link';link.href='social.html?post='+encodeURIComponent(p.id);link.textContent='查看書札與留言 ↗';card.appendChild(link);root.appendChild(card);
   }
  }catch(e){count.textContent='無法載入書札';const err=document.createElement('p');err.className='social-error';err.textContent='讀取個人書札失敗：'+(e?.message||String(e));root.appendChild(err);}
 }
 async function load(){try{
 const db=window.fuyanshuDB;
 if(!db)throw Error('雲端連線尚未載入');
 const {data:{user},error}=await db.auth.getUser();if(error)throw error;
 if(!user){document.getElementById('myPostCount').textContent='請先登入';document.getElementById('mySocialPosts').textContent='登入後即可查看自己的公開書札。';set('virtueCard','請登入');document.getElementById('cloudNote').textContent='尚未登入線上帳號；請先完成線上登入。';return;}
 const {data,error:err}=await db.from('player_profiles').select('character_name,sect,origin,virtue_points').eq('user_id',user.id).maybeSingle();if(err)throw err;
 if(!data){set('virtueCard','待建立');document.getElementById('cloudNote').textContent='此帳號尚未建立雲端示籙。';await loadMyPosts(db,user);return;}
 set('name',data.character_name);set('sect',data.sect);set('origin',data.origin);set('virtueCard',data.virtue_points);
 document.querySelector('.identity-top .status').textContent='● 雲端核驗通過';
 document.getElementById('cloudNote').textContent='示籙資料與仁德值均以目前登入帳號的雲端紀錄為準。';await loadMyPosts(db,user);
 }catch(e){set('virtueCard','讀取失敗');document.getElementById('cloudNote').textContent='無法讀取雲端示籙，請檢查登入及連線。';console.warn(e)}}
 load();
})();
</script></body></html>
