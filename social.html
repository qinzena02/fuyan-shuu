<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>負驗書｜萬象傳書</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#091315;color:#ddd7c8;font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;line-height:1.85}a{color:#bdd6cd;text-decoration:none}a:hover{text-decoration:underline}header{border-bottom:1px solid #36584f;background:#0d1d1e;padding:18px max(20px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{color:#e1c992;font-size:23px;letter-spacing:4px}.small{color:#8eaca1;font-size:13px}main{max-width:1000px;margin:0 auto;padding:34px 20px 90px}.eyebrow{font-size:12px;letter-spacing:5px;color:#9cb7a9}h1{font-size:35px;letter-spacing:5px;font-weight:400;color:#e7cd97;margin:4px 0 8px}.intro{max-width:700px;color:#a9bcb1;margin:0 0 25px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}.panel,.post{border:1px solid #34574d;background:#102223;border-radius:8px}.panel{padding:20px}.panel h2{font-size:16px;font-weight:400;letter-spacing:2px;color:#e6cfa0;margin:0 0 15px}.filters{display:grid;gap:8px}.filter{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#b8c8bb;padding:9px 12px;border-radius:5px;font:inherit;cursor:pointer}.filter:hover,.filter.active{border-color:#648176;background:#1d3835;color:#f2dba9}.feed-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}.feed-head h2{font-size:18px;font-weight:400;color:#d9c79f;margin:0}.refresh{border:1px solid #8b7a55;background:#1b3834;color:#edd9ad;border-radius:5px;padding:8px 14px;cursor:pointer;font:inherit}.refresh:disabled{opacity:.5;cursor:wait}.post{padding:24px;margin:0 0 16px}.post-top{display:flex;align-items:center;gap:13px}.avatar{width:47px;height:47px;border-radius:50%;border:1px solid #8a825f;background:#223d38;color:#ead4a2;display:grid;place-items:center;font-size:21px;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:17px;color:#ebd5a8}.official{display:inline-block;font-size:10px;line-height:1.6;color:#d9c595;border:1px solid #84734f;padding:1px 6px;border-radius:4px;margin-left:7px;vertical-align:middle}.meta{font-size:12px;color:#8ea99f}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:18px 0 10px;font-size:15px;line-height:2.05;color:#e2ded1}.post-foot{border-top:1px solid #28473f;padding-top:12px;color:#86a79c;font-size:12px;display:flex;justify-content:space-between;gap:10px}.state{border:1px solid #385e54;background:#142b2a;border-radius:6px;padding:16px 20px;color:#afc4b7;margin-bottom:16px}.state.error{border-color:#9a5555;color:#f0b9b9}.hidden{display:none!important}.note{color:#8ba69c;font-size:12px;margin-top:18px}footer{text-align:center;color:#66897d;font-size:12px;padding:25px}@media(max-width:700px){.layout{grid-template-columns:1fr}.panel{padding:13px}.filters{display:flex;flex-wrap:wrap}.filter{width:auto}h1{font-size:28px}.post{padding:18px}}
/* 萬象傳書・書札互動 */
.post-actions{display:flex;align-items:center;gap:12px;margin:12px 0 0;flex-wrap:wrap}
.like-button{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 10px;border:1px solid #4b7063;border-radius:999px;background:#142d2c;color:#b8d0c5;font:inherit;font-size:13px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.like-button:hover,.like-button:focus-visible{border-color:#d6b77e;color:#f0d9a6;background:#1e3c37}
.like-button.liked{border-color:#bb8b82;color:#f0b8ad;background:#3a2728}
.like-button:disabled{opacity:.65;cursor:wait}
.like-icon{font-size:18px;line-height:1}
.like-error{color:#f0b9b9;font-size:12px}
.like-hint{color:#86a79c;font-size:12px}

/* 書札互動：無外框愛心，與分隔線保留距離 */
.post-actions{margin:18px 0 19px;gap:16px;min-height:28px}
.like-button,.like-button:hover,.like-button:focus-visible,.like-button.liked{border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;padding:0 3px!important;min-height:28px;color:#a9c8bb}
.like-button.liked{color:#efb3ac!important}.like-button:focus-visible{outline:2px solid #d6b77e;outline-offset:3px}
.like-icon{font-size:22px}.like-button span:last-child{font-variant-numeric:tabular-nums}
.comment-section{border-top:1px solid #29463f;padding-top:14px;margin-top:2px}
.comment-heading{font-size:13px;color:#d7c397;margin:0 0 10px}
.comment-list{display:grid;gap:10px;margin-bottom:12px}
.comment-item{padding:10px 12px;background:#122a29;border-left:2px solid #4c6b60;border-radius:2px 6px 6px 2px}
.comment-item.reply{margin-left:24px;border-left-color:#ad9566}
.comment-author{font-size:12px;color:#e4cc9b}.comment-author.player{color:#a7d0c2}
.comment-meta{color:#78998e;font-size:11px;margin-left:9px}.comment-body{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:#d9dcd0}
.comment-form{display:flex;gap:8px;align-items:flex-start}.comment-input{flex:1;min-width:0;min-height:42px;max-height:130px;resize:vertical;background:#0a1c1d;border:1px solid #436359;color:#e5e0d4;border-radius:5px;padding:8px 10px;font:inherit;font-size:13px}
.comment-send{border:1px solid #897750;background:#1b3934;color:#e8d2a2;border-radius:5px;padding:8px 13px;font:inherit;font-size:12px;cursor:pointer}
.comment-send:disabled{opacity:.55;cursor:wait}.comment-status{font-size:12px;color:#dca7a1;margin:5px 0}.comment-empty{font-size:12px;color:#829e92}

/* v2：側邊欄與圓潤對話氣泡 */
main{max-width:1240px;padding:32px 24px 85px}
.layout{grid-template-columns:245px minmax(0,1fr);gap:28px;align-items:start}
.social-sidebar{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;border-radius:0;border-top:0;border-bottom:0;border-left:0;background:linear-gradient(180deg,#102322,#0b1a1b);padding:25px 18px 30px 0;box-shadow:none}
.social-sidebar h2{font-size:18px;letter-spacing:3px;padding-left:12px}
.social-sidebar .filters{display:flex;flex-direction:column;gap:7px}
.social-sidebar .filter{display:flex;align-items:center;gap:12px;border-radius:9px;min-height:48px}
.social-sidebar .filter.active{border-left:3px solid #d3b67e;background:#1b3431}
.sidebar-portrait{width:32px;height:32px;display:grid;place-items:center;flex-shrink:0;border:1px solid #8b805d;border-radius:50%;overflow:hidden;color:#dfc899}
.sidebar-portrait img{width:100%;height:100%;object-fit:cover}
.post{border-radius:17px;padding:26px 28px}
.post-foot{display:none}
.comment-list{gap:13px}
.comment-item{position:relative;border:1px solid #36554c;border-radius:23px;background:#152e2c;padding:13px 17px 30px;min-height:85px;margin-right:25px}
.comment-item.reply{margin-left:34px;margin-right:0;border:1px solid #736747;border-radius:23px;background:#252f2a}
.comment-item::before{content:'';position:absolute;left:-7px;top:21px;width:12px;height:12px;transform:rotate(45deg);background:#152e2c;border-left:1px solid #36554c;border-bottom:1px solid #36554c}
.comment-item.reply::before{background:#252f2a;border-color:#736747}
.comment-author{display:block;font-size:13px;margin-bottom:3px;color:#e5cd9b}
.comment-body{font-size:14px;line-height:1.9;padding-bottom:1px}
.comment-meta{position:absolute;right:16px;bottom:8px;margin:0;font-size:10px;color:#829e94;opacity:.78;line-height:1.4}
.comment-section{margin-top:18px;padding-top:20px}
.comment-form{margin-top:16px}.comment-input{border-radius:18px;padding:12px 16px}.comment-send{border-radius:14px;padding:10px 17px}
@media(max-width:760px){main{padding:24px 15px 60px}.layout{grid-template-columns:1fr;gap:18px}.social-sidebar{position:static;max-height:none;border:1px solid #34574d;border-radius:14px;padding:15px}.social-sidebar .filters{flex-direction:row;overflow-x:auto;gap:7px;padding-bottom:4px}.social-sidebar .filter{width:auto;white-space:nowrap;flex:none}.social-sidebar .note{display:none}.post{padding:18px 15px}.comment-item{margin-right:8px}.comment-item.reply{margin-left:21px}}
</style>
</head>
<body>
<header><div class="brand">負驗書 <span class="small">／ 萬象傳書</span></div><nav><a href="city.html">返回咸陵主城 ↗</a></nav></header>
<main>
<div class="eyebrow">WAN XIANG · LETTERS</div><h1>萬象傳書</h1>
<p class="intro">咸陵城中，千人萬語循脈而行。有人記錄風聲，有人留下隻字片語；你所讀見的，或許正是某段故事的開端。</p>
<div class="layout">
<aside class="panel social-sidebar"><h2>傳書分類</h2><div class="filters" id="filters"><button class="filter active" data-character="all">所有書札</button></div><p class="note">循人物之名，尋江湖書札。</p></aside>
<section aria-label="公開書札動態牆"><div class="feed-head"><h2 id="feedTitle">城中書札</h2></div><div id="state" class="state" role="status" aria-live="polite">正在接通萬象傳書……</div><div id="feed"></div><p class="note">此處只顯示已正式發布、允許公開的書札。草稿與尚未解鎖的劇情內容不會顯示。</p></section>
</div>
</main><footer>長明府 · 萬象傳書</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(()=>{'use strict';
const db=window.fuyanshuDB;
const $=id=>document.getElementById(id);
let accounts=[],posts=[],selected='all',loading=false,currentUser=null;
let likeCounts=new Map(),myLikes=new Set(),likeBusy=new Set();
let commentsByPost=new Map(),commentLoadError="",playerName="行旅者";
function showState(message,error=false){const e=$('state');e.textContent=message;e.className='state'+(error?' error':'');e.classList.remove('hidden');}
function hideState(){$('state').classList.add('hidden');}
function timeText(value){if(!value)return '時間未記錄';const d=new Date(value);return Number.isNaN(d.getTime())?'時間未記錄':d.toLocaleString('zh-TW',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function renderFilters(){const root=$('filters');root.replaceChildren();const options=[{id:'all',label:'所有書札'},...accounts.map(a=>({id:a.character_id,label:a.characters.name}))];for(const opt of options){const b=document.createElement('button');b.type='button';b.className='filter'+(selected===opt.id?' active':'');if(opt.id!=='all'){const acc=accounts.find(x=>x.character_id===opt.id);const portrait=document.createElement('span');portrait.className='sidebar-portrait';if(acc?.characters?.avatar_url&&/^https:\/\//i.test(acc.characters.avatar_url)){const img=document.createElement('img');img.src=acc.characters.avatar_url;img.alt='';img.loading='lazy';portrait.appendChild(img);}else portrait.textContent=opt.label.slice(0,1);b.appendChild(portrait);}const label=document.createElement('span');label.textContent=opt.label;b.appendChild(label);b.addEventListener('click',()=>{selected=opt.id;renderFilters();renderPosts();});root.appendChild(b);}}
function renderPosts(){
 const root=$('feed');root.replaceChildren();
 const list=posts.filter(p=>selected==='all'||p.author_character_id===selected);
 $('feedTitle').textContent=selected==='all'?'城中書札':(accounts.find(a=>a.character_id===selected)?.characters?.name||'角色')+'的書札';
 if(!list.length){showState(selected==='all'?'目前還沒有公開書札。請先從管理臺發布第一篇。':'這位角色尚未發布公開書札。');return;}
 hideState();
 for(const p of list){
  const account=accounts.find(a=>a.character_id===p.author_character_id);if(!account)continue;
  const character=account.characters,article=document.createElement('article');article.className='post';
  const top=document.createElement('div');top.className='post-top';
  const avatar=document.createElement('div');avatar.className='avatar';
  if(character.avatar_url&&/^https:\/\//i.test(character.avatar_url)){
   const img=document.createElement('img');img.src=character.avatar_url;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{avatar.replaceChildren();avatar.textContent=character.name.slice(0,1)};avatar.appendChild(img);
  }else avatar.textContent=character.name.slice(0,1);
  const identity=document.createElement('div'),name=document.createElement('div');name.className='name';name.textContent=character.name;
  
  const meta=document.createElement('div');meta.className='meta';meta.textContent='@'+account.handle+' · '+(character.faction||'咸陵')+' · '+timeText(p.published_at||p.created_at);
  identity.append(name,meta);top.append(avatar,identity);
  const body=document.createElement('div');body.className='body';body.textContent=p.body;
  const actions=document.createElement('div');actions.className='post-actions';
  const like=document.createElement('button');like.type='button';like.className='like-button'+(myLikes.has(p.id)?' liked':'');
  like.setAttribute('aria-pressed',String(myLikes.has(p.id)));
  like.setAttribute('aria-label',(myLikes.has(p.id)?'取消按讚':'按讚')+'，目前 '+(likeCounts.get(p.id)||0)+' 個讚');
  const heart=document.createElement('span');heart.className='like-icon';heart.textContent=myLikes.has(p.id)?'♥':'♡';heart.setAttribute('aria-hidden','true');
  const count=document.createElement('span');count.textContent=String(likeCounts.get(p.id)||0);
  like.append(heart,count);like.disabled=likeBusy.has(p.id);
  like.addEventListener('click',()=>toggleLike(p.id,like));actions.appendChild(like);

  const error=document.createElement('span');error.className='like-error';error.setAttribute('role','status');error.id='like-error-'+p.id;actions.appendChild(error);
  
  article.append(top,body,actions);
  article.appendChild(buildComments(p));root.appendChild(article);
 }
}

function buildComments(post){
 const section=document.createElement('section');section.className='comment-section';section.setAttribute('aria-label','書札留言');
 const rows=commentsByPost.get(post.id)||[];
 const heading=document.createElement('div');heading.className='comment-heading';heading.textContent='留言 · '+rows.length;section.appendChild(heading);
 const list=document.createElement('div');list.className='comment-list';
 if(commentLoadError){const warn=document.createElement('p');warn.className='comment-status';warn.textContent='留言暫無法讀取：'+commentLoadError;list.appendChild(warn);}
 else if(!rows.length){const empty=document.createElement('span');empty.className='comment-empty';empty.textContent='尚無留言，留下第一句話。';list.appendChild(empty);}
 const makeItem=(item,isReply=false)=>{
  const card=document.createElement('div');card.className='comment-item'+(isReply?' reply':'');
  const who=document.createElement('span');who.className='comment-author'+(item.author_user_id?' player':'');
  const c=accounts.find(x=>x.character_id===item.author_character_id);
  who.textContent=item.author_character_id?(c?.characters?.name||'角色'):(item.player_profiles?.character_name||'行旅者');
  const when=document.createElement('time');when.className='comment-meta';when.textContent=timeText(item.created_at);when.dateTime=item.created_at;
  const body=document.createElement('div');body.className='comment-body';body.textContent=item.body;
  card.append(who,body,when);return card;
 };
 const top=rows.filter(c=>!c.parent_id||!rows.some(r=>r.id===c.parent_id));
 for(const c of top){list.appendChild(makeItem(c));for(const reply of rows.filter(r=>r.parent_id===c.id))list.appendChild(makeItem(reply,true));}
 section.appendChild(list);
 const form=document.createElement('form');form.className='comment-form';
 const input=document.createElement('textarea');input.className='comment-input';input.maxLength=1000;input.rows=2;input.placeholder=currentUser?'留下你的話（最多 1000 字）':'請先登入示籙後留言';input.disabled=!currentUser;input.setAttribute('aria-label','輸入留言');
 const send=document.createElement('button');send.type='submit';send.className='comment-send';send.textContent='送出';send.disabled=!currentUser;
 const status=document.createElement('div');status.className='comment-status';status.setAttribute('role','status');
 form.append(input,send);form.addEventListener('submit',async event=>{
  event.preventDefault();const text=input.value.trim();if(!text||!currentUser)return;
  send.disabled=true;status.textContent='';
  try{const r=await db.from('social_comments').insert({post_id:post.id,author_user_id:currentUser.id,body:text});if(r.error)throw r.error;
   input.value='';await fetchComments();renderPosts();}
  catch(e){status.textContent='留言失敗：'+(e?.message||String(e));send.disabled=false;}
 });section.append(form,status);return section;
}
async function fetchComments(){
 commentsByPost=new Map();commentLoadError='';if(!posts.length)return;
 const ids=posts.map(p=>p.id);
 try{
  const result=await db.from('social_comments').select('id,post_id,parent_id,author_user_id,author_character_id,body,created_at').in('post_id',ids).order('created_at',{ascending:true}).limit(1000);
  if(result.error)throw result.error;
  const rows=result.data||[];
  const userIds=[...new Set(rows.map(r=>r.author_user_id).filter(Boolean))];let names=new Map();
  if(userIds.length){const profile=await db.from('player_profiles').select('user_id,character_name').in('user_id',userIds);if(!profile.error)names=new Map((profile.data||[]).map(p=>[p.user_id,p.character_name]));}
  for(const r of rows){if(r.author_user_id)r.player_profiles={character_name:names.get(r.author_user_id)||'行旅者'};if(!commentsByPost.has(r.post_id))commentsByPost.set(r.post_id,[]);commentsByPost.get(r.post_id).push(r);}
 }catch(e){commentLoadError=e?.message||String(e);}
}

async function fetchLikes(){
 likeCounts=new Map();myLikes=new Set();
 if(!currentUser||!posts.length)return;
 const ids=posts.map(p=>p.id);
 // 依序分頁讀取，避免超過 Supabase 單次預設 1000 筆的上限。
 for(let offset=0;;offset+=1000){
  const r=await db.from('social_post_likes').select('post_id,user_id').in('post_id',ids).order('post_id',{ascending:true}).order('user_id',{ascending:true}).range(offset,offset+999);
  if(r.error)throw r.error;
  const rows=r.data||[];
  for(const item of rows){likeCounts.set(item.post_id,(likeCounts.get(item.post_id)||0)+1);if(item.user_id===currentUser.id)myLikes.add(item.post_id);}
  if(rows.length<1000)break;
 }
}
async function toggleLike(postId,button){
 if(!currentUser){const error=$('like-error-'+postId);if(error)error.textContent='請先從示籙登入帳號，再回來按讚。';return;}
 if(likeBusy.has(postId))return;
 likeBusy.add(postId);button.disabled=true;
 const error=$('like-error-'+postId);if(error)error.textContent='';
 try{
  const liked=myLikes.has(postId);
  const q=liked
   ?db.from('social_post_likes').delete().eq('post_id',postId).eq('user_id',currentUser.id)
   :db.from('social_post_likes').insert({post_id:postId,user_id:currentUser.id});
  const result=await q;if(result.error)throw result.error;
  if(liked){myLikes.delete(postId);likeCounts.set(postId,Math.max(0,(likeCounts.get(postId)||0)-1));}
  else{myLikes.add(postId);likeCounts.set(postId,(likeCounts.get(postId)||0)+1);}
  renderPosts();
 }catch(e){if(error)error.textContent='操作失敗：'+(e?.message||String(e));console.error('萬象傳書按讚失敗',e);}
 finally{likeBusy.delete(postId);button.disabled=false;}
}
async function load(){
 if(loading)return;loading=true;showState('正在讀取城中書札……');
 try{
  if(!db)throw new Error('找不到 Supabase 客戶端，請確認 supabase-client.js 已上傳至相同資料夾。');
  const auth=await db.auth.getUser();if(auth.error)throw auth.error;currentUser=auth.data?.user||null;
  const profile=await db.from('character_social_profiles').select('character_id,handle,characters(name,faction,avatar_url,is_public)').eq('is_active',true);
  if(profile.error)throw profile.error;accounts=(profile.data||[]).filter(a=>a.characters?.is_public);
  if(selected!=='all'&&!accounts.some(a=>a.character_id===selected))selected='all';
  const result=await db.from('social_posts').select('id,author_character_id,body,published_at,created_at').eq('status','published').eq('visibility','public').not('author_character_id','is',null).order('published_at',{ascending:false}).limit(100);
  if(result.error)throw result.error;const allowed=new Set(accounts.map(a=>a.character_id));posts=(result.data||[]).filter(p=>allowed.has(p.author_character_id));
  try{await fetchLikes();}catch(e){console.warn('萬象傳書按讚紀錄讀取失敗',e);showState('書札已載入，但按讚紀錄暫時無法同步：'+(e?.message||String(e)),true);}
  await fetchComments();renderFilters();renderPosts();
 }catch(e){$('feed').replaceChildren();showState('讀取失敗：'+(e?.message||String(e)),true);}
 finally{loading=false;}
}
load();
})();
</script>
</body></html>
