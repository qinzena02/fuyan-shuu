.focused-post{outline:1px solid #c6a66f;outline-offset:3px;scroll-margin-top:24px}.name a{color:inherit;text-decoration:none}.name a:hover{text-decoration:underline}

/* 萬象傳書：站內傳書通知 */
.header-nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

<main>
<div class="eyebrow">WAN XIANG · LETTERS</div><h1>萬象傳書</h1>
<p class="intro">咸陵城中，千人萬語循脈而行。有人記錄風聲，有人留下隻字片語；你所讀見的，或許正是某段故事的開端。</p>
<nav class="character-strip" aria-label="依角色查看書札"><div class="filters" id="filters"></div></nav>
<div class="layout">
<section aria-label="公開書札動態牆"><div id="playerComposer" class="panel composer hidden"><h2>撰寫書札</h2><textarea id="newPostBody" maxlength="3000" placeholder="江湖所見、城中近聞，皆可留於此處……"></textarea><div id="newImagePreviews" class="image-previews"></div><div class="composer-tools"><label class="upload-label">＋ 附加圖片<input id="newPostImages" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><span id="newImageCount" class="small">0 / 4 張</span><button id="submitPost" type="button">發布書札</button></div><p id="composerStatus" class="composer-status" role="status"></p></div><div class="feed-head"><h2 id="feedTitle">城中書札</h2></div><div id="state" class="state" role="status" aria-live="polite">正在接通萬象傳書……</div><div id="feed"></div><p class="note">此處只顯示已正式發布、允許公開的書札。草稿與尚未解鎖的劇情內容不會顯示。</p></section>
</div>
</main><footer>長明府 · 萬象傳書</footer>

<script>
(()=>{'use strict';
const db=window.fuyanshuDB;
const $=id=>document.getElementById(id);
let accounts=[],posts=[],selected='all',loading=false,currentUser=null;
let likeCounts=new Map(),myLikes=new Set(),likeBusy=new Set();
let commentsByPost=new Map(),commentLoadError="",playerName="行旅者";let pendingImages=[];
function showState(message,error=false){const e=$('state');e.textContent=message;e.className='state'+(error?' error':'');e.classList.remove('hidden');}
function hideState(){$('state').classList.add('hidden');}
function timeText(value){if(!value)return '時間未記錄';const d=new Date(value);return Number.isNaN(d.getTime())?'時間未記錄':d.toLocaleString('zh-TW',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function renderFilters(){
 const root=$('filters');root.replaceChildren();
 const options=[{id:'all',label:'所有書札'},...accounts.map(a=>({id:a.character_id,label:a.characters.name}))];
 for(const opt of options){
  const b=document.createElement('button');b.type='button';
  b.className='filter avatar-filter'+(selected===opt.id?' active':'');
  b.title=opt.label;b.setAttribute('aria-label',opt.label);b.setAttribute('aria-pressed',String(selected===opt.id));
  const portrait=document.createElement('span');portrait.className='sidebar-portrait';
  if(opt.id==='all')portrait.textContent='全';
  else{
   const acc=accounts.find(x=>x.character_id===opt.id);
   if(acc?.characters?.avatar_url&&/^https:\/\//i.test(acc.characters.avatar_url)){
    const img=document.createElement('img');img.src=acc.characters.avatar_url;img.alt='';img.loading='lazy';
    img.onerror=()=>{portrait.replaceChildren();portrait.textContent=opt.label.slice(0,1)};
    portrait.appendChild(img);
   }else portrait.textContent=opt.label.slice(0,1);
  }
  const label=document.createElement('span');label.className='avatar-filter-label';label.textContent=opt.id==='all'?'全部':opt.label;
  b.append(portrait,label);
  b.addEventListener('click',()=>{selected=opt.id;renderFilters();renderPosts();});root.appendChild(b);
 }
}
function renderPosts(){
 const root=$('feed');root.replaceChildren();
 const list=posts.filter(p=>selected==='all'||p.author_character_id===selected);
 $('feedTitle').textContent=selected==='all'?'城中書札':(accounts.find(a=>a.character_id===selected)?.characters?.name||'角色')+'的書札';
 if(!list.length){showState(selected==='all'?'目前還沒有公開書札。':'這位角色尚未發布公開書札。');return;}
 hideState();
 for(const p of list){
  const account=accounts.find(a=>a.character_id===p.author_character_id);if(!account&&!p.author_user_id)continue;
  const character=account?.characters||{name:p.player_name||'行旅者',faction:'咸陵',avatar_url:null},article=document.createElement('article');article.className='post';
  article.id='post-'+p.id;const top=document.createElement('div');top.className='post-top';
  const avatar=document.createElement('div');avatar.className='avatar';
  if(character.avatar_url&&/^https:\/\//i.test(character.avatar_url)){
   const img=document.createElement('img');img.src=character.avatar_url;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{avatar.replaceChildren();avatar.textContent=character.name.slice(0,1)};avatar.appendChild(img);
  }else avatar.textContent=character.name.slice(0,1);
  const identity=document.createElement('div'),name=document.createElement('div');name.className='name';name.textContent=character.name;if(p.author_user_id&&currentUser?.id===p.author_user_id){const link=document.createElement('a');link.href='personal.html';link.textContent=character.name;link.title='查看我的個人示籙與書札';name.replaceChildren(link);}
  
  const meta=document.createElement('div');meta.className='meta';meta.textContent=(account?'@'+account.handle+' · '+(character.faction||'咸陵'):'行旅者')+' · '+timeText(p.published_at||p.created_at);
  identity.append(name,meta);top.append(avatar,identity);
  const body=document.createElement('div');body.className='body';body.textContent=p.body;
  const actions=document.createElement('div');actions.className='post-actions';
  const like=document.createElement('button');like.type='button';like.className='like-button'+(myLikes.has(p.id)?' liked':'');
  like.setAttribute('aria-pressed',String(myLikes.has(p.id)));
  like.setAttribute('aria-label',(myLikes.has(p.id)?'取消按讚':'按讚')+'，目前 '+(likeCounts.get(p.id)||0)+' 個讚');
  const heart=document.createElement('span');heart.className='like-icon';heart.textContent=myLikes.has(p.id)?'♥':'♡';heart.setAttribute('aria-hidden','true');
  const count=document.createElement('span');count.textContent=String(likeCounts.get(p.id)||0);
  like.append(heart,count);like.disabled=likeBusy.has(p.id);
  like.addEventListener('click',()=>toggleLike(p.id,like));actions.appendChild(like);

  const error=document.createElement('span');error.className='like-error';error.setAttribute('role','status');error.id='like-error-'+p.id;actions.appendChild(error);
  
  article.append(top,body);if(Array.isArray(p.image_paths)&&p.image_paths.length){const gallery=document.createElement('div');gallery.className='post-images'+(p.image_paths.length===1?' single':'');for(const path of p.image_paths){const {data}=db.storage.from('social-images').getPublicUrl(path);const url=data?.publicUrl;if(!url)continue;const link=document.createElement('button');link.type='button';link.setAttribute('aria-label','放大圖片');const img=document.createElement('img');img.src=url;img.alt='書札附圖';img.loading='lazy';link.appendChild(img);link.addEventListener('click',()=>window.open(url,'_blank','noopener,noreferrer'));gallery.appendChild(link);}article.appendChild(gallery);}article.append(actions);
  article.appendChild(buildComments(p));root.appendChild(article);
 }
}

function buildComments(post){
 const section=document.createElement('section');section.className='comment-section';section.setAttribute('aria-label','書札留言');
 const rows=commentsByPost.get(post.id)||[];
 const heading=document.createElement('div');heading.className='comment-heading';heading.textContent='留言 · '+rows.length;section.appendChild(heading);
 const list=document.createElement('div');list.className='comment-list';
 if(commentLoadError){const warn=document.createElement('p');warn.className='comment-status';warn.textContent='留言暫無法讀取：'+commentLoadError;list.appendChild(warn);}
 else if(!rows.length){const empty=document.createElement('span');empty.className='comment-empty';empty.textContent='尚無留言，留下第一句話。';list.appendChild(empty);}
 const makeItem=(item,isReply=false)=>{
  const card=document.createElement('div');card.className='comment-item'+(isReply?' reply':'');
  const who=document.createElement('span');who.className='comment-author'+(item.author_user_id?' player':'');
  const c=accounts.find(x=>x.character_id===item.author_character_id);
  who.textContent=item.author_character_id?(c?.characters?.name||'角色'):(item.player_profiles?.character_name||'行旅者');
  const when=document.createElement('time');when.className='comment-meta';when.textContent=timeText(item.created_at);when.dateTime=item.created_at;
  const body=document.createElement('div');body.className='comment-body';body.textContent=item.deleted_at?'此留言已刪除':item.body;
  if(item.deleted_at)card.classList.add('comment-deleted');
  card.append(who,body,when);
  if(!item.deleted_at&&currentUser&&item.author_user_id===currentUser.id){
   const more=document.createElement('button');more.type='button';more.className='comment-more';more.textContent='⋯';more.setAttribute('aria-label','留言操作');more.setAttribute('aria-expanded','false');
   const menu=document.createElement('div');menu.className='comment-menu hidden';
   const del=document.createElement('button');del.type='button';del.className='comment-delete';del.textContent='刪除留言';menu.appendChild(del);
   more.addEventListener('click',()=>{menu.classList.toggle('hidden');more.setAttribute('aria-expanded',String(!menu.classList.contains('hidden')));});
   del.addEventListener('click',async()=>{
    if(!confirm('確定刪除這則留言？刪除後內容無法復原。'))return;
    del.disabled=true;
    try{const r=await db.rpc('delete_social_comment',{p_comment_id:item.id});if(r.error)throw r.error;await fetchComments();renderPosts();}
    catch(e){alert('刪除失敗：'+(e?.message||String(e)));del.disabled=false;}
   });
   card.append(more,menu);
  }
  if(!item.deleted_at&&currentUser){
   const replyButton=document.createElement('button');replyButton.type='button';replyButton.className='comment-reply-action';replyButton.textContent='回覆';
   const replyForm=document.createElement('form');replyForm.className='comment-inline-reply hidden';
   const replyInput=document.createElement('textarea');replyInput.rows=2;replyInput.maxLength=1000;replyInput.placeholder='回覆 '+who.textContent+'（最多 1000 字）';replyInput.setAttribute('aria-label','回覆留言');
   const replySend=document.createElement('button');replySend.type='submit';replySend.textContent='送出回覆';
   const replyCancel=document.createElement('button');replyCancel.type='button';replyCancel.textContent='取消';
   const replyStatus=document.createElement('span');replyStatus.className='comment-status';replyStatus.setAttribute('role','status');
   replyButton.addEventListener('click',()=>{replyForm.classList.toggle('hidden');if(!replyForm.classList.contains('hidden'))replyInput.focus();});
   replyCancel.addEventListener('click',()=>replyForm.classList.add('hidden'));
   replyForm.addEventListener('submit',async event=>{
    event.preventDefault();const content=replyInput.value.trim();if(!content)return;
    replySend.disabled=true;replyStatus.textContent='';
    try{const r=await db.from('social_comments').insert({post_id:post.id,parent_id:item.id,author_user_id:currentUser.id,author_character_id:null,body:content});if(r.error)throw r.error;await fetchComments();renderPosts();}
    catch(e){replyStatus.textContent='回覆失敗：'+(e?.message||String(e));replySend.disabled=false;}
   });
   replyForm.append(replyInput,replySend,replyCancel,replyStatus);card.append(replyButton,replyForm);
  }
  return card;
 };
 const byParent=new Map();const known=new Set(rows.map(r=>r.id));
 for(const row of rows){const parent=row.parent_id&&known.has(row.parent_id)?row.parent_id:null;if(!byParent.has(parent))byParent.set(parent,[]);byParent.get(parent).push(row);}
 const visited=new Set();
 function appendThread(row,container,depth=0){
  if(visited.has(row.id))return;visited.add(row.id);
  const thread=document.createElement('div');thread.className=depth?'comment-thread nested':'comment-thread';
  thread.appendChild(makeItem(row,depth>0));
  const children=byParent.get(row.id)||[];
  if(children.length){const branch=document.createElement('div');branch.className='comment-replies';for(const child of children)appendThread(child,branch,depth+1);thread.appendChild(branch);}
  container.appendChild(thread);
 }
 for(const row of byParent.get(null)||[])appendThread(row,list);
 for(const row of rows)if(!visited.has(row.id))appendThread(row,list);
 section.appendChild(list);
 const form=document.createElement('form');form.className='comment-form';
 const input=document.createElement('textarea');input.className='comment-input';input.maxLength=1000;input.rows=2;input.placeholder=currentUser?'留下你的話（最多 1000 字）':'請先登入示籙後留言';input.disabled=!currentUser;input.setAttribute('aria-label','輸入留言');
 const send=document.createElement('button');send.type='submit';send.className='comment-send';send.textContent='送出';send.disabled=!currentUser;
 const status=document.createElement('div');status.className='comment-status';status.setAttribute('role','status');
 form.append(input,send);form.addEventListener('submit',async event=>{
  event.preventDefault();const text=input.value.trim();if(!text||!currentUser)return;
  send.disabled=true;status.textContent='';
  try{const r=await db.from('social_comments').insert({post_id:post.id,author_user_id:currentUser.id,body:text});if(r.error)throw r.error;
   input.value='';await fetchComments();renderPosts();}
  catch(e){status.textContent='留言失敗：'+(e?.message||String(e));send.disabled=false;}
 });section.append(form,status);return section;
}
async function fetchComments(){
 commentsByPost=new Map();commentLoadError='';if(!posts.length)return;
 const ids=posts.map(p=>p.id);
 try{
  const result=await db.from('social_comments').select('id,post_id,parent_id,author_user_id,author_character_id,body,created_at,deleted_at').in('post_id',ids).order('created_at',{ascending:true}).limit(1000);
  if(result.error)throw result.error;
  const rows=result.data||[];
  const userIds=[...new Set(rows.map(r=>r.author_user_id).filter(Boolean))];let names=new Map();
  if(userIds.length){const profile=await db.from('player_profiles').select('user_id,character_name').in('user_id',userIds);if(!profile.error)names=new Map((profile.data||[]).map(p=>[p.user_id,p.character_name]));}
  for(const r of rows){if(r.author_user_id)r.player_profiles={character_name:names.get(r.author_user_id)||'行旅者'};if(!commentsByPost.has(r.post_id))commentsByPost.set(r.post_id,[]);commentsByPost.get(r.post_id).push(r);}
 }catch(e){commentLoadError=e?.message||String(e);}
}

async function fetchLikes(){
 likeCounts=new Map();myLikes=new Set();
 if(!currentUser||!posts.length)return;
 const ids=posts.map(p=>p.id);
 // 依序分頁讀取，避免超過 Supabase 單次預設 1000 筆的上限。
 for(let offset=0;;offset+=1000){
  const r=await db.from('social_post_likes').select('post_id,user_id').in('post_id',ids).order('post_id',{ascending:true}).order('user_id',{ascending:true}).range(offset,offset+999);
  if(r.error)throw r.error;
  const rows=r.data||[];
  for(const item of rows){likeCounts.set(item.post_id,(likeCounts.get(item.post_id)||0)+1);if(item.user_id===currentUser.id)myLikes.add(item.post_id);}
  if(rows.length<1000)break;
 }
}
async function toggleLike(postId,button){
 if(!currentUser){const error=$('like-error-'+postId);if(error)error.textContent='請先從示籙登入帳號，再回來按讚。';return;}
 if(likeBusy.has(postId))return;
 likeBusy.add(postId);button.disabled=true;
 const error=$('like-error-'+postId);if(error)error.textContent='';
 try{
  const liked=myLikes.has(postId);
  const q=liked
   ?db.from('social_post_likes').delete().eq('post_id',postId).eq('user_id',currentUser.id)
   :db.from('social_post_likes').insert({post_id:postId,user_id:currentUser.id});
  const result=await q;if(result.error)throw result.error;
  if(liked){myLikes.delete(postId);likeCounts.set(postId,Math.max(0,(likeCounts.get(postId)||0)-1));}
  else{myLikes.add(postId);likeCounts.set(postId,(likeCounts.get(postId)||0)+1);}
  renderPosts();
 }catch(e){if(error)error.textContent='操作失敗：'+(e?.message||String(e));console.error('萬象傳書按讚失敗',e);}
 finally{likeBusy.delete(postId);button.disabled=false;}
}

 // 通知中心：全服新書札及個人留言通知；僅在已登入時啟用
 let notificationItems=[],notificationRead=new Set(),notificationInitialized=false;
 let notificationChannel=null,notificationPolling=null,notificationBusy=false,toastTimeout=null;
 function notificationTitle(n){
  const actor=n.actor_character_id?accounts.find(a=>a.character_id===n.actor_character_id)?.characters?.name:null;
  const who=actor||(n.actor_user_id?'一位行旅者':'有人');
  if(n.type==='new_post')return who+'發布了新書札';
  if(n.type==='comment_reply')return who+'回覆了你的留言';
  return who+'留言了你的書札';
 }
 function renderNotifications(){
  const count=notificationItems.filter(n=>!notificationRead.has(n.id)).length;
  $('notificationCount').textContent=count>99?'99+':String(count);
  $('notificationCount').classList.toggle('hidden',count===0);
  $('notificationBell').setAttribute('aria-label','傳書通知，'+count+' 則未讀');
  const root=$('notificationList');root.replaceChildren();
  if(!notificationItems.length){const empty=document.createElement('div');empty.className='notification-empty';empty.textContent='目前沒有傳書通知。';root.appendChild(empty);return;}
  for(const n of notificationItems){
   const btn=document.createElement('button');btn.type='button';btn.className='notification-item'+(notificationRead.has(n.id)?'':' unread');
   const title=document.createElement('div');title.className='notification-item-title';title.textContent=notificationTitle(n);
   const meta=document.createElement('div');meta.className='notification-item-meta';meta.textContent=timeText(n.created_at)+(notificationRead.has(n.id)?' · 已讀':' · 未讀');
   btn.append(title,meta);btn.addEventListener('click',async()=>{
    await markNotificationsRead([n.id]);$('notificationPanel').classList.add('hidden');$('notificationBell').setAttribute('aria-expanded','false');
    if(n.post_id){location.href='social.html?post='+encodeURIComponent(n.post_id);}
   });root.appendChild(btn);
  }
 }
 async function markNotificationsRead(ids){
  if(!currentUser||!ids.length)return;
  const unread=ids.filter(id=>!notificationRead.has(id));if(!unread.length)return;
  const rows=unread.map(notification_id=>({notification_id,user_id:currentUser.id}));
  try{
   const r=await db.from('social_notification_reads').upsert(rows,{onConflict:'notification_id,user_id',ignoreDuplicates:true});
   if(r.error)throw r.error;
   unread.forEach(id=>notificationRead.add(id));renderNotifications();
  }catch(e){console.warn('通知已讀標記失敗',e);}
 }
 function showNotificationToast(n){
  const toast=$('notificationToast');toast.textContent='✉ '+notificationTitle(n);toast.classList.remove('hidden');
  toast.onclick=async()=>{await markNotificationsRead([n.id]);toast.classList.add('hidden');if(n.post_id)location.href='social.html?post='+encodeURIComponent(n.post_id);};
  if(toastTimeout)clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>toast.classList.add('hidden'),6500);
 }
 async function syncNotifications(){
  if(!currentUser||notificationBusy)return;notificationBusy=true;
  try{
   const r=await db.from('social_notifications').select('id,type,actor_user_id,actor_character_id,post_id,comment_id,created_at').order('created_at',{ascending:false}).limit(100);
   if(r.error)throw r.error;
   const incoming=r.data||[];
   const reads=await db.from('social_notification_reads').select('notification_id').eq('user_id',currentUser.id).in('notification_id',incoming.length?incoming.map(n=>n.id):['00000000-0000-0000-0000-000000000000']);
   if(reads.error)throw reads.error;
   const freshRead=new Set((reads.data||[]).map(x=>x.notification_id));
   const known=new Set(notificationItems.map(n=>n.id));
   const fresh=notificationInitialized?incoming.filter(n=>!known.has(n.id)&&!freshRead.has(n.id)):[];
   notificationItems=incoming;notificationRead=freshRead;notificationInitialized=true;
   renderNotifications();if(fresh.length)showNotificationToast(fresh[fresh.length-1]);
  }catch(e){
   console.warn('萬象傳書通知讀取失敗',e);
   const root=$('notificationList');if(!notificationInitialized){root.textContent='通知暫時無法讀取：'+(e?.message||String(e));root.className='notification-error';}
  }finally{notificationBusy=false;}
 }
 function startNotifications(){
  if(!currentUser){$('notificationWrap').classList.add('hidden');return;}
  $('notificationWrap').classList.remove('hidden');
  if(notificationPolling)return;
  syncNotifications();notificationPolling=setInterval(()=>{if(!document.hidden)syncNotifications();},20000);
  // Realtime 未啟用時仍有定期同步作為備援
  try{notificationChannel=db.channel('social-notifications-'+currentUser.id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'social_notifications'},()=>syncNotifications())
   .subscribe();}catch(e){console.warn('通知即時訂閱未啟用，使用定期同步',e);}
 }
 $('notificationBell').addEventListener('click',()=>{
  const panel=$('notificationPanel');panel.classList.toggle('hidden');
  $('notificationBell').setAttribute('aria-expanded',String(!panel.classList.contains('hidden')));
  if(!panel.classList.contains('hidden'))syncNotifications();
 });
 $('notificationReadAll').addEventListener('click',()=>markNotificationsRead(notificationItems.map(n=>n.id)));
 document.addEventListener('click',event=>{if(!$('notificationWrap').contains(event.target)){$('notificationPanel').classList.add('hidden');$('notificationBell').setAttribute('aria-expanded','false');}});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNotifications();});

// 玩家圖文書札：圖片選取、預覽與上傳
function composerMessage(text,error=false){const el=$('composerStatus');el.textContent=text;el.classList.toggle('error',error);}
function previewImages(){
 const root=$('newImagePreviews');root.replaceChildren();$('newImageCount').textContent=pendingImages.length+' / 4 張';
 pendingImages.forEach((file,index)=>{
  const box=document.createElement('div');box.className='image-preview';
  const img=document.createElement('img');img.alt='待發布圖片 '+(index+1);
  const url=URL.createObjectURL(file);img.src=url;img.onload=()=>URL.revokeObjectURL(url);
  const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','移除圖片');
  remove.addEventListener('click',()=>{pendingImages.splice(index,1);previewImages();});box.append(img,remove);root.appendChild(box);
 });
}
$('newPostImages').addEventListener('change',event=>{
 const selected=Array.from(event.target.files||[]);event.target.value='';
 for(const file of selected){
  if(pendingImages.length>=4){composerMessage('每篇最多只能附加四張圖片。',true);break;}
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){composerMessage('僅支援 JPG、PNG、WebP。',true);continue;}
  if(file.size>5*1024*1024){composerMessage('單張圖片不能超過 5 MB。',true);continue;}
  pendingImages.push(file);
 }
 previewImages();
});
$('submitPost').addEventListener('click',async()=>{
 if(!currentUser){composerMessage('請先登入示籙。',true);return;}
 const body=$('newPostBody').value.trim();
 if(!body&&!pendingImages.length){composerMessage('請輸入文字或選擇圖片。',true);return;}
 const btn=$('submitPost');btn.disabled=true;composerMessage('正在上傳書札……');
 const uploaded=[];
 try{
  for(const file of pendingImages){
   const extension=({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp' })[file.type];
   const random=crypto.randomUUID();
   const path='players/'+currentUser.id+'/'+random+'.'+extension;
   const result=await db.storage.from('social-images').upload(path,file,{contentType:file.type,upsert:false});
   if(result.error)throw result.error;
   uploaded.push(path);
  }
  const payload={author_user_id:currentUser.id,author_character_id:null,body,status:'published',visibility:'public',published_at:new Date().toISOString(),image_paths:uploaded};
  const result=await db.from('social_posts').insert(payload).select('id');
  if(result.error)throw result.error;
  if(!result.data?.length)throw new Error('貼文未成功寫入資料庫，請確認 RLS 權限。');
  $('newPostBody').value='';pendingImages=[];previewImages();composerMessage('書札已發布。');
  await load();
 }catch(error){
  composerMessage('發布失敗：'+(error?.message||String(error)),true);
  // 失敗時清除本次上傳但尚未引用的圖片
  if(uploaded.length)await db.storage.from('social-images').remove(uploaded);
 }finally{btn.disabled=false;}
});
async function load(){
 if(loading)return;loading=true;showState('正在讀取城中書札……');
 try{
  if(!db)throw new Error('找不到 Supabase 客戶端，請確認 supabase-client.js 已上傳至相同資料夾。');
  const auth=await db.auth.getUser();if(auth.error)throw auth.error;currentUser=auth.data?.user||null;
  const profile=await db.from('character_social_profiles').select('character_id,handle,characters(name,faction,avatar_url,is_public)').eq('is_active',true);
  if(profile.error)throw profile.error;accounts=(profile.data||[]).filter(a=>a.characters?.is_public);
  if(selected!=='all'&&!accounts.some(a=>a.character_id===selected))selected='all';
  const result=await db.from('social_posts').select('id,author_character_id,author_user_id,body,image_paths,published_at,created_at').eq('status','published').eq('visibility','public').order('published_at',{ascending:false}).limit(100);
  if(result.error)throw result.error;const allowed=new Set(accounts.map(a=>a.character_id));posts=(result.data||[]).filter(p=>p.author_user_id||allowed.has(p.author_character_id));const uids=[...new Set(posts.map(p=>p.author_user_id).filter(Boolean))];if(uids.length){const names=await db.from('player_profiles').select('user_id,character_name').in('user_id',uids);if(!names.error){const map=new Map((names.data||[]).map(x=>[x.user_id,x.character_name]));for(const p of posts)if(p.author_user_id)p.player_name=map.get(p.author_user_id)||'行旅者';}}$('playerComposer').classList.toggle('hidden',!currentUser);
  try{await fetchLikes();}catch(e){console.warn('萬象傳書按讚紀錄讀取失敗',e);showState('書札已載入，但按讚紀錄暫時無法同步：'+(e?.message||String(e)),true);}
  await fetchComments();renderFilters();renderPosts();startNotifications();const focusId=new URLSearchParams(location.search).get('post');if(focusId&&/^[0-9a-f-]{36}$/i.test(focusId)){if(selected!=='all'){selected='all';renderFilters();renderPosts();}const target=document.getElementById('post-'+focusId);if(target){target.scrollIntoView({behavior:'smooth',block:'start'});target.classList.add('focused-post');}}
 }catch(e){$('feed').replaceChildren();showState('讀取失敗：'+(e?.message||String(e)),true);}
 finally{loading=false;}
}
load();
})();
